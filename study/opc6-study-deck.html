<title>OPC-6 Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: QRH binder — sticky numbered module rail on the left (chips on phones), checklist pages on the right with challenge ..... response leaders */
:root{
  --paper:#f5f4ef; --page:#ffffff; --ink:#1a1e23; --muted:#5b636e; --rule:#d8d5ca; --soft:#efede6;
  --amber:#e8a400; --amber-ink:#5a3f00; --amber-soft:#fff3cc;
  --orange:#e06a00; --orange-ink:#7a3500; --orange-soft:#fff0e0;
  --red:#b3261e; --red-soft:#fbe5e2; --green:#1f7a4a; --green-soft:#def2e6; --blue:#0b5f8a; --blue-soft:#e3f0f7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14171b; --page:#1c2025; --ink:#e9e7e0; --muted:#a3aab3; --rule:#343a42; --soft:#23282e;
  --amber:#f2b82e; --amber-ink:#ffe3a0; --amber-soft:#3a2f12; --orange:#ff9a3d; --orange-ink:#ffd2a6; --orange-soft:#3a2410;
  --red:#ff8074; --red-soft:#3d1d1a; --green:#62d49c; --green-soft:#15362a; --blue:#6cc3ea; --blue-soft:#15303d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171b; --page:#1c2025; --ink:#e9e7e0; --muted:#a3aab3; --rule:#343a42; --soft:#23282e;
  --amber:#f2b82e; --amber-ink:#ffe3a0; --amber-soft:#3a2f12; --orange:#ff9a3d; --orange-ink:#ffd2a6; --orange-soft:#3a2410;
  --red:#ff8074; --red-soft:#3d1d1a; --green:#62d49c; --green-soft:#15362a; --blue:#6cc3ea; --blue-soft:#15303d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 60px}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px}
header.top{max-width:1180px;margin:0 auto;padding-block:24px 16px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,50px);line-height:1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance}
h4{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.overall{display:flex;align-items:center;gap:12px;background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:10px 14px}
.overall b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.overall small{font-size:13px;color:var(--muted);line-height:1.25}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}

/* Nav rail */
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px);overflow:auto;padding-bottom:12px}
nav.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.rail button{width:100%;display:grid;grid-template-columns:28px 1fr 16px;gap:8px;align-items:center;text-align:left;border:none;background:none;color:var(--ink);font:600 15px/1.2 var(--f-body);padding:8px 8px;border-radius:5px;cursor:pointer}
nav.rail button:hover{background:var(--soft)}
nav.rail button .n{font:600 12px var(--f-mono);color:var(--muted);text-align:center;border:1px solid var(--rule);border-radius:4px;padding:2px 0}
nav.rail button[aria-current="true"]{background:var(--amber);color:#1a1e23}
nav.rail button[aria-current="true"] .n{border-color:#1a1e23;color:#1a1e23}
nav.rail button .ck{font-size:13px;color:var(--green)}
nav.rail button[aria-current="true"] .ck{color:#1a1e23}
nav.rail .grp{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);max-height:none;overflow-x:auto;overflow-y:hidden;padding-block:8px;border-bottom:3px solid var(--amber);scrollbar-width:none}
  nav.rail ol{display:flex;gap:4px}
  nav.rail .grp{display:none}
  nav.rail button{grid-template-columns:auto auto;white-space:nowrap;padding:6px 10px;border:1px solid var(--rule);background:var(--page)}
  nav.rail button .ck{display:none}
}

main{min-width:0}
.mod-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;padding-top:6px;margin-bottom:6px}
.mod-num{font:600 12px var(--f-mono);letter-spacing:.1em;color:var(--amber-ink);background:var(--amber-soft);border:1px solid var(--amber);padding:2px 8px;border-radius:3px}
.lead{color:var(--muted);max-width:72ch;margin:4px 0 18px}
.sec{background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin-bottom:16px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.src-tag{font:600 11px var(--f-mono);letter-spacing:.05em;padding:3px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.src-tag.co{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.src-tag.bg{border-color:var(--amber);color:var(--amber-ink);background:var(--amber-soft)}
.sec p{margin:0 0 10px;max-width:75ch}
.sec ul{margin:0 0 10px;padding-left:20px}
.sec li{margin:3px 0}
.cond{font-size:15px;color:var(--muted);margin:0 0 10px}
.cond b{color:var(--ink)}

/* QRH checklist */
ol.qrh{list-style:none;margin:0;padding:0;font-size:15.5px}
ol.qrh li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 6px;padding:4px 0}
ol.qrh li .no{font:600 13px var(--f-mono);color:var(--muted);padding-top:2px}
ol.qrh li .line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
ol.qrh li .c{flex:0 1 auto}
ol.qrh li .dots{flex:1 1 24px;border-bottom:2px dotted var(--rule);transform:translateY(-4px);min-width:18px}
ol.qrh li .r{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right;flex:0 1 auto;max-width:100%}
ol.qrh li .cf{font:600 11px var(--f-mono);color:var(--red);border:1px solid var(--red);border-radius:3px;padding:0 4px;letter-spacing:.05em}
ol.qrh li.sub{padding-left:28px}
ol.qrh li.note .line{font-size:14.5px}
.memline{display:flex;align-items:center;gap:10px;margin:10px 0;font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--red);text-transform:uppercase}
.memline::before,.memline::after{content:"";flex:1;border-top:2px dashed var(--red)}
.refitems{opacity:.72}
.refitems ol.qrh li .r{font-weight:400}
.cont{font:600 12px var(--f-mono);color:var(--muted);margin-top:8px}
.box{border-radius:5px;padding:9px 12px;font-size:14.5px;margin:10px 0;border:1px solid}
.box.warn{background:var(--red-soft);border-color:var(--red)}
.box.warn b:first-child{color:var(--red)}
.box.note{background:var(--blue-soft);border-color:var(--blue)}
.box.caut{background:var(--amber-soft);border-color:var(--amber)}
.box p:last-child{margin-bottom:0}

/* drills */
.drill .hid{background:var(--ink)!important;color:transparent!important;border-radius:3px;cursor:pointer;user-select:none}
.drill .hid *{visibility:hidden}
.mark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 14px var(--f-body);border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1e23}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.btn.bad[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn:focus-visible,nav.rail button:focus-visible,.thumb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.stat{font:13px var(--f-mono);color:var(--muted)}

/* duty tables */
.tw{overflow-x:auto;margin:6px 0 4px}
table.duty{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
table.duty th{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 10px;background:var(--soft);border:1px solid var(--rule);cursor:pointer;white-space:nowrap}
table.duty th .eye{font-weight:400;color:var(--muted);margin-left:6px;text-transform:none;letter-spacing:0}
table.duty td{vertical-align:top;padding:8px 10px;border:1px solid var(--rule);width:50%}
table.duty td p{margin:0 0 6px}
table.duty td p:last-child{margin:0}
table.duty tr.hdr td{background:var(--amber-soft);font-weight:700;font-family:var(--f-body)}
table.duty tr.span td{background:var(--soft)}
table.duty td.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px)}
.co{font-family:var(--f-mono);font-size:13.5px;font-weight:600;background:var(--amber-soft);padding:0 4px;border-radius:3px;color:var(--amber-ink)}

/* data tables */
table.data{border-collapse:collapse;font-size:15px;width:100%}
table.data th,table.data td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
table.data th{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--muted)}
table.data td.v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.metar{font-family:var(--f-mono);font-size:13.5px;background:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
.kv div{border:1px solid var(--rule);border-radius:5px;padding:8px 10px;background:var(--paper)}
.kv span{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font:600 17px var(--f-mono)}

/* thumbs & lightbox */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumb{width:66px;height:110px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;cursor:pointer;padding:0;background:var(--soft);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb span{position:absolute;left:0;right:0;bottom:0;font:600 9px var(--f-mono);background:rgba(0,0,0,.65);color:#fff;padding:2px 0;text-align:center}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.srcgrid figure{margin:0}
.srcgrid .thumb{width:100%;height:190px}
.srcgrid figcaption{font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:4px}
#lb{position:fixed;inset:0;background:rgba(10,12,15,.92);z-index:50;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#lb .lbbar{display:flex;gap:8px;align-items:center;width:100%;max-width:700px;justify-content:space-between;color:#fff;font:13px var(--f-mono);margin-bottom:8px}
#lb .lbbar button{background:#2a2f36;color:#fff;border:1px solid #444;border-radius:5px;padding:6px 12px;font:600 14px var(--f-body);cursor:pointer}
#lb .lbimg{flex:1;overflow:auto;width:100%;max-width:700px;text-align:center}
#lb img{max-width:100%;height:auto}

/* quiz */
.qcard{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:22px;min-height:220px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-size:20px;font-weight:600;line-height:1.35}
.qcard .a{font-size:16px;background:var(--soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:4px}
.qcard .a[hidden]{display:none}
.qmeta{font:12px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.tag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber)}
.tag.ok{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.tag.red{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.tag.off{background:var(--soft);color:var(--muted);border-color:var(--rule)}
.wk-track{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.wk-dot{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--muted);cursor:pointer;font:600 13px var(--f-mono)}
.wk-dot small{font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.wk-dot.done{border-color:var(--green);color:var(--green)}
.wk-dot[aria-current="true"]{background:var(--amber);border-color:var(--amber);color:#1a1e23}
.wk-head{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:end;margin:4px 0 12px}
.ovh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:#2b3036;padding:12px;border-radius:8px;margin-bottom:14px}
.sw{position:relative;background:#1d2126;border:1px solid #3d444c;border-radius:5px;padding:8px 8px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sw-l{font:600 10px var(--f-mono);letter-spacing:.06em;color:#aab2bc;text-transform:uppercase}
.sw-v{font:700 16px var(--f-mono);color:#7d8791}
.sw.on .sw-v{color:#7fe3a9}
.sw.on{border-color:#2f6b4b}
.sw.chg{outline:2px solid #f2b82e;outline-offset:1px}
.sw-c{position:absolute;top:-8px;right:6px;font:700 9px var(--f-mono);background:#f2b82e;color:#1a1e23;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.wk-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.wk-cols ol,.wk-cols ul{margin:0;padding-left:20px;font-size:15.5px}
.wk-cols li{margin:6px 0}
.wk-fo{border-left:4px solid var(--amber);padding-left:14px}
@media (max-width:720px){.wk-cols{grid-template-columns:minmax(0,1fr)}.ovh{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.calc{font-family:var(--f-mono);font-size:14px}
@media (max-width:560px){.sec{padding:14px}.qcard .q{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fcom{border:2px solid var(--orange);background:var(--orange-soft);border-radius:8px;padding:10px 14px 12px;margin-top:12px}
.fcom .fh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:4px}
.fcom .fh b{font-family:var(--f-display);font-size:18px;color:var(--orange-ink)}
.fcom .fref{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--orange);padding:1px 7px;border-radius:4px}
.fcom p{margin:4px 0}.fcom ul{margin:4px 0;padding-left:20px}
.fcom-legend{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:6px}
.fcom-legend i{width:12px;height:12px;border-radius:3px;border:2px solid var(--orange);background:var(--orange-soft)}
</style>

<header class="top">
  <div>

</header>

<div class="shell">

</div>

 {h:'Tehdit analizi — simülatörden önce bunları çalış', tag:'bg', html:`
  <p>Bu maddeler senaryo verilerinden çıkarıldı. Rakamlar alıştırma içindir; limitleri ve prosedürleri OM-A, OM-B, FCOM ve MEL’den teyit et.</p>
  <ul>
   <li><b>Autothrottle inoperative (MEL 22-04).</b> MEL item’ını, varsa (O) operasyonel prosedürüyle birlikte oku. Her "Autothrottle (if engaged) … Disengage" adımı hızlı bir kontrole ("verify") dönüşür. Takeoff, go-around ve windshear thrust’ı elle ayarlanır. Yaklaşmada hız kontrolü manueldir.</li>
   <li><b>Düşük görüşte kalkış (LVTO).</b> 18L RVR 200 m (R18L/0200N), trend BECMG 0700 +SN. OM-A LVTO minimalarını, LVP gerekliliklerini ve takeoff alternate gerekip gerekmediğini kontrol et.</li>
   <li><b>18L’de yan rüzgâr (crosswind) — tam limitte.</b> 18L pistinde (≈183°) rüzgâr 120/22: açı ≈ 63°. <span class="calc">Crosswind ≈ 22 × sin 63° ≈ 19.6 kt · Headwind ≈ 22 × cos 63° ≈ 10 kt</span>. RWYCC 4 için şirket limiti <b>gust dahil 20 kt</b> (OM-B 1.2.4.6.1). Herhangi bir gust seni limitin üstüne çıkarır. 20 kt üzerinde rolling takeoff şiddetle tavsiye edilir; kuvvetli crosswind’de maksimum takeoff thrust önerilir.</li>
   <li><b>Kontamine pist, RWYCC 4.</b> Kontamine veya kaygan pistlerde assumed temperature ile reduced thrust <b>yapılamaz</b>. Kalkış performansı rapor edilen pist durumuyla hesaplanmalıdır. 18C RWYCC 2’dir ve yalnızca 5 kt crosswind’e izin verir; bu rüzgârda kullanılamaz.</li>
   <li><b>Buzlanma.</b> OAT −4 °C ile SN ve BLSN, icing conditions demektir. Holdover time’larla de-icing planla; engine anti-ice start’tan hemen sonra ON, flaps up ile taxi, run-up’lar (%70 N1) ve kalkıştan önce static run-up. Bunların hepsi Kış Operasyonları modülünde.</li>
   <li><b>EHAM’a dönüş.</b> 06 pisti (≈058°, RWYCC 4) yaklaşık 20 kt crosswind verir; bu tam 20 kt şirket limitinde ve 10 kt autoland limitinin çok üstünde. 69,5 t ile dönüş bir <b>overweight landing</b> olur (MLW 66,360 kg). −4 °C’de cold temperature düzeltmeleri uygulanır. Takeoff alternate’i planla.</li>
   <li><b>Varış LTBJ 34L.</b> 34L pistinde (≈344°) rüzgâr 330/14, neredeyse tam headwind: <span class="calc">headwind ≈ 14 × cos 14° ≈ 14 kt · crosswind ≈ 3 kt</span>. CAVOK. Circling veya visual senaryo için muhtemel bir yer.</li>
   <li><b>Yakıt.</b> Kalkış yakıtı 10,500 kg, minimum yakıt değeri 2,400 kg. Her divert kararında (FORDEC) yakıtı bu minimuma göre takip et.</li>
  </ul>`},
 {h:'Manuel thrust tekniği (A/T INOP) — arka plan', tag:'bg', html:`
  <ul>
   <li><b>Kalkış.</b> Briefing’de takeoff N1’i kimin set edip ince ayarını yapacağını ve ne zaman stabil olması gerektiğini (80 kt’dan önce) kararlaştır. N1 reference bug’larını kullan.</li>
   <li><b>Go-around.</b> TO/GA yalnızca flight director guidance verir. PF, go-around attitude’una doğru rotate ederken thrust lever’ları elle GA N1’e ilerletir.</li>
   <li><b>Windshear ve GPWS.</b> "Aggressively apply maximum thrust" tam ileri demektir. Otomatik uçuştaki windshear durumunda da GA thrust yok; bu yüzden manuel uçuş sütununu uygula.</li>
   <li><b>Alçalma.</b> LVL CHG ve VNAV lever’ları hareket ettirmez. Idle’ı kendin ayarla ve her mod değişiminde hızı izle.</li>
   <li><b>Yaklaşma.</b> Command speed’i elle tut, ona göre trim yap ve erken konfigürasyon planla. Flare tamamen manueldir.</li>
   <li><b>Emergency descent.</b> OM-B zaten "Reduce Thrust Levers to minimum" der. Bunu erken ve bilinçli yap.</li>
  </ul>`}

  <ol style="padding-left:20px;margin:0 0 10px"><li>Kalkış ve iniş için crosswind bileşeni (<b>gust dahil</b>) yukarıdaki değerleri aşmamalıdır.</li><li>Gust’lı ve kuvvetli crosswind koşullarında kalkış için maksimum takeoff thrust önerilir.</li><li>Crosswind 20 knot’u aştığında rolling takeoff prosedürü şiddetle tavsiye edilir.</li><li>İşlem görmemiş karda kalkış, yalnızca erime yoksa yapılır.</li><li>Normal SunExpress operasyonu için minimum pist genişliği 30 m’dir (100 ft).</li><li>İşlem görmemiş karda iniş, yalnızca erime yoksa yapılır.</li><li>İnişte asimetrik reverse thrust kullanıldığında, ıslak veya kontamine pistlerde crosswind değerlerini 5 kt azalt (landing performance araçları bunu kontrol etmez).</li></ol>
  <div class="box caut"><p><b>Pratikte 7. madde:</b> asimetrik reverse, yalnızca bir reverser’ın çalışması demektir (motor inoperative ya da MEL’e göre bir reverser inop). Uçağa yaw verir ve kaygan pistte crosswind kaynaklı weathervaning’i artırır. OPT bunu uygulamaz, o yüzden sen uygulamalısın. <b>OPC-6 OEI EHAM 06’ya dönüş:</b> çalışan motorda reverse planlıyorsan RWYCC 4 limiti 20 kt − 5 = <b>15 kt</b>. Gerçek crosswind yaklaşık 20 kt, yani bu değerin <b>dışında</b>. Ya reverse’süz in (landing distance reverse’süz yeniden hesaplanır ve 20 kt limiti geçerlidir) ya da başka bir pist veya meydan seç.</p></div>
  <div class="box caut"><p><b>CAUTION:</b> Braking action medium’dan kötüyse ne tailwind ile iniş ne de tailwind ile kalkış yapılır.</p><p><b>CAUTION:</b> Yukarıdaki crosswind değerleri Boeing değerlerinden çok daha muhafazakârdır.</p></div>`},

 {h:'Uçak genel', tag:'co', ref:'OM-B 1.2.3.1 · 1.2.4.1 · 1.2.4.3 · 1.2.4.8', src:['IMG_1213','IMG_1214','IMG_1215','IMG_1222'], html:`
  <ul><li>B737-800 <b>Approach CAT C</b>’dir.</li><li>Onaylı: VFR, IFR, RNP, icing conditions, gece, su üstü, CAT II ve CAT III minimalarında automatic coupled approach / autoland (<b>yalnızca dual channel</b>), RVSM.</li><li>RVSM: standby altimetreler RVSM hassasiyetini karşılamaz. Uçuşta Kaptan ile F/O arasında maks. fark: <b>200 ft</b>. Yerde: deniz seviyesi – 5,000 ft: Kaptan &amp; F/O arası 50 ft, meydan irtifasına 75 ft; 5,001 – 10,000 ft: 60 ft / 75 ft.</li><li>PBN: RNAV 10, RNAV 5, RNAV 1, RNP 1, LNAV ve LNAV/VNAV minimalarına kadar RNP APCH. RNAV 10: ground alignment’tan sonra 6.2 h, son DME/DME güncellemesinden sonra 5.9 h, son VOR/DME güncellemesinden sonra 5.7 h. RNAV 5: radyo güncellemesi veya ground alignment’tan sonra 2.0 h.</li></ul>`},
 {h:'Hava sistemleri · Motorlar · APU', tag:'co', ref:'OM-B 1.4.1 · 1.8', src:['IMG_1284','IMG_1295','IMG_1296','IMG_1297','IMG_1298','IMG_1299','IMG_1300'], html:`
  <ul><li>Bir veya iki engine bleed ON iken kalkış, yaklaşma veya inişte pack’leri <b>HIGH</b>’da çalıştırma. Yangın koruma NNC’leri önceliklidir: CARGO FIRE ve SMOKE/FUMES REMOVAL pack’lerin HIGH olmasını gerektirir.</li>
  <li>Motor limit işaretleri: maksimum ve minimum limitler <b>kırmızı</b>, caution limitleri <b>amber</b>.</li>
  <li>Engine ignition şu durumlarda açık olmalı: kalkış · iniş · şiddetli yağmurda operasyon · anti-ice operasyonu.</li>
  <li># Anti-skid inoperative iken assumed temperature ile reduced takeoff thrust’a izin verilmez.</li>
  <li># Uçuşta kasıtlı olarak reverse thrust seçmek yasaktır.</li>
  <li># APU bleed + elektrik yükü: maks. <b>10,000 ft</b> · APU bleed: maks. <b>17,000 ft</b> · APU elektrik yükü: maks. <b>41,000 ft</b>.</li>
  <li>APU bleed valve şu durumlarda kapalı olmalı: ground air bağlı ve isolation valve açık · 1 no’lu motor bleed valve açık · isolation ve 2 no’lu motor bleed valve’ları açık. Engine start sırasında açık olabilir, ama idle üstü motor gücünden kaçın.</li>
  <li>APU start: başarısız denemeler arasında en az <b>30 s</b>; art arda en fazla <b>üç</b> deneme; ardından <b>15 dakikalık</b> soğuma süresi. Bleed air kaynağı olarak kullanmadan önce APU’yu <b>tam iki dakika</b> çalıştır.</li></ul>`},

 {h:'Uçuş kumandaları ve flaps', tag:'co', ref:'OM-B 1.9', src:['IMG_1302','IMG_1303','IMG_1304','IMG_1306','IMG_1307','IMG_1308'], html:`

 {h:'Hızlar · diğer', tag:'co', ref:'OM-B 1.2.2 · 1.2.3', src:['IMG_1211','IMG_1212'], html:`<ul><li># Şiddetli türbülansa giriş hızı: <b>280 KIAS / .76M</b>, hangisi düşükse. Yalnızca tırmanış ve alçalmada; seyirde bkz. Severe Turbulence (SP).</li><li>Ticari uçuşlar: taksi, kalkış ve inişte escape slide girt bar takılı olmalıdır.</li><li># Yakıt ikmali sırasında HF telsizleri çalıştırma (listelenen tesciller).</li></ul>`},
 {h:'Yakıt politikası (OM-A 8.1.7.1)', tag:'co', ref:'OM-A 8.1.7.1', src:['IMG_1376','IMG_1377','IMG_1378','IMG_1379','IMG_1380','IMG_1381','IMG_1382','IMG_1383','IMG_1385','IMG_1386','IMG_1387','IMG_1388','IMG_1389'], html:`<p>SunExpress <b>basic fuel scheme with variations</b> uygular. Gerekli kullanılabilir yakıt = 1–8. kalemler. Planlanan kalkış yakıtı (PLNTOF) = 2–7. kalemler.</p><table class="data"><tr><th>#</th><th>Kalem</th><th>Varyasyon</th><th>OFP kodu</th></tr><tr><td class="v">1</td><td>Taxi</td><td>İstatistiksel olabilir</td><td class="v">TAXI</td></tr><tr><td class="v">2</td><td>Trip</td><td>—</td><td class="v">TRIP</td></tr><tr><td class="v">3</td><td>Contingency (5% or 5 min)</td><td>Fuel ERA ile %3 · RCF (ikisi de fuel monitoring gerektirir, SXS-FLOE-006)</td><td class="v">CONT 5% · CONT 3% ERA · MINCONT</td></tr><tr><td class="v">4</td><td>Destination alternate</td><td>Destination alternate yok (AMC2 CAT.OP.MPA.182(c))</td><td class="v">ALTN · NOALTN HLD</td></tr><tr><td class="v">5</td><td>Final reserve</td><td>—</td><td class="v">FINAL RES</td></tr><tr><td class="v">6</td><td>Additional</td><td>—</td><td class="v">CFS · ADD · DD/DP</td></tr><tr><td class="v">7</td><td>Extra</td><td>—</td><td class="v">WXX · ATC · MEL DEV · OPN · ADD MIN · ADD RES · UNUSABLE</td></tr><tr><td class="v">8</td><td>Discretionary</td><td>—</td><td class="v">DISCF</td></tr></table><ul style="margin-top:10px"><li><b>ADD RES:</b> varışta hesaplanan kalan yakıt <b>2000 kg</b>’ın altındaysa extra fuel planlanır (yalnızca dispatch gerekliliği); final reserve gibi hesaplanır (meydanın 1500 ft üstü, ISA).</li><li><b>ADD MIN:</b> PLNTOF <b>4000 kg</b>’ın altındaysa 4000 kg’a tamamlamak için extra fuel eklenir.</li><li>Uçuş başladıktan sonra contingency, discretionary ve extra fuel öngörülemeyen durumlar için kalkıştan önce kullanılabilir; Kaptan dikkatli bir analiz yapar.</li><li><b>RCF (re-clearance):</b> bir decision point üzerinden destination 1’e planlama, destination 2 ile (opsiyonel yakıt ikmali, RAP). Gerekli yakıt A (dest 1’e: decision point’ten itibaren %5 contingency) veya B’den (dest 2’ye: standart contingency) büyük olanıdır. Decision point’i yalnızca varış ve gerekli alternate’lerdeki hava minimada veya üstündeyse geç.</li><li><b>Uçuşta yeniden planlama:</b> uçuş başladıktan sonra varış, alternate veya rotanın isteğe bağlı değiştirilmesi. Yeni varış; kalan yakıt, imkânlar, hava durumu ve yolcu hizmetlerine göre seçilir. Değiştirilen plan, planning minima dahil tüm yeni uçuş planı gerekliliklerini karşılamalıdır.</li></ul>`},
 {h:'Haberleşme ve navigasyon', tag:'co', ref:'OM-B 1.6 · 1.10.1.1', src:['IMG_1290','IMG_1291','IMG_1292','IMG_1293','IMG_1311'], html:`

]});

/* ---------- 2. NNC philosophy ---------- */
M({id:'nnc', grp:'Hazırlık', t:'Non-Normal Felsefesi', lead:`SunExpress her non-normal’ı nasıl yönetir: kim uçar, kim okur, neyin "Confirm" gerektirdiği ve deferred item’ların nasıl işlediği. Examiner’lar bunu her senaryoda değerlendirir.`, secs:[
 {h:'Non-Normal Durum Yönergeleri · Genel Bakış', tag:'co', ref:'QRH CI.2.9', src:['IMG_1172'], pre:`<p>İş yükünü azaltmak için, mevcut ve uygunsa autoflight sistemini azami ölçüde kullanmayı düşün. Flight director’lar açıksa doğru flight director modlarının seçili olduğundan emin ol.</p>`, table:{cols:['Pilot Flying (PF)','Pilot Monitoring (PM)'], rows:[
   {span:`Recognizes and announces the non-normal situation. Other pilot acknowledges.`},
   [`<b>MAINTAIN AIRPLANE CONTROL</b><p>Ensure that the flight path is under control.</p>`,`Monitor the flight path.`],
   [``,`<b>ANALYZE THE SITUATION</b><p>Review all warning lights, caution lights and other alert lights to identify the non-normal situation. Prioritize alerts and recommend course of action.</p>`],
   [`Acknowledges and confirms the PM's identification or recommendation.`,``],
   {span:`<b>TAKE THE PROPER ACTION</b> — Do the NNC memory items based on each crewmember's area of responsibility.`},
   [`Call for the appropriate NNC.`,``],
   [``,`Completes the NNC.`],
   {span:`Review all warning lights, caution lights and other alerts, and do other NNCs as needed.`},
   {span:`<b>EVALUATE THE NEED TO LAND</b> — Review options for diversion or continued flight.`}
 ]}},
 {h:'"Confirm" adımı', tag:'co', ref:'QRH CI.2.4', src:['IMG_1167'], html:`
  <p>Aksiyon alınmadan önce iki pilotun da sözlü olarak mutabık kalması gereken checklist maddelerine "Confirm" kelimesi eklenir. Uçuşta bir non-normal durumda sözlü teyit şunlar için gereklidir:</p>
  <ul><li>bir engine thrust lever</li><li>bir engine start lever</li><li>bir engine veya APU fire switch ya da cargo fire arm switch</li><li>bir generator drive disconnect switch</li><li>yalnızca bir IRS arızalıyken IRS mode selector</li><li>bir flight control switch</li></ul>
  <p>Bu, Loss of Thrust on Both Engines checklist’i için <b>geçerli değildir</b>.</p>
  <p>Yerdeyken non-normal checklist maddelerinin tamamlanması için teyit <b>gerekmez</b>.</p>
  <p>Confirm adımında söylenecek belirli kelimeler veya bir kumandaya dokunma ya da işaret etme gibi fiziksel hareketler zorunlu değildir.</p>`},
 {h:'Sorumluluk alanları · Inoperative items', tag:'co', ref:'QRH CI.2.4', src:['IMG_1167'], html:`
  <p><b>Uçak yerde sabitken:</b> kaptan ve first officer preflight ve postflight sorumluluk alanlarına göre aksiyon alır; tahliye (evacuation) sırasında <b>first officer flap lever’ı 40’a getirir</b>.</p>
  <p><b>Uçak havadayken veya yerde hareket halindeyken:</b> pilot flying ve pilot monitoring, her birinin sorumluluk alanına (Areas of Responsibility) göre aksiyon alır.</p>
  <p>Kumandayı hareket ettirdikten sonra aksiyonu alan pilot checklist cevabını da söyler.</p>
  <p><b>Inoperative Items.</b> Checklist’ler Inoperative Items tablosunu yalnızca bu maddelerin durumu uçuşun geri kalanını planlamak için gerekliyse içerir. Inoperative item’lar, varsa sonuçlarıyla birlikte, pilot monitoring tarafından sesli okunur. Pilot flying bu bilgiyi tekrar etmek zorunda değildir ama duyulduğunu ve anlaşıldığını teyit etmelidir.</p>`},
 {h:'Deferred items · Checklist complete', tag:'co', ref:'QRH CI.2.4–2.5', src:['IMG_1167','IMG_1168'], html:`
  <p>Non-normal checklist tamamlandıktan sonra, uçağı her uçuş safhası için konfigüre etmek üzere normal prosedürler kullanılır.</p>
  <p>Deferred item yoksa, her safhada konfigürasyonun doğru olduğunu teyit etmek için DESCENT, APPROACH ve LANDING normal checklist’leri kullanılır.</p>
  <p>Deferred item varsa non-normal checklist "<b>Checklist Complete Except Deferred Items.</b>" maddesini içerir. Deferred item olduğu pilot flying’e bildirilmelidir. Bu maddeler alçalma, yaklaşma veya iniş sırasındaki olağan noktaya kadar ertelenebilir.</p>
  <p>Deferred item’lar pilot monitoring tarafından sesli okunur. PF veya PM sorumluluk alanına göre aksiyon alır ve cevabı söyler.</p>
  <p>Bir madde Descent Checklist sonrasına ertelenmişse veya bir normal checklist cevabı değişmişse (değişen cevap <b>kalın</b> basılır), Deferred Items bölümü Descent, Approach ve Landing normal checklist’lerini içerir. Olağan normal checklist’ler yerine bunları kullan.</p>
  <div class="box note"><p><b>Deferred Landing normal checklist sırasında tüm deferred normal checklist maddelerine pilot flying cevap verir.</b> (OM-B 3.10 NOTE: "All Deferred Landing Checklist items shall be responded to by the PF.")</p></div>
  <p>Her non-normal checklist tamamlandıktan sonra pilot monitoring ${co('"___ CHECKLIST COMPLETE."')} der. Checklist complete sembolünden (■ ■ ■ ■) sonra okumaya devam etmek gerekmez.</p>`},
 {h:'Çoklu arıza durumları', tag:'co', ref:'OM-B 3.12.1', src:['IMG_1206'], html:`
  <p>Çoklu arıza durumunda uçuş ekibi, Deferred Items içeren bir Non-Normal Checklist’in öncelikli olup olmadığını belirlemelidir.</p>
  <p>Yalnızca Deferred Items içeren birden fazla checklist kullanılıyorsa, atıf yapılan checklist’in başlığı eklenmelidir, örn. ${co('"ONE ENGINE INOPERATIVE LANDING DEFERRED DESCENT CHECKLIST."')}</p>`},
 {h:'Kalkış arızalarında checklist yönetimi', tag:'co', ref:'OM-B 3.10', src:['IMG_1194','IMG_1195'], html:`
  <p>Non-Normal checklist kullanımı, uçağın uçuş yolu ve konfigürasyonu doğru şekilde kurulduğunda başlar. Yüksek iş yükü anlarında checklist yapmamaya çalış. Ekip bir checklist’i kısa süre durdurmak zorunda kalabilir: ${co('"Hold checklist"')} / ${co('"Holding checklist"')} / ${co('"Continue checklist"')} / ${co('"Continuing checklist"')} PF veya PM söyleyebilir. Checklist’i bekletmeyi Deferred Items ile karıştırma.</p>
  <p>Checklist’leri PF çağırır, PM okur (read and do; challenge – response – action – response) ve sorumluluk alanına göre cevaplanır.</p>
  <p>Checklist adımlarında ileri atlama; örn. APU start &amp; On Bus adımında APU bus’a gelene kadar bekle ("Holding checklist").</p>
  <p>Memory item içeren checklist’lerde PM önce her memory item’ın yapıldığını doğrular. Bu doğrulama sırasında checklist normalde sesli okunur. PF yalnızca checklist ile uyuşmayan maddelerde cevap verir. Ardından PM reference item’ları sesli okur.</p>`},
 {h:'Özel durumlar · En yakın uygun meydan · Acil iniş', tag:'co', ref:'QRH CI.2.6', src:['IMG_1169'], html:`
  <p>Bazı çoklu arıza durumlarında ekip birkaç checklist uygulamak veya unsurlarını birleştirmek zorunda kalabilir. Önce memory item’ları, ardından reference adımlarını yapmayı düşün. Bir non-normal checklist tamamlanınca, başka non-normal checklist gerekip gerekmediğini belirlemek için tüm warning, caution ışıklarını ve diğer uyarıları gözden geçir. Kaptan durumu değerlendirmeli ve sağduyuyla karar vermelidir.</p>
  <p><b>Troubleshooting</b> (yayımlanmış checklist’in ötesindeki adımlar) daha fazla sistem fonksiyonu kaybına yol açabilir. Yalnızca yayımlanmış checklist’i tamamlamak kabul edilemez bir durumla sonuçlanıyorsa düşün.</p>
  <p>Şu durumlarda <b>en yakın uygun meydana in</b>:</p>
  <ul><li>NNC "Plan to land at the nearest suitable airport." içeriyorsa</li><li>yangın veya duman devam ediyorsa</li><li>yalnızca bir AC güç kaynağı kaldıysa (motor veya APU jeneratörü)</li><li>yalnızca bir hidrolik sistem kaldıysa (standby sistem de hidrolik sistem sayılır)</li><li>uçuşa devam edilirse emniyete önemli olumsuz etkisi olacak başka herhangi bir durum.</li></ul>
  <p><b>Acil iniş (immediate landing).</b> Devam eden duman veya tamamen söndüğü kesin teyit edilemeyen bir yangında mümkün olan en erken alçalma, iniş ve tahliye yapılmalıdır. Duman, yangın veya fumes kontrol edilemez hale gelirse acil inişi düşün (bir piste hemen divert); ciddi bir durumda overweight landing, tailwind landing, meydan dışı iniş veya ditching’i düşün.</p>`},
 {h:'Engine shutdown · Göstergeler · Varsayımlar', tag:'co', ref:'QRH CI.2.7', src:['IMG_1170'], html:`
  <p><b>Engine shutdown:</b> motor kapatmayı gerektiren checklist’leri kaptan değerlendirmeli; gerçek bir shutdown’ın mı yoksa reduced thrust’ta çalıştırmanın mı en emniyetli yol olduğuna karar vermelidir.</p>
  <p><b>Gösterge kaybı:</b> motor göstergelerinin kaybı veya sekonder motor göstergelerinin otomatik görüntülenmesi için NNC yoktur. Bir limit aşılmadıkça veya non-normal bir durum oluşmadıkça normal operasyona devam et.</p>
  <p><b>Varsayımlar</b> (seçme):</p>
  <ul><li>Engine start sırasında ve kalkıştan önce non-normal bir durum tespit edilirse ilgili NNC yapılır; ardından dispatch relief için DDG / MEL’e bakılır.</li>
  <li>NNC başlamadan önce sistem kumandaları o uçuş safhasının normal konfigürasyonundadır.</li>
  <li>Sebep anlaşılır anlaşılmaz sesli uyarılar susturulur ve master caution resetlenir.</li>
  <li>Oxygen regulator: kirleticileri uzaklaştırmak için pozitif basınç gerekiyorsa <b>EMERGENCY</b>; pozitif basınç gerekmiyor ama kokpit havası kirliyse <b>100%</b>; durum izin veriyorsa uzun süreli kullanımda <b>Normal</b>.</li>
  <li>NNC’ler, öngörülen non-normal koşullara girmeye izin vermek veya bir non-normal olay beklentisiyle sistemleri devre dışı bırakmak için kullanılmamalıdır.</li></ul>`},
 {h:'Circuit breaker’lar · Konfigürasyon kontrolü · Kaptanın takdiri', tag:'co', ref:'QRH CI.2.8', src:['IMG_1171'], html:`
  <p>Uçuşta atmış bir circuit breaker’ı resetlemek önerilmez (effectivity’ye göre bir NNC yönlendirmedikçe). Kaptanın değerlendirmesine göre çalışmayan sistem emniyetli uçuşa ve inişe devam etmeyi tehlikeye atabilecekse, atmış bir CB kısa bir soğuma süresinden sonra (<b>yaklaşık 2 dakika</b>) <b>bir kez</b> resetlenebilir. Yerde, ancak bakım emniyetli olduğunu belirledikten sonra. Non-normal bir durumu gidermek için CB’yi açıp kapatmak, bakım yönlendirmedikçe önerilmez.</p>
  <p><b>Konfigürasyon kontrolü:</b> engine start’tan sonra ve kalkıştan önce kırmızı warning, amber caution veya başka bir uyarı ilgili checklist’i gerektirir. MASTER CAUTION recall sırasında yanan amber ışık reset sonrası sönüyorsa checklist gerekmez.</p>
  <p><b>Kaptanın takdiri:</b> checklist’ler her durumu kapsayamaz; kaptanın takdiriyle sapma gerekebilir.</p>`},

 {h:'Karar verme — FORDEC', tag:'bg', ref:'OM-A', html:`
  <p>OM-B 3.10, After Takeoff checklist ve hava durumu talebinden sonra <b>OM-A’ya göre FORDEC</b> ister. Standart FORDEC:</p>
  <table class="data"><tr><td class="v">F</td><td><b>Facts</b> — ne oldu, ne çalışıyor, yakıt, hava, zaman</td></tr><tr><td class="v">O</td><td><b>Options</b> — dönüş, takeoff alternate, en-route, devam</td></tr><tr><td class="v">R</td><td>Her seçeneğin <b>Risks &amp; benefits</b>’i (risk ve faydaları)</td></tr><tr><td class="v">D</td><td><b>Decision</b> — kaptan karar verir, ekip mutabık kalır</td></tr><tr><td class="v">E</td><td><b>Execute</b> — bilgilendir (ATC, TTRR ile SCCM, PAX, IOCC), hazırla (FMC, kartlar, navaid’ler, landing performance), TEM briefing, deferred checklist’ler</td></tr><tr><td class="v">C</td><td><b>Check</b> — her şey hâlâ yolunda ve plana göre mi işliyor; koşullar değişti mi</td></tr></table><p style="margin-top:8px">EHAM ve çevre meydanlar için tam çözümlü FORDEC <b>Divert ve FORDEC</b> modülünde.</p>
  <p style="margin-top:10px">Tam ifadeyi ve kabin briefing formatını OM-A’ndan teyit et.</p>`}

 {ph:'Kokpit', t:'De-icing gerekli mi? → talep et', where:'Park yerinde', p:{apu:'ON',apub:'ON',bleed:'ON',start:'OFF',eai:'OFF',wai:'OFF',probe:'ON',flaps:'UP'},
  fo:[`−4 °C’de kar yağıyor ve uçak bir süredir bekliyor. Kar kritik yüzeylere yapışıyor, bu yüzden <b>de-icing/anti-icing gerekli</b> (clean aircraft concept: kalkışta kanatlara, kuyruğa ve kumanda yüzeylerine hiçbir şey yapışmış olamaz).`,`<b>AMS (QRH istasyon listesi):</b> Menzies, <b>Kilfrost ABC-K Plus, Type II → marka bazlı HOT Table 10</b>. Marka tablosu yalnızca anti-icing code marka adını bildiriyorsa kullanılabilir; aksi halde generic Type II tablosunu (Table 4) kullan.`,`<b>Two-step (QRH Table 61, OAT −3 ile −14 °C arası):</b> 1. adım: ısıtılmış Type I/II/III/IV karışımıyla de-icing, donma noktası OAT’de veya altında. 2. adım: yaklaşık 3 dakika içinde Type II <b>100/0 veya 75/25</b> ile anti-icing (50/50’ye izin yok: LOUT −3.5 °C ve Table 61). Anti-icing kanatlara ve kuyruğa uygulanır; gövdeye yalnızca PIC talebiyle, ön kapının önüne veya radome’a asla Type II uygulanmaz.`,`<b>HOT (aşağıdaki tabloya bak):</b> RVR’yi değil METAR görüşünü kullan. Gündüz −1 °C veya daha soğukta 1000 m <b>moderate</b> kar demektir → −3 ile −8 °C’de Table 10: <b>100/0 0:55–1:30</b>, 75/25 0:35–1:05. Blowing snow ve 22 kt rüzgâr HOT’u en düşük değerin altına indirebilir. Gece 1000 m <b>heavy</b> sayılır → <b>HOT yok</b>.`,`Frekanslar (EHAM ground chart): <b>Snowdesk 121.305</b> (de-icing), <b>Padcontrol 121.605</b>. AOI’nin (sayfa 24–25) teyit ettiği sıra: <b>GND → Padcontrol → Iceman</b>. Snowdesk’in tam rolü (sipariş) AOI sayfa 22–23’te; bu sayfalar yüklenmedi.`,`<b>Standart işlem</b> (ayrıca söylemene gerek yok): two-step, Type II, kanatlar ve kuyruk. <b>Ekstralar</b> (ör. <b>fuselage de-icing</b>, PIC talebi) ilk temasta <b>Iceman</b>’e bildirilir (AOI: "contact Iceman with call sign and report additional requests (e.g. fuselage de-icing) if applicable"). Ön kapının önüne asla Type II uygulanmaz. Motorlara, probe’lara, camlara ve tekerleklere asla sıvı püskürtülmez.`],
  cpt:[`İşleme ve ekstralara (ör. gövde) karar verir.`],

 {ph:'Start', t:'Motor çalıştırma ve engine anti-ice ON', where:'Pushback / park yeri', p:{apu:'ON',apub:'ON',bleed:'ON',start:'CONT',eai:'ON',wai:'OFF',probe:'ON',flaps:'UP'},

 {ph:'Start', t:'Taksiden önce', where:'Park yeri', p:{apu:'ON',apub:'ON',bleed:'ON',start:'CONT',eai:'ON',wai:'OFF',probe:'ON',flaps:'UP'},

  <section class="sec"><div class="sec-head"><h3>Holdover time — EHAM’da OPC-6</h3><span class="src-tag co">SXS QRH OPS.3 · Tables 10, 54, 61</span></div>
   <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))">
    <div><h4>1 · Görüşe göre kar yoğunluğu (Table 54)</h4>
     <div class="tw"><table class="data"><tr><th>METAR visibility</th><th>Day ≤ −1 °C</th><th>Night ≤ −1 °C</th></tr>
      <tr><td class="v">≤ 600 m</td><td>Heavy</td><td>Heavy</td></tr>

      <tr><td class="v">&gt;2600 m</td><td>Very light / light</td><td>Light / very light</td></tr></table></div>
     <p class="cond" style="margin-top:6px">EHAM’ın 1000 m’si ve trend 700 m ikisi de vurgulu satıra düşer. HOT için <b>RVR kullanılamaz</b>. METAR’daki "−/+" işaretini değil, görüş tablosundaki yoğunluğu kullan.</p>
     <p class="cond" style="margin-top:6px"><b>Görüş ≠ RVR.</b> HOT, METAR prevailing visibility’yi (<b>1000 m</b>) kullanır. 18L RVR (<b>R18L/0200N</b>) ise takeoff minima (18L: RVR 125 m), LVTO/LVP ve RVR 200 m’nin altında FO’nun kalkışta PM olması kuralı içindir. Burada RVR daha düşük, çünkü pist boyunca blowing snow onu düşürüyor. Gece aynı 1000 m satırı <b>heavy snow</b> okunur ve tablo HOT vermez.</p></div>
    <div><h4>2 · Kilfrost ABC-K Plus Type II (Table 10), kar</h4>
     <div class="tw"><table class="data"><tr><th>OAT</th><th>Conc.</th><th>Snow / SG / SP</th><th>Snow + FZFG</th></tr>

     <p class="cond" style="margin-top:6px">Düşük değer daha yoğun moderate kar içindir. Kuvvetli rüzgâr, jet blast veya <b>blowing snow</b> HOT’u en düşük sürenin altına indirebilir. Generic Type II (Table 4), −3 ile −8 °C, 100/0: 0:20–0:40.</p></div>

    <tr><td>Engine anti-ice ON</td><td><span class="tag ok">OK</span> Gerekli: engine start’tan kalkışa kadar icing conditions var.</td></tr>
    <tr><td>Wing anti-ice OFF</td><td><span class="tag ok">Type II/IV ise OK</span> OM-B yerde OFF’a yalnızca Type II/IV fluid ile korunuyorsa izin verir. Sadece Type I sonrası yerde wing A/I gerekir, o zaman onunla yeniden hesapla.</td></tr>
    <tr><td>Thrust</td><td><span class="tag ok">OK</span> OPT, kontamine pist için hesaplanmış fixed derate olan TO-2’yi (N1 88.2) seçti. Assumed temperature kullanılmaz; kontamine / kaygan pistte izin verilmez.</td></tr>
    <tr><td>Takeoff minima</td><td><span class="tag ok">OK</span> 18L için RVR 125 m gerekir (AOI); bildirilen RVR 200 m. 200 m’nin altında PF Kaptan’dır.</td></tr>
    <tr><td>Pist durumu</td><td><span class="tag">Kontrol</span> RWYCC 4 / bildirilen kontaminant girilmiş olmalı, "wet" değil.</td></tr>
   </table></section>`;
}
function walkShow(i){
  i=Math.max(0,Math.min(WSTEPS.length-1,i)); store.set('opc6.wk',i);
  const s=WSTEPS[i];
  document.querySelectorAll('.wk-dot').forEach((b,j)=>{b.setAttribute('aria-current', j===i); b.classList.toggle('done', j<i);});
  const prev = i>0?WSTEPS[i-1].p:null;
  document.getElementById('wkCount').textContent = `Adım ${i+1} / ${WSTEPS.length}`;
  document.getElementById('wkBody').innerHTML = `
   <div class="wk-head"><div><div class="eyebrow">${s.ph} · ${s.where}</div><h3 style="font-size:26px;margin-top:2px">${s.t}</h3></div>${s.general?'<span class="src-tag bg">general practice içerir</span>':'<span class="src-tag co">SXS OM-B</span>'}</div>
   <div class="ovh" aria-label="Switch konumları">${WPANEL.map(([k,l])=>{const v=s.p[k], ch=prev&&prev[k]!==v; const on=!['OFF','UP'].includes(v); return `<div class="sw ${on?'on':''} ${ch?'chg':''}"><span class="sw-l">${l}</span><span class="sw-v">${v}</span>${ch?'<span class="sw-c">değişti</span>':''}</div>`}).join('')}</div>
   <div class="wk-cols">
    <div class="wk-fo"><h4>Sen — F/O</h4><ol>${s.fo.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <div><h4>Kaptan</h4><ul>${s.cpt.map(x=>`<li>${x}</li>`).join('')}</ul>
     <h4 style="margin-top:14px">Söyle</h4>${s.say.map(x=>`<p class="co" style="display:block;padding:6px 8px;margin:0 0 6px;font-weight:600">${x}</p>`).join('')}</div>
   </div>${thumbs(s.src)}`;
  document.getElementById('wkPrev').disabled = i===0; document.getElementById('wkNext').disabled = i===WSTEPS.length-1;
  const a=document.querySelector('.wk-dot[aria-current="true"]'); if(a) a.scrollIntoView({block:'nearest',inline:'center'});
}

M({id:'winter', grp:'Yer ve kalkış', t:'Kış Operasyonları', lead:`OM-B 2.30.16.3 Cold Weather Operations, yalnızca NG prosedürleri. OPC-6’da EHAM’dan −4 °C’de, kar ve savrulan kar (blowing snow) altında kalkıyorsun; bu yüzden buradaki her madde senin kalkışın için geçerli.`, secs:[
 {h:'Buzlanma koşulları ve anti-ice mantığı', tag:'co', ref:'OM-B 2.30.16.3', src:['IMG_1223','IMG_1224'], html:`
  <p><b>Buzlanma koşulları (icing conditions)</b>, OAT (yerde) veya TAT (uçuşta) <b>10 °C veya altında</b> olduğunda ve şunlardan biri varsa oluşur:</p>
  <ul><li>görünür nem (bulut, görüşün 1600 m veya daha az olduğu sis, yağmur, kar, sulu kar, buz kristalleri …) varsa, <b>veya</b></li><li>apronda, taksi yollarında veya pistlerde buz, kar, slush ya da durgun su varsa.</li></ul>
  <div class="box caut"><p><b>CAUTION:</b> OAT (yerde) veya TAT (uçuşta) 10 °C’nin üzerindeyken engine veya wing anti-ice kullanma.</p></div>
  <table class="data"><tr><th colspan="2">Thermal anti-icing akış şeması</th></tr>
   <tr><td>Yerde</td><td>Buzlanma koşulları var veya bekleniyor + motor çalıştırıldıktan sonra → <b>ENG ANTI-ICE ON</b>. Uçak Type II veya IV sıvı ile <b>korunmayacaksa</b> → <b>WING ANTI-ICE ON</b>.</td></tr>
   <tr><td>Uçuşta — tırmanış ve seyir</td><td>Görünür nem var veya bekleniyor, TAT ≤ 10 °C ve SAT ≥ −40 °C → ENG ANTI-ICE ON</td></tr>
   <tr><td>Uçuşta — alçalma</td><td>Görünür nem, TAT ≤ 10 °C → ENG ANTI-ICE ON (−40 °C SAT altında da)</td></tr>
   <tr><td>Uçuşta wing anti-ice</td><td>Birincil yöntem (de-icer): buz birikimi görülüyor. İkincil yöntem (anti-icer): holding gibi orta/şiddetli (mod/sev) buzlanmada uzun süreli operasyon. Yaklaşık FL350 üzerinde bleed trip off’a yol açabilir.</td></tr></table>`},
 {h:'Exterior inspection’a eklemeler', tag:'co', ref:'OM-B 2.30.16.3.1', src:['IMG_1225','IMG_1226','IMG_1227'], html:`
  <ul><li><b>Yüzeyler:</b> soğuk yakıt nedeniyle alt kanat yüzeylerinde 3 mm’ye kadar kırağı (frost) kabul edilir; LE devices, kumanda ve tab yüzeyleri, üst kanat, winglet’ler ve balance panel boşlukları kar, buz ve kırağıdan arınmış olmalı. Tüm vent ve port’lar açıksa üst gövdede ince kırağı (hoarfrost) kabul edilir.</li>
  <li><b>Control surface balance panel boşlukları:</b> kar temizliğinden sonra drenajı kontrol et. Biriken su uçuşta donabilir.</li>
  <li><b>Pitot probe’lar ve static port’lar:</b> kar ve buzdan arınmış olmalı. Kar temizliği sonrası akan su static port’ların önünde donup hatalı static okumalara yol açabilir.</li>
  <li><b>Klima giriş ve çıkışları</b> (outflow valve dahil) kar ve buzdan arınmış olmalı. APU çalışıyorsa outflow valve tam açıktır.</li>
  <li><b>Motor girişleri:</b> cowling kar ve buzdan arınmış, fan serbestçe dönüyor olmalı. Uzun süreli bekleme (extended shutdown) sonrası oluşan fan buzu start’tan önce temizlenmeli. Buzlanmada operasyondan (taxi-in/approach) kalan buza, fan serbestçe dönüyorsa ve takeoff thrust’tan önce taksi sırasında atılıyorsa izin verilir.</li>
  <li><b>Yakıt tankı vent’leri</b> buz ve kırağıdan arınmış · <b>Landing gear kapakları</b> kar ve buzdan arınmış · <b>APU hava girişleri</b> APU start’tan önce açık olmalı.</li></ul>`},
 {h:'Preflight · motor çalıştırma · yerde anti-ice', tag:'co', ref:'OM-B 2.30.16.3.2–3.5', src:['IMG_1228','IMG_1229','IMG_1230','IMG_1231','IMG_1232','IMG_1233','IMG_1234'], html:`
  <p><b>Preflight (F/O):</b> PROBE HEAT switches ON — tüm probe heat ışıklarının söndüğünü doğrula.</p>
  <p><b>Motor çalıştırma:</b> −40 °C altında ≥ 1 saat cold soak sonrası (HMU ısıtma) veya −40 °C altında ≥ 3 saat sonrası (starter bakımı) start veya motoring yapılmaz. Yağ basıncı normalin üzerine çıkabilir ve OIL FILTER BYPASS yanabilir — normale dönene kadar idle’da çalıştır. Yağ sıcaklığı stabil olduktan sonra yağ basıncı yüksek kalırsa motoru kapat. Ekranların ısınması gerekebilir.</p>
  <p><b>Yerde engine anti-ice:</b> <b>iki motor da çalıştırıldıktan hemen sonra</b> ON seç ve buzlanma koşullarındaki tüm yer operasyonları boyunca açık tut.</p>
  <ol class="qrh">${[['',`ENGINE START switches`,`CONT`,'','F/O'],['',`ENGINE ANTI-ICE switches`,`ON`,'','F/O'],{note:`Verify COWL VALVE OPEN lights illuminate bright, then dim. Verify COWL ANTI-ICE lights are extinguished.`},['',`When no longer needed: ENGINE ANTI-ICE switches`,`OFF`,'','F/O'],{note:`Verify COWL VALVE OPEN lights illuminate bright, then extinguish.`}].map(s=>stepHTML(s,false)).join('')}</ol>
  <div class="box warn"><p><b>WARNING:</b> Engine anti-ice’ı açmak için gövde üzerindeki görsel buzlanma işaretlerine güvenme. Sıcaklık ve görünür nem kriterlerini kullan.</p></div>
  <p><b>Yerde wing anti-ice:</b> Type II veya IV sıvı ile korunmuyorsan, buzlanma koşullarında motor çalıştırma ile kalkış arasında kullan. De-icing’in alternatifi değildir. WING ANTI-ICE switch ON – F/O (L ve R VALVE OPEN önce parlak, sonra sönük; cycle yapabilir); artık gerekmediğinde OFF – F/O.</p>`},
 {h:'Taksi öncesi · de-icing / anti-icing', tag:'co', ref:'OM-B 2.30.16.3.6 · 3.8', src:['IMG_1235','IMG_1236','IMG_1242','IMG_1243','IMG_1244'], html:`
  <ul><li>GENERATOR 1 and 2 switches ON – F/O. Soğuk yağla IDG’ler 5 dakikaya kadar ihtiyaç duyabilir.</li><li>Flight controls check – C (de-icing sonrasına ertelemeyi düşün). Daha yüksek kumanda kuvvetleri bekle.</li><li>Flaps check – F/O: tam hareket UP → 40 → UP. De-icing gerekiyorsa <b>de-icing tamamlanana kadar ertele</b>.</li><li>Buz, kar, slush veya durgun su üzerinden ya da donma altı yağışta taksi yapıyorsan: <b>flaps up ile taksi yap</b>. Captain gerektiğinde "FLAPS ___" der.</li></ul>
  <h4 style="margin-top:12px">De-icing / anti-icing sırası</h4>
  <ol class="qrh">${[['1',`APU`,`As needed (shut down unless necessary)`,'','F/O'],['2',`Call "FLAPS UP" · Flaps`,`UP`,'','C · F/O'],['3',`Thrust levers`,`Idle`,'','C'],['4',`Stabilizer trim (handles stowed)`,`___ UNITS, green band`,'','C'],['5',`Engine BLEED air switches`,`OFF`,'','F/O'],['6',`APU BLEED air switch`,`OFF`,'','F/O'],{note:`After de-icing / anti-icing is completed:`},['7',`APU · APU BLEED`,`As needed`,'','F/O'],['8',`Wait ~1 minute, then engine BLEED air switches`,`ON`,'','F/O'],['9',`Flight controls`,`Check, as needed`,'','C']].map(s=>stepHTML(s,false)).join('')}</ol>
  <div class="box caut"><p><b>CAUTION:</b> De-icing sonrası kalkışta APU bleed air uçakta dumana neden olabilir. Kalan sıvı geçici olarak lift’i azaltır ve drag’i artırır — normal rotation hızını kullan.</p></div>`},
 {h:'Taxi-out · kalkış öncesi · kalkış (NG)', tag:'co', ref:'OM-B 2.30.16.3.7–3.10', src:['IMG_1237','IMG_1238','IMG_1239','IMG_1245','IMG_1247'], html:`
  <div class="box caut"><p><b>CAUTION:</b> Düşük hızda, küçük steering ve rudder girdileriyle taksi yap; minimum thrust’ı yumuşakça uygula. Durgun de-icing sıvısı üzerinde thrust’ı sınırla (compressor stall riski).</p></div>
  <p><b>Taxi-out run-up</b> (engine anti-ice gerekli ve OAT <b>3 °C veya altı</b>), PF:</p>
  <ul><li>Uçağın arkasındaki alanın boş olduğunu kontrol et.</li><li>En fazla <b>30 dakika</b> aralıklarla, <b>yaklaşık 30 saniye boyunca en az %70 N1</b>’e run-up yap. Fan buzu birikimlidir — fan de-ice edilmediyse taxi-in süresini de hesaba kat.</li><li>%70 mümkün değilse thrust’ı pratik olan en yüksek değere ayarla ve o seviyede süre tut.</li><li>Donan yağmur, çisenti, sis veya yoğun kar: en fazla <b>10 dakika</b> aralıklarla, yaklaşık <b>1 saniye</b> %70 N1’e run-up.</li></ul>
  <p><b>Kalkış öncesi:</b> PF "FLAPS ___" der, flaps bekletildiyse PM takeoff flaps’ı set eder; LE FLAPS EXT yeşil ışığını doğrula.</p>
  <p><b>Kalkış</b> (engine anti-ice gerekli ve OAT ≤ 3 °C): kalkıştan önce <b>en az %70 N1’e statik run-up</b> yapılmalı ve takeoff roll’dan önce motorun stabil çalıştığı teyit edilmeli. 30 saniyelik run-up şiddetle tavsiye edilir.</p>`},
 {h:'Uçuşta: engine ve wing anti-ice · fan buzu temizleme', tag:'co', ref:'OM-B 2.30.16.3.11–3.13', src:['IMG_1249','IMG_1250','IMG_1251','IMG_1253','IMG_1254','IMG_1255','IMG_1256','IMG_1257'], html:`
  <p><b>Engine anti-ice</b>, <b>−40 °C SAT</b> altındaki tırmanış ve seyir dışında, buzlanma koşullarında ON olmalı. −40 °C SAT altı dahil tüm buzlanma koşullarında <b>alçalmadan önce ve alçalma boyunca</b> ON olmalı. Buzlanmaya girmeden önce aç. ENGINE START switches CONT – PM · ENGINE ANTI-ICE ON – PM · COWL ışıklarını doğrula; artık gerekmediğinde ters sırayla (OFF – PM).</p>
  <p><b>Fan buzu temizleme (fan ice removal)</b> (orta ile şiddetli buzlanma, her seferinde tek motor):</p>
  <ol class="qrh">${[['1',`ENGINE START switches (both)`,`FLT`,'','PM'],['2',`Autothrottle (if engaged)`,`Disengage`,'','PF'],['3',`Thrust — increase to min 80% N1 for ~1 second`,`Increase`,'','PF'],['4',`Thrust`,`Reduce as needed`,'','PF'],{note:`Wait 15 seconds. Vibration < 4.0 units: repeat about every 15 minutes. Vibration ≥ 4.0 units: Engine High Vibration NNC.`}].map(s=>stepHTML(s,false)).join('')}</ol>
  <p><b>Uçuşta wing anti-ice:</b> cam çerçevelerinde, orta dikmede (center post) veya silecek kolunda buz, yapısal buzlanmaya işaret eder. Birincil yöntem de-icer’dır (buzun birikmesine izin ver, sonra ON); ikincil yöntem anti-icer’dır ve yalnızca holding gibi uzun süreli orta/şiddetli buzlanmada kullanılır. Buzlanmada flaps açık holding yasaktır. WING ANTI-ICE ON / OFF – PM.</p>`},
 {h:'Soğuk hava irtifa düzeltmeleri', tag:'co', ref:'OM-B 2.30.16.3.14', src:['IMG_1259','IMG_1260','IMG_1261','IMG_1262','IMG_1263','IMG_1264'], html:`
  <p>ISA’dan soğuk havada gerçek irtifa (true altitude) gösterilenden düşüktür. Havalimanı sıcaklığı <b>0 °C veya altında</b> olduğunda uygula:</p>
  <ul><li>Düzeltilmiş MSA’yı belirle.</li><li>Düzeltilmiş MSA’da veya altında kalan tüm yayımlanmış minimum kalkış, en-route ve yaklaşma irtifalarını, missed approach irtifaları ve MDA/DA dahil, düzelt.</li><li>Düzeltmeleri ATC’ye bildir. MDA/DA’yı düzeltilmiş minimalara set et.</li><li>Altimetre referans kaynağı üzerindeki yükseklik = yayımlanmış irtifa − havalimanı elevasyonu. Tabloya gir, düzeltmeyi ekle, MCP irtifasını bir sonraki 100 ft’e yukarı yuvarla. Son sütunun üzerinde doğrusal ekstrapolasyon kullan. Altimetre ayarını düzeltme.</li></ul>
  <p><b>Gerekmez:</b> ATC radar vektörleri altında · ATC’nin verdiği bir FL’de uçarken · düzeltilmiş MSA üzerinde · bildirilen havalimanı sıcaklığı 0 °C’nin üzerindeyken.</p>
  <p><b>RNP yaklaşmaları:</b> LNAV minimaları — düzeltilmiş MSA altındaki tüm irtifaları düzelt. 0 °C veya altında LNAV/VNAV ya da RNP AR — düzeltilmiş MSA altındaki initial, intermediate, missed approach segmentlerini ve DA’yı düzelt; FAP ve DA’ya kadarki kontrol noktaları için düzeltme yok. Kartın tasarım sıcaklığının altında: LNAV/VNAV’a izin yok (LNAV’a dön, hepsini düzelt), RNP AR yetkili değil.</p>
  <p><b>Araçlar:</b> LIDO mPilot CTC tool; yoksa OM-B / QRH tablosu (daha konservatif). EO missed approach için yalnızca OPT’den gelen acceleration altitude’ları düzelt; takeoff acceleration height için düzeltme yok.</p>
  <h4>Düzeltme tablosu (metre) — altimetre referans kaynağı üzerindeki yükseklik</h4>
  <div class="tw"><table class="data" style="min-width:600px"><tr><th>Sıcaklık</th><th>60</th><th>90</th><th>120</th><th>150</th><th>180</th><th>210</th><th>240</th><th>270</th><th>300</th><th>450</th><th>600</th><th>900</th></tr>
   <tr><td class="v">0°</td><td class="v">5</td><td class="v">5</td><td class="v">10</td><td class="v">10</td><td class="v">10</td><td class="v">15</td><td class="v">15</td><td class="v">15</td><td class="v">20</td><td class="v">25</td><td class="v">35</td><td class="v">50</td></tr>
   <tr><td class="v">−10°</td><td class="v">10</td><td class="v">10</td><td class="v">15</td><td class="v">15</td><td class="v">20</td><td class="v">20</td><td class="v">25</td><td class="v">30</td><td class="v">30</td><td class="v">45</td><td class="v">60</td><td class="v">90</td></tr>
   <tr><td class="v">−20°</td><td class="v">10</td><td class="v">15</td><td class="v">20</td><td class="v">25</td><td class="v">25</td><td class="v">30</td><td class="v">35</td><td class="v">40</td><td class="v">45</td><td class="v">65</td><td class="v">85</td><td class="v">130</td></tr>
   <tr><td class="v">−30°</td><td class="v">15</td><td class="v">20</td><td class="v">25</td><td class="v">30</td><td class="v">35</td><td class="v">40</td><td class="v">45</td><td class="v">55</td><td class="v">60</td><td class="v">85</td><td class="v">115</td><td class="v">170</td></tr>
   <tr><td class="v">−40°</td><td class="v">15</td><td class="v">25</td><td class="v">30</td><td class="v">40</td><td class="v">45</td><td class="v">50</td><td class="v">60</td><td class="v">65</td><td class="v">75</td><td class="v">110</td><td class="v">145</td><td class="v">220</td></tr>
   <tr><td class="v">−50°</td><td class="v">20</td><td class="v">30</td><td class="v">40</td><td class="v">45</td><td class="v">55</td><td class="v">65</td><td class="v">75</td><td class="v">80</td><td class="v">90</td><td class="v">135</td><td class="v">180</td><td class="v">270</td></tr></table></div>
  <h4 style="margin-top:12px">Feet tablosu (yalnızca ekran görüntüsündeki sütunlar)</h4>
  <div class="tw"><table class="data" style="min-width:520px"><tr><th>Sıcaklık</th><th>200</th><th>300</th><th>400</th><th>500</th><th>600</th><th>700</th><th>800</th><th>900</th></tr>
   <tr><td class="v">0°</td><td class="v">20</td><td class="v">20</td><td class="v">30</td><td class="v">30</td><td class="v">40</td><td class="v">40</td><td class="v">50</td><td class="v">50</td></tr>
   <tr><td class="v">−10°</td><td class="v">20</td><td class="v">30</td><td class="v">40</td><td class="v">50</td><td class="v">60</td><td class="v">70</td><td class="v">80</td><td class="v">90</td></tr>
   <tr><td class="v">−20°</td><td class="v">30</td><td class="v">50</td><td class="v">60</td><td class="v">70</td><td class="v">90</td><td class="v">100</td><td class="v">120</td><td class="v">130</td></tr>
   <tr><td class="v">−30°</td><td class="v">40</td><td class="v">60</td><td class="v">80</td><td class="v">100</td><td class="v">120</td><td class="v">140</td><td class="v">150</td><td class="v">170</td></tr>
   <tr><td class="v">−40°</td><td class="v">50</td><td class="v">80</td><td class="v">100</td><td class="v">120</td><td class="v">150</td><td class="v">170</td><td class="v">190</td><td class="v">220</td></tr>
   <tr><td class="v">−50°</td><td class="v">60</td><td class="v">90</td><td class="v">120</td><td class="v">150</td><td class="v">180</td><td class="v">210</td><td class="v">240</td><td class="v">270</td></tr></table></div>
  <div class="box caut"><p><b>OPC-6:</b> EHAM −4 °C; bu yüzden düzeltilmiş MSA altında ve radar vektörü olmadan uçulan her EHAM yaklaşmasında veya engine-out dönüşünde düzeltme uygulanır.</p></div>`},
 {h:'Çözümlü örnek — −4 °C’de EHAM ILS 06', tag:'co', ref:'mPilot CTC · OM-B 2.30.16.3.14', src:['IMG_1080','IMG_1081','IMG_1082'], html:`
  <p>Havalimanı sıcaklığı −4 °C (≤ 0 °C); bu yüzden kendi navigasyonunla (radar vektörü olmadan) uçacağın, <b>düzeltilmiş MSA altındaki</b> her yayımlanmış irtifayı düzelt. ILS, "all other approaches" kapsamına girer.</p>
  <div class="tw"><table class="data" style="min-width:520px"><tr><th>Ne</th><th>Yayımlanan</th><th>Düzeltilmiş (CTC)</th><th>Set / kullanım</th></tr>
   <tr><td>AM110 / AM609 / OSRON, FAP ve <b>missed approach irtifası</b></td><td class="v">2000</td><td class="v">2150</td><td>MCP 2200 (bir sonraki 100 ft); ATC’ye bildir</td></tr>
   <tr><td>GS check 6 DME</td><td class="v">1960</td><td class="v">2100</td><td>GS üzerinde irtifa kontrolü</td></tr>
   <tr><td>GS check 5 DME</td><td class="v">1640</td><td class="v">1760</td><td>irtifa kontrolü</td></tr>
   <tr><td>GS check 3 DME</td><td class="v">1010</td><td class="v">1090</td><td>irtifa kontrolü</td></tr>
   <tr><td>GS check 2 DME</td><td class="v">690</td><td class="v">740</td><td>irtifa kontrolü</td></tr>
   <tr style="outline:2px solid var(--amber)"><td><b>DA (CAT I DME)</b></td><td class="v">190 (DH 200)</td><td class="v">≈ 210</td><td>BARO minimums — <b>tool’a ekle</b></td></tr>
   <tr style="outline:2px solid var(--amber)"><td><b>MDA (LOC DME)</b>, GS arızalanırsa</td><td class="v">410</td><td class="v">≈ 450</td><td>tool’a ekle</td></tr>
   <tr><td>FPA / GA gradyanı</td><td class="v">3.0° / 2.5 %</td><td class="v">3.2° / 2.7 %</td><td>bilgi</td></tr></table></div>
  <div class="box note"><p><b>Radar vektörü ve kendi navigasyonun.</b> "Descend 2000, turn left heading 030, cleared ILS 06" bir radar vektörüdür: arazi emniyetinden ATC sorumludur, bu yüzden düzeltme yapmadan <b>2000</b>’e alçalırsın. Glideslope geometriktir ve sıcaklıktan etkilenmez. GS üzerinde altimetre kartın gösterdiğinden yüksek okur (6 DME’de 1960 yerine yaklaşık 2100); bu beklenen bir durumdur, sapma değildir. Kendi navigasyonunla uçuyorsan (RNAV transition, yayımlanmış prosedür, missed approach) düzeltme yaparsın: <b>DA ≈ 210</b> ve <b>MCP’de missed approach 2200</b>, ayrıca ATC’ye bildirirsin.</p></div>
  <ul style="margin-top:10px"><li>THR / AD elevasyonu: EHAM <b>−11 ft</b>. 0 girmek neredeyse hiçbir şeyi değiştirmez, ama tam doğru olması için −11 gir.</li><li>Düzeltme yok: radar vektörü altındayken, ATC’nin verdiği FL’de, düzeltilmiş MSA üzerinde ve CAT II/III’teki RA tabanlı DH için. Altimetre ayarını değiştirme.</li><li>EO missed approach: yalnızca OPT’den gelen EO acceleration altitude’ları düzelt. Takeoff acceleration height düzeltilmez.</li></ul>`},
 {h:'İniş sonrası · shutdown · secure', tag:'co', ref:'OM-B 2.30.16.3.15–3.18', src:['IMG_1265','IMG_1266','IMG_1267','IMG_1270','IMG_1271','IMG_1273','IMG_1274','IMG_1275','IMG_1276'], html:`
  <ul><li>Yaklaşma ve iniş: normal prosedürleri ve referans hızları kullan.</li><li>Flaps açıkken uzun süreli buzlanma, gövdede görülen buz veya kontamine pist/taksi yolu sonrasında: flap bölgelerinin kontaminasyondan arınmış olduğu kontrol edilene kadar <b>flaps’ı 15’ten aza toplama</b>.</li><li>Buzlanmada yer operasyonları için engine anti-ice ON: ENGINE START CONT – PM, ENGINE ANTI-ICE ON – PM. Taxi-in run-up’ları taxi-out’taki gibi (%70 N1 ~30 s, ≤ 30 dk aralık; donan yağış: ~1 s, ≤ 10 dk’da bir).</li><li>Buzlanmada iniş sonrası <b>shutdown</b>: Stabilizer trim — <b>5 units set et</b> – C (eriyen karın tailcone’a akıp kumandaları dondurmasını önler).</li><li><b>Secure</b>, uçak başında biri var ve sıcak hava isteniyorsa: APU start, APU GEN ON, PACKS AUTO, ISOLATION VALVE OPEN, pressurization MAN, outflow valve OPEN (rüzgâra karşı park et), APU BLEED ON — hepsi F/O. Başında kimse yok / gece bekleme: pressurization MAN, outflow valve CLOSE (F/O), takozlar yerinde, <b>parking brake released</b> (C). −18 °C altında bataryalar: sök ve −18 °C’den sıcak ama 40 °C’den soğuk bir yerde sakla.</li></ul>`}
]});

M({id:'lvo', grp:'Yer ve kalkış', t:'Düşük Görüş Operasyonları (LVO)', lead:`EHAM 18L’de RVR 200 m ve CAT II/III dönüş, ikisi de OPC-6 data sheet’inde var. Kaynaklar: OM-A 8.4.1.4–8.4.1.5 ve OM-B 1.5. LVTO minima sayfaları ekran görüntülerinde yoktu; onları OM-A’dan kontrol et.`, secs:[
 {h:'CAT II / III yaklaşmada ekip koordinasyonu', tag:'co', ref:'OM-A 8.4.1.4', src:['IMG_1338','IMG_1340'], pre:`<p><b>Önlemler:</b> callout’lara kesinlikle uyulmalı (ekip koordinasyonu, incapacitation tespiti). Autoland sırasında beklenmedik kumanda sapmalarına hazırlıklı ol — autopilot’lara karşı koymaya çalışmak yerine onları kapat.</p>`, table:{cols:['PF','PM'], rows:[
   [`• Has hands on controls and thrust levers throughout the approach.<p>• Lands or performs a go-around.</p><p>• Makes MCP selections (if any).</p><p>• Takes manual control in the event of AP disengagement.</p><p>• Monitors flight instruments.</p>`,`• Monitors flight instruments head-down throughout approach, go-around or landing until roll-out is completed.<p>• Calls any deviation or failure warning.</p><p>• Monitors barometric heights and auto call-outs and performs callouts according to OM-B.</p><p>• Monitors FMA and calls mode changes as described in OM-B.</p><p>• If there is no response from PF, initiates a go-around.</p>`],
   {hdr:`100 ft above DH RA`},
   [`Starts to look for visual references, progressively increasing external scanning as DH is approached.`,`<b>CAUTION:</b> In case any malfunction occurs after the Captain is "head up", F/O shall call out ${co('"GO AROUND"')}.`],
   {hdr:`At DH (if PF decision is to continue)`},
   [`Scans head-up to monitor the flight path and flare (in CAT II or CAT III) by visual references.`,`Monitors flight instruments <b>head-down</b> throughout landing until roll-out is completed.`]
 ]}},
 {h:'LVO’da First Officer’ın rolü', tag:'co', ref:'OM-A 5.1.4.5 · 5.1.4.5.2', src:['IMG_1392','IMG_1395'], html:`<p>LVO; RVR’ın <b>400 m’den az</b> olduğu kalkış ile CAT II ve III yaklaşma ve iniş demektir.</p><div class="box caut"><p><b>NOTE:</b> MCC’ye göre belirli görevlere sıkı bağlılık gerektiren yüksek iş yükü nedeniyle, <b>First Officer’lar RVR’ın 200 m’den az olduğu görüş koşullarındaki kalkışlarda ve CAT II/III operasyonlarında PM olarak görev yapar.</b></p></div><p><b>EHAM AOI takeoff minima:</b> 06, 27, 18C/36C RVR 75 m · 09, 24, <b>18L</b>, 36L <b>RVR 125 m</b> · 22 400 m · 04 400 m (V) · 18R/36R yetkili değil.</p><p><b>OPC-6:</b> 18L RVR 200 m, yani LVTO. 200 m altında kalkışı Captain uçar. Tipe yeni Commander’lar 40 sektöre kadar CAT II / III RVR minimalarına 100 m ekler (OM-A 5.1.4.5.1).</p>`},
 {h:'LVO ekip brifingi', tag:'co', ref:'OM-A 8.4.1.5', src:['IMG_1341'], html:`
  <p>Düşük görüş yaklaşma briefing’i LVO checklist maddelerini, normal approach briefing maddelerini ve ilk yaklaşmadan önce şunları içerir:</p>
  <ul><li>Ekip yeterlilik geçerliliği (currency).</li><li>Uçak sistemlerinin durumu ve kapasitesi.</li><li>Varış ve yedek meydan hava durumu.</li><li>Meydan ve pistin CAT II / CAT III operasyonel durumu, LVP.</li><li>Otomatik iniş (autoland) seçeneğiyle hesaplanmış iniş performansı.</li><li>Görev paylaşımının ve 1000 ft altında arıza durumundaki prosedürün kısa tekrarı.</li><li>SCCM’e düşük görüş yaklaşması yapılacağının bildirilmesi (yolcu PED’i yok).</li><li>Optimum koltuk pozisyonu … (listenin devamı ekran görüntüsünde yok).</li></ul>`},
 {h:'LVO için önemli uçak limitleri', tag:'co', ref:'OM-B 1.5', src:['IMG_1286','IMG_1287','IMG_1289'], html:`
  <ul><li>CAT II / III: <b>dual channel</b> otomatik yaklaşma ve iniş, flaps 30 veya 40, iki motor çalışır, ≤ 8,400 ft PA meydanlar, 45 m’den dar pistlerde değil.</li><li>Gust dahil autoland rüzgâr limitleri: head 25 kt · cross 10 kt · tail 10 kt.</li><li>EFIS control panel arızası → CAT II ve III yasak.</li><li>Single-channel autopilot MUH: 158 ft AGL.</li></ul>
  <div class="box caut"><p><b>OPC-6:</b> EHAM rüzgârı 120/22. Pist 06’da (≈ 055°) bu yaklaşık 20 kt yan rüzgâr (crosswind) demek, 10 kt autoland limitinin üzerinde. Bu rüzgârda 06’ya CAT II/III autoland ile dönüş mümkün değil. RWYCC 4 için şirket crosswind limitinde (20 kt) CAT I yaklaşma planla ve hava durumunu CAT I minimalarıyla karşılaştır, ya da divert et.</p></div>`}
]});
/* ---------- 4. RTO ---------- */
M({id:'rto', grp:'Kalkış', t:'Rejected Takeoff (RTO)', lead:`OM-B 3.9 ve QRH MAN.1.3–1.7. Kararı yalnızca Captain verir. FO olarak doğrular ve callout yaparsın, ya da Captain kontrolü alana kadar uçağı sen uçurursun. OM-B, QRH’te olmayan bir satır ekler: durduktan sonra Captain, Flap Lever’ın 40’a set edildiğini doğrular.`, secs:[
 {h:'Karar yetkisi', tag:'co', ref:'OM-B 3.9', src:['IMG_1182'], html:`
  <p>Kalkışı reddetme kararının <b>tek sorumlusu</b> Captain’dır. Karar, rejected takeoff manevrasına V1’e kadar başlanabilecek zamanda verilmelidir.</p>
  <p>Karar devam etmekse: Captain açıkça ${co('"CONTINUE"')} der. Karar reddetmekse: Captain açıkça ${co('"STOP"')} der, RTO manevrasına hemen başlar ve uçağın kontrolünü alır.</p>
  <div class="box note"><p><b>Kalkışı First Officer yapıyorsa, Captain kumandalara belirgin bir girdi yapana kadar uçağın kontrolü First Officer’da kalır.</b></p></div>
  <p>Kalkış sırasında non-normal durumu fark eden ekip üyesi bunu hemen, olabildiğince açık şekilde söyler. (FCTM Chapter 3, "Rejected Takeoff Decision".)</p>`},
 {h:'Reject kriterleri', tag:'co', ref:'OM-B 3.9', src:['IMG_1182','IMG_1183'], html:`
  <div class="cols" style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))">
   <div><h4>80 knot’tan önce</h4><ul><li>master caution sisteminin devreye girmesi</li><li>sistem arıza(lar)ı</li><li>olağan dışı ses veya titreşim</li><li>lastik arızası</li><li>anormal derecede yavaş ivmelenme</li><li>takeoff configuration warning</li><li>yangın veya fire warning</li><li>engine failure</li><li>predictive windshear warning</li><li>yan cam açılırsa</li><li>uçak emniyetsizse veya uçamayacak durumdaysa</li></ul></div>
   <div><h4>80 knot’un üzerinde ve V1’den önce</h4><ul><li>yangın veya fire warning</li><li>engine failure</li><li>predictive windshear warning</li><li>uçak emniyetsizse veya uçamayacak durumdaysa</li></ul></div>
  </div>`},
 {h:'RTO manevrası', tag:'co', ref:'OM-B 3.9 · QRH MAN.1.3', src:['IMG_1147','IMG_1184','IMG_1185','IMG_1186'], table:{cols:['Captain','First Officer'], rows:[
   [`Without delay:<p>• Call ${co('"STOP"')}.</p>`,`Verify actions as follows:`],

   [`• Apply maximum manual wheel brakes or verify operation of RTO autobrake.<p>If RTO autobrake is selected, monitor system performance and apply manual wheel brakes if the AUTO BRAKE DISARM light illuminates or deceleration is not adequate.</p>`,`• Maximum manual wheel brakes or RTO autobrake operation.<p>If AUTO BRAKE DISARM light illuminates call ${co('"AUTO BRAKE DISARM."')}</p>`],
   [`• Raise SPEED BRAKE lever.`,`• SPEED BRAKE lever UP and call ${co('"SPEED BRAKES UP."')}<p>If SPEED BRAKE lever is not UP, call ${co('"SPEEDBRAKES NOT UP."')}</p>`],
   [`• Apply REVERSE THRUST up to the maximum amount consistent with conditions.`,`• Reverse thrust applied. When both REV indications are green, call ${co('"REVERSERS NORMAL."')}<p>If there is no REV indication(s) or the indication(s) stays amber, call ${co('"NO REVERSER ENGINE NUMBER 1"')}, or ${co('"NO REVERSER ENGINE NUMBER 2"')}, or ${co('"NO REVERSERS."')}</p>`],

   [`Verify Flap Lever is set to 40 <i>(OM-B)</i>`,`Set Flap Lever to 40 without delay.`],

   [`Call ${co('"ATTENTION CREW ON STATION, ATTENTION CREW ON STATION"')} on the PA.`,``],
   {span:`Analyze the situation.`}
 ]}},
 {h:'RTO, ENGINE FIRE, Severe Damage veya Separation nedeniyle yapıldıysa', tag:'co', ref:'OM-B 3.9 · QRH MAN.1.4–1.5', src:['IMG_1148','IMG_1149','IMG_1188','IMG_1189','IMG_1190','IMG_1191'], table:{cols:['Captain','First Officer'], rows:[

 {h:'RTO, APU FIRE nedeniyle · başka bir nedenle yapıldıysa · evacuation', tag:'co', ref:'OM-B 3.9 · QRH MAN.1.6–1.7', src:['IMG_1150','IMG_1151','IMG_1191','IMG_1192'], table:{cols:['Captain','First Officer'], rows:[

 {h:'RTO sonrası', tag:'co', ref:'OM-B 3.9 · QRH MAN.1.7', src:['IMG_1151','IMG_1193'], html:`
  <p><b>80 kts altındaki</b> rejected takeoff’ta, yalnızca durum elveriyorsa, commander manevranın sadece gerekli gördüğü adımlarını uygulamaya karar verebilir.</p>
  <p>Fren soğuma süresi ve önlemler için Brake Cooling Schedule’ı gözden geçir (Performance In-flight bölümü).</p>
  <p>Şunları değerlendir:</p><ul><li>Wheel fuse plug’ların erime ihtimali</li><li>Pisti boşaltma ihtiyacı</li><li>Uzak park (remote parking) gerekliliği</li><li>Yangın durumunda rüzgâr yönü</li><li>İtfaiyenin uyarılması</li><li>Yolcu tahliyesi gerekmedikçe parking brake’in bırakılması (fren enerji seviyeleri gerektiriyorsa ve durum elveriyorsa)</li><li>Yer ekibinin sıcak fren tehlikesi konusunda uyarılması</li><li>Yolculara yerlerinde oturmaları gerektiğinin bildirilmesi</li><li>RTO’ya neden olan durum için Non-Normal checklist’in tamamlanması (uygunsa)</li></ul>
  <p><b>RAAS:</b> bir RAAS callout’u veya uyarısı ekibin beklentisinden farklıysa — pozisyonu doğrula; gerekirse yardım için ATC ile irtibat kur.</p>`},

M({id:'eftko', grp:'Kalkış', t:'Engine Failure / Fire after V1', lead:`OM-B 3.10, V1 cut için şirket akışıdır. Hangi kumandayı kimin hareket ettireceğini, callout’ların tam metnini ve sırayı belirler. PF olarak uçağı uçurur, memory items’ı çağırır ve thrust lever’ı kendin hareket ettirirsin. Start lever ve fire switch’i PM hareket ettirir.`, secs:[
 {h:'Temel kurallar', tag:'co', ref:'OM-B 3.10', src:['IMG_1194','IMG_1195','IMG_1197'], html:`
  <ul>
   <li>PF, NNC’yi <b>emniyetli irtifada ve zaman elverirse</b> çağırır.</li>
   <li>PF, After Takeoff checklist’i çağırır. PM onu normal koşullardaki gibi tamamlar.</li>
   <li><b>İkinci bottle:</b> memory items sonrasında fire switch veya ENG OVERHEAT ışığı yanmaya devam ederse, bir tehlike oluşturmuyorsa ve ilk boşaltmadan bu yana <b>en az 30 saniye</b> geçtiyse, PF, PM’e ikinci bottle’ı <b>ezberden</b> boşaltmasını söyleyebilir.</li>
  </ul>
  <div class="box note"><p><b>NOTE:</b> Doğru rudder pedal veya trim girdileriyle A/P bağlanabilir.</p></div>
  <div class="box caut"><p><b>CAUTION:</b> Verilen track veya rotadan ayrılmadan önce ATC’ye distress call ile bilgi verilmelidir!</p></div>
  <div class="box note"><p><b>NOTE:</b> Ancak uçak kesin olarak kontrol altındayken bu noktada ileri adımlar atılır. <b>AVIATE, NAVIGATE, COMMUNICATE!</b></p></div>`},
 {h:'Kalkışta Engine Fire / Severe Damage / Separation', tag:'co', ref:'OM-B 3.10', src:['IMG_1195','IMG_1196','IMG_1197','IMG_1198','IMG_1199','IMG_1200','IMG_1201','IMG_1202','IMG_1203'], table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   [``,`Call ${co('"ENGINE FAILURE"')} or ${co('"ENGINE FIRE."')}<p>No further details are announced.</p><p>Cancel Master Caution or Fire Warning.</p>`],
   {hdr:`At Vr`},
   [``,`Call ${co('"ROTATE."')}`],
   [`Establish a positive rate of climb.`,``],
   [``,`Verify positive rate of climb on the altimeter and call ${co('"POSITIVE RATE."')}`],
   [`Verify positive rate of climb on the altimeter and call ${co('"GEAR UP."')}`,`Call ${co('"GEAR UP"')} and set the landing gear lever to UP.`],
   {hdr:`At 400 ft RA`},

 {h:'V1 cut için PF uçuş tekniği — arka plan', tag:'bg', ref:'FCTM Ch 3 · verify', html:`
  <ul>
   <li><b>Önce yön kontrolü.</b> Pistte merkez hattında kalmak için rudder kullan. Liftoff’tan sonra control wheel’i ortalamak için rudder kullan ("fly with the wheel level"). Tırmanış stabil olunca rudder’ı trimle.</li>
   <li><b>Rotation.</b> Vr’da, normalden biraz daha yavaş bir hızla, engine-out pitch attitude’a doğru yumuşakça rotate et. Sonra V2 ile V2+20 arasını hedefleyen F/D’yi takip et.</li>
   <li><b>400 ft altında</b> gear up dışında (ve PM’in yaptığı susturma ve iptal işlemleri dışında) <b>hiçbir işlem yok</b>. Memory items 400 ft RA’dan sonra, heading seçilip uçak kontrol altındayken gelir.</li>
   <li><b>A/T inoperative ise</b> "AUTOTHROTTLE DISENGAGE" çağrısı bir doğrulamaya dönüşür. Çalışan motordaki takeoff thrust, "SELECT MAX CONTINUOUS THRUST"a kadar elle set edilmiş olarak kalır.</li>
   <li><b>Acceleration altitude.</b> Pitch’i düzelt veya azalt, hızlan ve flaps’ı schedule’a göre topla. Flaps up hızında LVL CHG seç ve MCT’yi elle set et.</li>
   <li><b>Engine-out rotası.</b> EHAM 18L için EO SID / EOSID’i brief et (SID RENDI3E). OM-B caution’ı geçerlidir: verilen track’ten ayrılmadan önce ATC’ye distress call ile bildirilmelidir.</li>
  </ul>`}

const RCAM_X = {6:[30,20],5:[25,13],4:[20,13],3:[15,8],2:[5,0],1:[0,0],0:[0,0]};
function rwCheck(r, wd, ws, wg, cc){
  if (r.cc!=null) cc = r.cc;
  const w = Math.max(ws, wg||0), ang = (wd - r.qfu) * Math.PI/180;
  const hw = w*Math.cos(ang), xw = Math.abs(w*Math.sin(ang));
  const wide = r.w >= 45, xl = RCAM_X[cc][wide?0:1];
  const tlim = cc<=2 ? 0 : (cc===6 ? 15 : 10);
  const len = r.len||0, lda = typeof r.lda==='number'?r.lda:(r.lda?parseInt(r.lda.slice(1)):len);
  const iss = [];
  if (r.closed) return {hw, xw, xl, tlim, lda, iss:['OPC-6’da kapalı (kar)'], st:'off'};
  if (cc<=1) iss.push('RWYCC ≤ 1: kalkış ve iniş yapılamaz');
  else if (cc===2 && !wide) iss.push('< 45 m pistte RWYCC 2: izin verilmez / önerilmez');
  if (xw > xl + 0.05) iss.push(`crosswind ${xw.toFixed(1)} > ${xl} kt`);
  if (-hw > tlim + 0.05) iss.push(tlim===0 ? `tailwind ${(-hw).toFixed(0)} kt — hiç izin yok (braking < medium)` : `tailwind ${(-hw).toFixed(0)} > ${tlim} kt`);
  if (lda < 2000) iss.push(`kısa: ~${lda} m kullanılabilir`);
  const st = iss.length ? 'bad' : (xw > xl - 3 || (-hw) > tlim - 3 || lda < 2500 ? 'warn' : 'ok');
  return {hw, xw, xl, tlim, lda, iss, st};
}
