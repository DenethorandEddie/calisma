ISARM light’ı \"illuminates for one to two seconds and then extinguishes\" (self-test başarılı).<\/li><li>Arm olması için gerekenler: uçak yerde, antiskid ve autobrake çalışır durumda, RTO seçili, \"wheel speed less than 60 knots\", forward thrust lever’lar IDLE’da.<\/li><li>\"If the takeoff is rejected prior to wheel speed reaching 88 knots autobraking is not initiated.\" 88 knot üzerinde, \"maximum braking is applied automatically when the forward thrust levers are retarded to IDLE.\"<\/li><li>Frenleme başladıktan sonra SPEED BRAKE lever down detent’e alınırsa, bir thrust lever ileri itilirse veya manuel fren uygulanırsa disarm olur (DISARM light yanar).<\/li><li>Autobrake hydraulic system B’yi kullanır ve \"operates only when the normal brake system is functioning.\"<\/li><\/ul>", "si": 2}, {"module": "rto", "ref": "FCOM 9.20.17, 7.20.15, 7.11.7 (PDF p1560, p1488, p1446)", "title": "RTO sırasında auto speedbrake ve reverser’lar", "html": "<p><b>Speedbrake:<\/b> \"If the SPEED BRAKE lever is in the DOWN position during landing or rejected takeoff, the auto speed brake system operates\"; bunun için ana tekerleklerin dönmeye başlaması (60 kts’den fazla), her iki thrust lever’ın IDLE’da olması ve reverse thrust lever’ların reverse thrust pozisyonunda olması gerekir. \"After an RTO or landing, if either thrust lever is advanced, the SPEED BRAKE lever automatically moves to the DOWN detent and all spoiler panels retract.\"<\/p><p><b>Reverser’lar:<\/b> REV, reverser stowed pozisyondan ayrıldığında amber, deploy olduğunda yeşil görünür. Ancak ondan sonra reverse thrust lever detent No. 2’ye kaldırılabilir. \"When necessary, the reverse thrust lever can be pulled beyond detent No. 2, providing maximum reverse thrust.\" Reverser 1 ve 2, hydraulic system A ve B’yi kullanır. Standby sistemde daha yavaş açılırlar ve \"some thrust asymmetry can be anticipated.\"<\/p>", "si": 2}, {"module": "rto", "ref": "FCOM 8.20.2, 8.10.3 (PDF p1513, p1500)", "title": "Engine fire switch: PULL ve ROTATE ne yapar", "html": "<p>\"Illumination of an engine fire switch or ENG OVERHEAT light unlocks the engine fire switch. The switches may also be unlocked manually\" (fire switch override: \"Push – unlocks fire switch\").<\/p><p>Engine fire switch yukarı çekildiğinde:<\/p><ul><li>engine ve spar fuel shutoff valve’lerini kapatır<\/li><li>engine bleed air valve’ini kapatır (o taraftaki wing anti-ice kaybedilir; o bleed ile çalışan pack valve kapanır)<\/li><li>generator control relay ve breaker’ı trip eder<\/li><li>hydraulic fluid shutoff valve’ini kapatır<\/li><li>o motorun thrust reverser’ını devre dışı bırakır<\/li><li>her bottle’daki birer discharge squib’i arm eder<\/li><\/ul><p>\"Rotating the switch the other way discharges the remaining bottle.\" \"Either or both bottles can be discharged into either engine.\" BOTTLE DISCHARGED light’ı \"illuminates a few seconds after the engine fire switch is rotated.\"<\/p>", "si": 3}, {"module": "rto", "ref": "FCOM 8.20.4–8.20.5, 8.10.8 (PDF p1515–1516, p1505)", "title": "APU yangın algılama ve söndürme", "html": "<p>APU’da <b>tek<\/b> bir fire detection loop vardır. Arızalanırsa APU DET INOP light’ı yanar. APU yangın göstergeleri: fire bell, her iki master FIRE WARN light’ı, yanan APU fire switch ve \"the APU automatically shuts down.\" Yalnızca yerde, horn çalar ve main wheel well’deki APU fire warning light’ı yanıp söner.<\/p><p>APU fire switch’ini çekmek \"provides backup for the automatic shutdown feature\". APU fuel shutoff valve’ini, bleed air valve’ini ve air inlet door’u kapatır, APU generator’ünü trip eder ve squib’i arm eder. Switch’i \"in either direction\" çevirmek tek APU bottle’ını boşaltır. APU BOTTLE DISCHARGED light’ı \"after a few seconds.\" yanar.<\/p><p><i>Yalnızca TC-SPK, TC-SPP: yerde, motorlar kapalıyken bottle \"10 seconds after detection.\" otomatik olarak boşalır.<\/i><\/p>", "si": 4}, {"module": "rto", "ref": "FCOM 1.40.74 (PDF p1209)", "title": "Overwing exit flight lock’ları", "html": "<p>Dört overwing exit’te 28 V DC flight lock vardır. Aşağıdakilerin tümü doğru olduğunda kilitlenirler:<\/p><ul><li>\"three of the four Entry/Service doors are closed and\"<\/li><li>\"either engine is running and\"<\/li><li>\"the airplane air/ground logic indicates that the airplane is in the air or both thrust levers are advanced.\"<\/li><\/ul><p>\"The overwing emergency exits unlock when any one of the above conditions is not met or DC power is lost.\"<\/p><p><i>FCOM yalnızca kilit mantığını verir. QRH Evacuation checklist’i, kabine tahliye söylenmeden önce her iki engine start lever’ı CUTOFF’a aldırır.<\/i><\/p>", "si": 7}, {"module": "rto", "ref": "FCOM 15.20.5–15.20.6 (PDF p2498–2499)", "title": "Takeoff configuration warning: tetikleyiciler", "html": "<p>Uyarı \"when the airplane is on the ground and either or both forward thrust levers are advanced for takeoff.\" arm olur. Şu durumlarda aktive olur:<\/p><ul><li>trailing edge flaps, flaps 1–25 takeoff aralığında değilse ya da skew, asimetri veya komutsuz hareket varsa<\/li><li>leading edge devices kalkış için konfigüre değilse veya komutsuz hareket varsa<\/li><li>speed brake lever DOWN pozisyonunda değilse<\/li><li>spoiler control valve, ground spoiler interlock valve’e açıksa<\/li><li><b>parking brake set ise<\/b><\/li><li>stabilizer trim takeoff aralığında set edilmemişse<\/li><\/ul><p>Kesikli (intermittent) bir horn çalar ve TAKEOFF CONFIG light’ı yanar. <b>\"WARNING: The Cabin Altitude and Takeoff Configuration Warnings use the same intermittent tone when activated.\"<\/b><\/p>", "si": 8}, {"module": "eftko", "ref": "FCOM 8.20.2 (PDF p1513)", "title": "Uçuşta engine fire switch: yan etkiler ve 2. bottle", "html": "<p>Uçuşta engine fire switch’ini çekmek ayrıca:<\/p><ul><li>\"closes the engine bleed air valve resulting in loss of wing anti–ice to the affected wing and closure of bleed air operated pack valve\"<\/li><li>\"trips the generator control relay and breaker\"<\/li><li>hydraulic fluid shutoff valve’ini kapatır. \"The engine driven hydraulic pump LOW PRESSURE light is deactivated\"<\/li><li>thrust reverser’ı devre dışı bırakır<\/li><\/ul><p><b>İki bottle, motor başına iki squib:<\/b> \"Rotating the engine fire switch electrically 'fires' a squib, discharging the extinguishing agent into the related engine. Rotating the switch the other way discharges the remaining bottle.\" OM-B’ye göre PF’nin en az 30 saniye sonra ezbere (by memory) isteyebildiği ikinci bottle budur.<\/p>", "si": 0}, {"module": "eftko", "ref": "FCOM 8.20.1–8.20.2 (PDF p1512–1513)", "title": "Fire ve overheat algılama: 'NO FIRE, NO OVERHEAT' kontrolü", "html": "<p>\"Each engine contains two overheat/fire detector loops. Each loop provides both fire and overheat detection.\" \"Normally, both detector loops must sense a fire or overheat condition to cause an engine overheat or fire alert.\"<\/p><ul><li><b>Overheat:<\/b> her iki MASTER CAUTION light’ı, OVHT/DET annunciator’ı ve ilgili ENG OVERHEAT light’ı.<\/li><li><b>Fire:<\/b> fire bell, her iki master FIRE WARN light’ı ve ilgili engine fire switch; ayrıca ilgili tüm overheat göstergeleri.<\/li><\/ul><p>\"The ENG OVERHEAT light or engine fire switch remains illuminated until the temperature drops below the onset temperature.\" Bottle’dan sonra PM’in \"NO FIRE, NO OVERHEAT\" veya \"FIRE…\" call’ı bu ışıkların kontrolüne dayanır.<\/p><p><i>Engine fire’da yanan start lever: yalnızca TC-SEO–SEZ, TC-SOA–SOH, TC-SPN.<\/i><\/p>", "si": 1}, {"module": "eftko", "ref": "FCOM 7.11.9, 7.20.11 (PDF p1448, p1484)", "title": "ENG FAIL alert’i ve auto-relight", "html": "<p><b>ENG FAIL<\/b> (amber, upper DU) şu durumda görünür: \"engine operating below sustainable idle (less than 50% N2); and engine start lever in IDLE position.\"<\/p><p>\"engine recovers; or start lever moved to CUTOFF; or engine fire switch pulled\" olana kadar kalır; yani memory items sırasında söner.<\/p><p><b>Auto-relight:<\/b> \"Whenever the EEC detects an engine flameout, both igniters are activated. A flameout is detected when an uncommanded rapid decrease in N2 occurs, or N2 is below idle RPM.\"<\/p><p>Herhangi bir thrust lever, start lever veya fire switch’e dokunulmadan önce doğru tanımlama yapılır (PM söyler, PF doğrular).<\/p>", "si": 1}, {"module": "eftko", "ref": "FCOM 7.11.9, 7.20.6 (PDF p1448, p1479)", "title": "Çalışan motor: V1 cut sırasında EGT limitleri", "html": "<p>EGT’nin amber’a (maximum continuous limit aşıldı) renk değişimi şu sürelerde inhibit edilir:<\/p><ul><li>\"for up to 5 minutes during takeoff or go–around (normal operation)\"<\/li><li>\"for up to 10 minutes during takeoff or go–around (when an engine out condition occurs within the first 5 minutes of the inhibit)\"<\/li><\/ul><p>Kırmızı, \"maximum takeoff limit or start limit exceeded.\" anlamına gelir.<\/p><p><b>Yapısal koruma:<\/b> \"The EEC provides N1 and N2 redline overspeed protection in both normal and alternate modes. The EGT limit must be observed by the crew because the EEC does not provide EGT redline exceedance protection.\" Çalışan motorda takeoff thrust tutulurken bunu aklında tut.<\/p>", "si": 2}, {"module": "depress", "ref": "FCOM 15.20.6, 15.10.3, 2.10.8 (PDF p2499, p2474, p1231)", "title": "Cabin altitude warning: horn ve light", "html": "<p>\"Cabin altitude warning activates when cabin altitude exceeds 10,000 feet. An intermittent warning horn sounds and the CABIN ALTITUDE warning light illuminates.\"<\/p><ul><li>Horn \"may be silenced by momentarily pressing the ALT HORN CUTOUT switch on the Cabin Altitude Panel.\"<\/li><li>\"The warning light remains illuminated until the cabin altitude descends below 10,000 feet.\"<\/li><li><b>\"WARNING: The Cabin Altitude and Takeoff Configuration Warnings use the same intermittent tone when activated.\"<\/b> Uçuşta bu horn’u cabin altitude warning olarak ele al.<\/li><\/ul><p><i>CABIN ALTITUDE / TAKEOFF CONFIG light’ları preflight procedure’da \"if installed and operative\" olarak işaretlidir.<\/i><\/p>", "si": 0}, {"module": "depress", "ref": "FCOM NP.21.29–30 (PDF p228–229)", "title": "Takeoff briefing: CABIN ALTITUDE light’ı olmayan uçaklar", "html": "<p>Günün ilk uçuşunda ve her ekip değişiminden sonra cabin altitude warning ve memory items’ı \"must be briefed on airplanes in which the CABIN ALTITUDE and TAKEOFF CONFIG lights are not installed, or are installed but not activated.\"<\/p><p>\"Whenever the intermittent warning horn sounds in flight at an airplane flight altitude above 10,000 feet MSL:<\/p><ul><li>1. Immediately, don oxygen masks and set regulators to 100%.<\/li><li>2. Establish crew communications.<\/li><li>3. Do the CABIN ALTITUDE WARNING or Rapid Depressurization non-normal checklist.\"<\/li><\/ul><p><b>\"Both pilots must verify on the overhead Cabin Altitude Panel that the cabin altitude is stabilized at or below 10,000 feet before removing oxygen masks.\"<\/b><\/p>", "si": 0}, {"module": "depress", "ref": "FCOM 2.40.1, 2.40.5–2.40.6 (PDF p1252, p1256–1257)", "title": "Basınçlandırma: relief valve’ler ve AUTO FAIL tetikleyicileri", "html": "<p>\"Two pressure relief valves provide safety pressure relief by limiting the differential pressure to a maximum of 9.1 psi.\" \"Cabin altitude is normally rate–controlled by the cabin pressure controller up to a cabin altitude of 8,000 feet at the airplane maximum certified ceiling of 41,000 feet.\"<\/p><p>Amber <b>AUTO FAIL<\/b> light’ı DC güç kaybında, controller arızasında veya outflow valve kontrol arızasında yanar. Controller düzgün yanıt vermediğinde şu durumlarda da yanar:<\/p><ul><li>\"Excessive differential pressure (&gt; 8.75 psi)\"<\/li><li>\"Excessive rate of cabin pressure change (±2000 sea level feet/minute)\"<\/li><li>\"High cabin altitude (above 15,800 feet)\"<\/li><\/ul><p>\"With illumination of the AUTO FAIL light, the pressure control automatically transfers to the other auto controller (ALTN mode).\"<\/p>", "si": 0}, {"module": "depress", "ref": "FCOM 2.40.7, 2.10.11 (PDF p1258, p1234)", "title": "MAN mode: outflow valve neden hızlı kapanır", "html": "<p>MAN: \"pressurization system controlled manually by outflow valve switch; both auto controllers bypassed.\" Outflow Valve switch’i (yaylı, ortaya döner) valve’i elektrikle yalnızca \"with pressurization mode selector in MAN position.\" açar veya kapatır.<\/p><p>\"In MAN mode, a separate DC motor, powered by the DC standby system, drives the outflow valve at a faster rate than during AUTO or ALTN modes. In MAN mode, the outflow valve full range of motion takes up to 20 seconds.\"<\/p><p>Ekip valve’i cabin altitude panel’de ve outflow VALVE position indicator’da kontrol eder.<\/p><p><b>CAUTION:<\/b> \"A small movement of the outflow valve can cause a large change in cabin rate of climb or descent.\"<\/p>", "si": 2}, {"module": "depress", "ref": "FCOM 1.30.28, 1.40.27 (PDF p1127, p1162)", "title": "Ekip oksijen maskesi regulator’ü", "html": "<ul><li><b>N (normal):<\/b> \"supplies air/oxygen mixture on demand (ratio depends on cabin altitude).\"<\/li><li><b>100%:<\/b> \"supplies 100% oxygen on demand\" (memory item ayarı).<\/li><li><b>EMERGENCY:<\/b> \"supplies 100% oxygen under positive pressure at all cabin altitudes (protects against smoke and harmful vapors).\"<\/li><\/ul><p>CAUTION: \"Use of EMER mode depletes oxygen supply at higher rate than 100% or NORM mode.\" Not: \"Communications in EMER mode may be difficult.\"<\/p><p>Ekip oksijeni tek bir silindirden gelir. <i>TC-SNN–SNU, TC-SON–SUU:<\/i> otomatik pressure-breathing maskeler, \"Pressure breathing occurs above 27,000 feet.\"<\/p><p><i>Regulator yerleşimi (rotary selector veya ayrı switch) tail’e göre değişir.<\/i><\/p>", "si": 2}, {"module": "depress", "ref": "FCOM 1.30.23, 1.40.39–1.40.40 (PDF p1122, p1174–1175)", "title": "Yolcu oksijeni: 14,000 ft’te otomatik, PASS OXYGEN ON", "html": "<p>PASS OXYGEN switch’i: <b>NORMAL<\/b> (guarded) konumunda maskeler düşer ve sistem \"if cabin altitude climbs to 14,000 feet\" otomatik olarak aktive olur. <b>ON<\/b> \"activates system and drops masks if automatic function fails.\" Ardından PASS OXY ON light’ı ve OVERHEAD master caution yanar.<\/p><p>Oksijen jeneratörleri kimyasaldır, her PSU’da bir tane vardır. Bir maskeyi çekmek o üniteyi başlatır. \"Oxygen flows for approximately 12 minutes and cannot be shut off\" (TC-SPN: yaklaşık 22 dakika).<\/p><p>WARNING: \"Do not use passenger oxygen with cabin altitude below 14,000 feet when smoke or an abnormal heat source is present.\"<\/p>", "si": 2}, {"module": "depress", "ref": "FCOM 9.20.16, L.10.10 (PDF p1559, p183)", "title": "Emergency descent’te speedbrake", "html": "<p>\"Moving the SPEED BRAKE lever beyond the FLIGHT DETENT causes buffeting and is prohibited in flight.\" Limitation: \"In flight, do not extend the SPEED BRAKE lever beyond the FLIGHT DETENT.\"<\/p><p>Çoğu tail’de bir <b>lever stop<\/b> vardır. Bu stop \"prevents the SPEED BRAKE lever from being moved beyond the FLIGHT DETENT when the airplane is in flight with the flaps up.\"<\/p><p><i>TC-SNV, TC-SOT’ta bunun yerine load alleviation vardır. Yüksek ağırlık veya hızda speedbrake’leri \"to 50 percent of the FLIGHT DETENT\" geri çeker.<\/i><\/p><p>\"Caution should be exercised when deploying flight spoilers during a turn, as they greatly increase roll rate.\"<\/p><p>Non-AFM: \"Do not deploy the speedbrakes in flight at radio altitudes less than 1,000 feet.\"<\/p>", "si": 3}, {"module": "inflight", "ref": "FCOM 11.31.43, 11.42.33 (PDF p1926, p2294)", "title": "FMC ENG OUT CRZ sayfası ve driftdown uygulaması", "html": "<p>CRZ sayfasında ENG OUT’u, ardından LT veya RT ENG OUT prompt’unu seç. Sayfa şunları gösterir:<\/p><ul><li><b>ENG OUT SPD<\/b>: \"the optimum speed based on minimum drag\"<\/li><li><b>CON N1<\/b>: maximum continuous thrust için N1<\/li><li><b>MAX ALT<\/b>: tek motor MCT’deyken, varsayılan 100 ft/min tırmanma oranı için irtifa<\/li><\/ul><p>FCOM driftdown uygulaması: \"disengage A/T; set maximum continuous thrust on operating engine (N1 line); set MCP speed to ENG OUT SPD; set MCP altitude to MAX ALT or lower altitude as required; select LVL CHG.\"<\/p><p>\"As the driftdown proceeds and airplane gross weight decreases, the maximum altitude may increase.\" ENG OUT CRZ sayfası tavsiye niteliğindedir, \"information only\".<\/p>", "si": 0}, {"module": "inflight", "ref": "FCOM 7.15.1–7.15.2, 7.20.11 (PDF p1464–1465, p1484)", "title": "ENGINE START switch FLT ve uçuşta motor çalıştırma", "html": "<ul><li><b>FLT<\/b>: \"provides ignition to both igniters when engine start lever is in IDLE\". Loss of Thrust on Both Engines memory item’ında bu kullanılır.<\/li><li><b>CONT<\/b>: \"in flight – provides ignition to both igniters when N2 is below idle and engine start lever is in IDLE\". Emergency Descent memory item’ında bu kullanılır.<\/li><li><b>GRD<\/b> uçuşta: start valve’i açar ve \"arms both igniters\".<\/li><\/ul><p>\"Two methods of starting an engine inflight are available, windmill and crossbleed. None of the ground start protection features are functional during inflight start.\" Crossbleed start gerektiğinde N2’nin üstünde X–BLD (compact display’de XB) görünür.<\/p><p><i>TC-SPR’de OFF yerine AUTO vardır.<\/i><\/p>", "si": 2}, {"module": "inflight", "ref": "FCOM 7.20.6 (PDF p1479)", "title": "EEC, N1/N2’yi korur ama EGT’yi korumaz", "html": "<p>\"The EEC provides N1 and N2 redline overspeed protection in both normal and alternate modes. <b>The EGT limit must be observed by the crew because the EEC does not provide EGT redline exceedance protection.<\/b>\"<\/p><p>Engine Limit or Surge or Stall memory items’ının dayanağı budur: \"Retard until engine indications stay within limits or the thrust lever is closed.\"<\/p><p>Idle: EEC, cowl anti-ice ON iken veya 19,000 ft MSL altında gear down ya da flaps 15 veya daha fazla iken <b>approach idle<\/b> seçer. \"This higher% RPM improves engine acceleration time in the event of a go–around.\"<\/p><p>Hard alternate mode’da \"EEC limiting is not provided\" ve maximum rated thrust’a lever tam ileri gelmeden ulaşılabilir.<\/p>", "si": 2}, {"module": "inflight", "ref": "FCOM 8.20.1, 8.10.4 (PDF p1512, p1501)", "title": "Motor overheat algılama ve loop arızaları", "html": "<p>\"As the temperature of a detector increases to a predetermined limit, the detector senses an overheat condition. At higher temperatures, the detector senses a fire condition.\"<\/p><p>ENG OVERHEAT (amber), MASTER CAUTION ve OVHT/DET ile birlikte gelir. ENG OVERHEAT light’ı ayrıca engine fire switch’in kilidini açar.<\/p><p>OVHT DET NORMAL’deyken arızalı loop otomatik olarak devreden çıkarılır. \"There is no flight deck indication of single loop failure. If both loops fail on an engine, the FAULT light illuminates and the system is inoperative.\"<\/p><p>FAULT light’ı MASTER CAUTION’ı <b>tetiklemez<\/b>.<\/p><p>Algılama battery bus’tan, söndürme ise hot battery bus’tan beslenir.<\/p>", "si": 2}, {"module": "inflight", "ref": "FCOM 9.10.6, 9.20.7 (PDF p1531, p1550)", "title": "Stabilizer trim: cutout switch’leri ve manuel trim", "html": "<ul><li><b>MAIN ELECT CUTOUT<\/b>: \"deactivates stabilizer trim switch operation.\"<\/li><li><b>AUTOPILOT CUTOUT<\/b>: \"deactivates autopilot stabilizer trim operation; autopilot disengages if engaged.\"<\/li><li>Stabilizer trim wheel \"overrides any other stabilizer trim inputs.\"<\/li><\/ul><p>Column cutout switch’leri \"stop operation of the main electric and autopilot trim when the control column movement opposes trim direction.\" STAB TRIM OVERRIDE bunları bypass eder.<\/p><p>\"The stabilizer is held in position by two independent brake systems.\" \"The effort required to manually rotate the stabilizer trim wheels may be higher under certain flight conditions. <b>Grasping the stabilizer trim wheel will stop stabilizer motion.<\/b>\"<\/p>", "si": 2}, {"module": "inflight", "ref": "FCOM 10.21.14, 10.21.15–16 (PDF p1727–1729)", "title": "Airspeed Unreliable’ın arkasındaki air data kaynakları", "html": "<p>\"The pitot static system is comprised of three separate pitot probes and six flush static ports.\"<\/p><ul><li>\"Each pitot air data module is connected to its on–side pitot probe; <b>there is no cross connection<\/b>.\" Kaptan’ın probe’u sol ADIRU’yu, F/O’nun probe’u sağ ADIRU’yu besler.<\/li><li>\"The remaining auxiliary pitot probe and alternate static ports provide pitot and static pressure to the standby instruments.\" Auxiliary probe F/O tarafındadır.<\/li><li>ISFD: airspeed ve altitude \"direct connections to the auxiliary pitot and alternate static sources\" üzerinden gelir. Attitude ise kendi dahili inertial sensörlerinden gelir.<\/li><\/ul><p><i>TC-SNV, TC-SOO–SOT, TC-SPB, TC-SUU’da ISFD yerine standby airspeed/altimeter ve attitude indicator vardır.<\/i><\/p>", "si": 2}, {"module": "nnc", "ref": "FCOM NP.11.2–11.3 (PDF p193–194)", "title": "Ekip görevleri: PF / PM paylaşımı", "html": "<p>\"Phase of flight duties are divided between the Pilot Flying (PF) and the Pilot Monitoring (PM).\" \"Each crewmember is responsible for moving the controls and switches in their area of responsibility\"; bu hem normal hem de non-normal prosedürler için geçerlidir.<\/p><ul><li><b>PF:<\/b> \"taxiing; flight path and airspeed control; airplane configuration; navigation.\"<\/li><li><b>PM:<\/b> \"checklist reading; communications; tasks asked for by the PF; monitoring taxiing, flight path, airspeed, airplane configuration and navigation.\"<\/li><\/ul><p>\"The captain may direct actions outside of the crewmember's area of responsibility.\" <b>\"The captain is the final authority for all tasks directed and done.\"<\/b><\/p>", "si": 0}, {"module": "nnc", "ref": "FCOM NP.11.3–11.4 (PDF p194–195)", "title": "MCP, CDU ve FMA disiplini", "html": "<ul><li>\"The mode control panel is the PF's responsibility. When flying manually, the PF directs the PM to make the changes on the mode control panel.\"<\/li><li>\"In flight, the PM usually makes the CDU entries.\" \"The pilot making the entries executes the change only after the other pilot verifies the entries.\"<\/li><li>\"During high workload times, for example departure or arrival, try to reduce the need for CDU entries. Do this by using the MCP heading, altitude, and speed control modes.\"<\/li><li>\"When selecting a value on the MCP, verify that the respective value changes on the flight instruments.\" Autopilot, flight director ve autothrottle mod değişikliklerini doğrulamak için FMA’yı kullan.<\/li><\/ul>", "si": 2}, {"module": "nnc", "ref": "FCOM NP.11.1–11.2 (PDF p192–193)", "title": "Configuration check: NNC ne zaman gerekir", "html": "<p>\"It is the crew member's responsibility to verify correct system response.\"<\/p><ul><li>Motor çalıştırmadan önce: sistemlerin kendi ışıklarını kullan. Bir ışık uygun olmayan bir durum gösterirse \"check the Dispatch Deviations Guide (DDG) or the operator equivalent to decide if the condition has a dispatch effect\" ve bakım gerekip gerekmediğine karar ver.<\/li><li>\"If, during or after engine start, a red warning or amber caution light illuminates: do the respective non-normal checklist (NNC); on the ground, check the DDG or the operator equivalent.\"<\/li><li>Bir amber caution recall’da yanıp master caution reset’ten sonra sönerse DDG’yi kontrol et. \"The respective non-normal checklist is not needed.\"<\/li><\/ul><p>Yerde trip olmuş bir CB’yi resetlemeden önce \"Maintenance must first determine that it is safe.\"<\/p>", "si": 8}, {"module": "memory", "ref": "FCOM 7.15.8, 8.10.3 (PDF p1471, p1500)", "title": "Engine start lever CUTOFF ve fire switch override", "html": "<p>Engine start lever:<\/p><ul><li><b>IDLE<\/b>: \"energizes ignition system through EEC; electrically opens spar fuel shutoff valve…; electrically opens engine–mounted fuel shutoff valve via the EEC.\"<\/li><li><b>CUTOFF<\/b>: \"closes both spar and engine fuel shutoff valves; de–energizes ignition system.\"<\/li><\/ul><p>Fire switch override: \"Push – unlocks fire switch.\" Yangın sinyali yokken switch \"mechanically locked\" durumdadır (8.10.2). QRH notu: \"To manually unlock the engine fire switch, press the override and pull.\"<\/p><p>Start lever’lar için CAUTION: \"Do not apply rotational force when moving the engine start lever.\"<\/p>", "si": -1}, {"module": "memory", "ref": "FCOM 8.10.7, 8.10.1 (PDF p1504, p1498)", "title": "Master FIRE WARN ve BELL CUTOUT", "html": "<p>Master FIRE WARN light’ları (kırmızı) \"a fire warning (or system test) in engine, APU, main gear wheel well or cargo compartment\" durumunu gösterir. Fire bell çalar; yerde ayrıca remote APU horn da çalar.<\/p><p>Bir master FIRE WARN light’ına veya BELL CUTOUT switch’ine basmak:<\/p><ul><li>\"extinguishes both master FIRE WARN lights\"<\/li><li>\"silences fire warning bell\"<\/li><li>remote APU fire warning horn’u susturur<\/li><li>\"resets system for additional warnings\"<\/li><\/ul><p>Bell’i susturmak fire switch light’ını söndürmez. Yangın algılandığı sürece fire switch yanık kalır.<\/p>", "si": -1}, {"module": "memory", "ref": "FCOM 7.20.10–7.20.11, 7.11.9 (PDF p1483–1484, p1448)", "title": "Aborted Engine Start: EEC ne yapar, ne yapmaz", "html": "<p>\"During ground starts, the EEC monitors engine parameters to detect impending hot starts, engine stalls, EGT start limit exceedances, and wet starts. These protection features do not function during inflight starts.\"<\/p><ul><li>Yaklaşan hot start veya stall: EGT’nin etrafındaki beyaz kutu yanıp söner. EEC software 7.B.Q ve sonrası \"automatically turn off the ignition and shuts off fuel.\"<\/li><li>EGT start limit aşılırsa: EGT göstergesi kırmızıya döner ve EEC ignition ve fuel’i keser.<\/li><li>Wet start (EGT artışı yok): EEC ignition ve fuel’i \"15 seconds after the start lever is moved to IDLE.\" keser.<\/li><\/ul><p>Buna rağmen memory item, start lever’ı <b>CUTOFF<\/b>’a almaktır. Ayrıca: \"Initial fuel flow indications lag actual fuel flow by approximately two seconds.\"<\/p>", "si": -1}, {"module": "memory", "ref": "FCOM 7.30.3, 8.20.4 (PDF p1494, p1515)", "title": "APU Fire memory items: APU switch OFF ve fire switch", "html": "<p>APU switch OFF: \"trips the APU generator, closes the APU bleed air valve… Shutdown occurs automatically after 60 seconds.\" <b>\"An immediate shutdown can be accomplished by pulling the APU fire switch.\"<\/b><\/p><p>APU yangını kendi başına şu sonucu doğurur: \"the APU automatically shuts down\". APU fire switch’ini çekmek \"provides backup for the automatic shutdown feature\". Fuel shutoff valve’i, bleed valve’i ve inlet door’u kapatır ve squib’i arm eder.<\/p><p>APU’nun tek bir bottle’ı vardır. Switch’i \"in either direction\" çevirmek onu boşaltır.<\/p>", "si": -1}, {"module": "memory", "ref": "FCOM 2.10.11, 1.30.23 (PDF p1234, p1122)", "title": "Cabin Altitude memory items: switch’ler", "html": "<ul><li>Pressurization mode selector <b>MAN<\/b>: \"pressurization system controlled manually by outflow valve switch; both auto controllers bypassed.\"<\/li><li>Outflow valve switch’i (yaylı, ortaya döner) <b>CLOSE<\/b>: \"closes outflow valve electrically with pressurization mode selector in MAN position.\"<\/li><li>Outflow VALVE position indicator: \"operates in all modes\".<\/li><li>PASS OXYGEN <b>ON<\/b>: \"activates system and drops masks if automatic function fails\". NORMAL, 14,000 ft cabin altitude’da otomatik açılma sağlar.<\/li><li>ALT HORN CUTOUT: \"cuts out intermittent cabin altitude warning horn.\"<\/li><\/ul>", "si": -1}, {"module": "memory", "ref": "FCOM 9.20.8, 15.20.6 (PDF p1551, p2499)", "title": "Stabilizer trim yetkisi ve green band", "html": "<p>Moda göre trim yetkisi:<\/p><ul><li>Main electric: flaps açıkken 0.05 ile 14.5 units arası, flaps kapalıyken 3.95 ile 14.5 units arası<\/li><li>Autopilot: 0.05 ile 14.5 units arası<\/li><li>Manual: -0.20 ile 16.9 units arası<\/li><\/ul><p>\"If manual trim is used to position the stabilizer beyond the electrical trim limits, the stabilizer trim switches may be used to return the stabilizer to electrical trim limits.\"<\/p><p>\"An intermittent horn sounds if takeoff is attempted with the stabilizer trim outside the takeoff trim range\". Bu, Takeoff Configuration Warning memory item’ının tetikleyicilerinden biridir.<\/p>", "si": -1}];/*FCOM_DATA_END*/
function fcomBox(f){return `<div class="fcom"><div class="fh"><span class="fref">${f.ref}</span><b>${f.title}</b></div>${f.html}</div>`}
function fcomFor(mod,j){return FCOM.filter(f=>f.module===mod&&f.si===j).map(fcomBox).join('')}
function fcomEnd(mod){const L=FCOM.filter(f=>f.module===mod&&f.si<0);return L.length?`<section class="sec"><div class="sec-head"><h3>FCOM’dan</h3><span class="src-tag" style="border-color:var(--orange);color:var(--orange-ink)">Boeing 737NG FCOM · Rev 68</span></div>${L.map(fcomBox).join('')}</section>`:''}
function secHTML(s, key, j){
  const tag = s.tag==='co' ? `<span class="src-tag co">${s.ref?('SXS '+s.ref):'SunExpress kaynağı'}</span>` : `<span class="src-tag bg">${s.ref||'Arka plan'} · şirket metni değil</span>`;
  if(s.mems) return `<section class="sec"><div class="sec-head"><h3>${s.h}</h3>${tag}</div><p class="cond">Bunları Memory Items modülünde çalış. Oraya gitmek için bir isme dokun.</p><div class="mark">${s.mems.map(id=>{const m=MEMS.find(x=>x.id===id);return `<button class="btn" data-jump="${id}">${m.t}</button>`}).join('')}</div>${fcomFor(cur,j)}</section>`;
  return `<section class="sec"><div class="sec-head"><h3>${s.h}</h3>${tag}</div>
   ${s.pre||''}${s.html||''}${s.table?`<div class="toolbar" style="margin-top:6px"><span class="stat">Drill:</span><button class="btn" data-hide="${key}:0">Gizle: ${s.table.cols[0]}</button><button class="btn" data-hide="${key}:1">Gizle: ${s.table.cols[1]}</button></div>`+tableHTML(s.table,key):''}${s.cl?clHTML(s.cl):''}${s.post||''}${fcomFor(cur,j)}
   ${thumbs(s.src)}</section>`;
}

let cur = null;
function show(id){
  const i = Math.max(0, MODS.findIndex(m=>m.id===id)); const m = MODS[i]; cur = m.id; store.set('opc6.cur', cur);
  let body = '';
  if(m.kind==='memory'){
    body = `<div class="toolbar"><button class="btn primary" id="drillBtn" aria-pressed="${state.drill}">${state.drill?'Tüm yanıtları göster':'Drill modunu başlat'}</button><button class="btn" id="memOnlyAgain">Yalnızca "çalışmam lazım" olanlar</button><button class="btn" id="memAll">Tümünü göster</button><span class="stat" id="memStat"></span></div>
     <div id="memWrap" class="${state.drill?'drill':''}">${MEMS.map(x=>nncCard(x,true)).join('')}</div>`;
  } else if(m.kind==='quiz'){
    body = `<div class="toolbar"><select id="qCat" class="btn"><option value="">Tüm konular</option>${[...new Set(QUIZ.map(q=>q[0]))].map(c=>`<option>${c}</option>`).join('')}</select><button class="btn" id="qShuf">Karıştır</button><span class="stat" id="qStat"></span></div><div id="qBox"></div>`;
  } else if(m.kind==='sources'){
    body = `<div class="srcgrid">${SRC_ORDER.map(k=>`<figure><button class="thumb" data-src="${k}"><img loading="lazy" src="src/${k}.webp" alt="${SRC[k]}"><span>${k}</span></button><figcaption>${SRC[k]}</figcaption></figure>`).join('')}</div>`;
  } else if(m.kind==='divert'){
    body = divertHTML();
  } else if(m.kind==='walk'){
    body = walkHTML();
  } else body = m.secs.map((s,j)=>secHTML(s, m.id+j, j)).join('');
  const prev = MODS[i-1], next = MODS[i+1];
  $('#main').innerHTML = `<div class="mod-head"><h2>${m.t}</h2><span class="mod-num">MODÜL ${String(i+1).padStart(2,'0')} / ${MODS.length}</span></div><p class="lead">${m.lead}</p>${FCOM.some(f=>f.module===m.id)?'<span class="fcom-legend"><i></i>Turuncu kutular = Boeing 737NG FCOM (Rev 68)</span>':''}${body}${fcomEnd(m.id)}
   <div class="foot">${prev?`<button class="btn" data-go="${prev.id}">‹ ${prev.t}</button>`:'<span></span>'}<button class="btn ${state.done[m.id]?'good':''}" id="doneBtn" aria-pressed="${!!state.done[m.id]}">${state.done[m.id]?'✓ Çalışıldı':'Modülü çalışıldı olarak işaretle'}</button>${next?`<button class="btn primary" data-go="${next.id}">${next.t} ›</button>`:'<span></span>'}</div>`;
  document.querySelectorAll('#main table.data').forEach(t=>{ if(!t.parentElement.classList.contains('tw')){ const w=document.createElement('div'); w.className='tw'; t.parentNode.insertBefore(w,t); w.appendChild(t);} });
  if(m.kind==='walk'){ walkShow(store.get('opc6.wk',0)); document.getElementById('wkTrack').onclick=e=>{const b=e.target.closest('[data-wk]'); if(b) walkShow(+b.dataset.wk)}; document.getElementById('wkPrev').onclick=()=>walkShow(store.get('opc6.wk',0)-1); document.getElementById('wkNext').onclick=()=>{walkShow(store.get('opc6.wk',0)+1); document.getElementById('wkSec').scrollIntoView({block:'start'})}; }
  if(m.kind==='divert'){ divertCalc(); ['dvWd','dvWs','dvWg','dvCc'].forEach(id=>document.getElementById(id).addEventListener('input',divertCalc)); document.getElementById('dvReset').onclick=()=>{dvSet(120,22,0,4)}; document.querySelectorAll('[data-dv]').forEach(t=>t.addEventListener('input',()=>{const o=store.get('opc6.dvt',{});o[t.dataset.dv]=t.value;store.set('opc6.dvt',o);})); }
  rail(); if(m.kind==='memory'){ memStat(); applyDrill(); } if(m.kind==='quiz') quizInit();
  window.scrollTo({top:0});
}
function memStat(){ const e=$('#memStat'); if(e) e.textContent = `${MEMS.filter(x=>state.mem[x.id]==='ok').length}/${MEMS.length} biliniyor`; }
function applyDrill(){ document.querySelectorAll('#memWrap [data-d]').forEach(el=>el.classList.toggle('hid', state.drill)); }

/* quiz */
let deck=[], qi=0, qOk=0;
function quizInit(){ buildDeck(); $('#qCat').onchange=()=>{buildDeck()}; $('#qShuf').onclick=()=>buildDeck(); }
function buildDeck(){ const c=$('#qCat').value; deck = QUIZ.map((q,i)=>i).filter(i=>!c||QUIZ[i][0]===c); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]} qi=0; qOk=0; qRender(); }
function qRender(){
  const box=$('#qBox'); if(!box) return;
  $('#qStat').textContent = `${qOk} doğru · ${Math.max(deck.length-qi,0)} kaldı`;
  if(qi>=deck.length){ box.innerHTML=`<div class="qcard"><div class="q">Deste tamamlandı.</div><p>İlk turda veya tekrarlardan sonra ${qOk} doğru cevap.</p><div><button class="btn primary" id="qAgain">Baştan başla</button></div></div>`; $('#qAgain').onclick=buildDeck; return; }
  const [cat,q,a]=QUIZ[deck[qi]];
  box.innerHTML=`<div class="qcard"><div class="qmeta">${cat} · kart ${qi+1} / ${deck.length}</div><div class="q">${q}</div><div class="a" id="qA" hidden>${a}</div><div class="mark"><button class="btn primary" id="qShow">Cevabı göster</button><button class="btn good" id="qOk" hidden>Bildim</button><button class="btn bad" id="qNo" hidden>Bilemedim — sonra tekrar</button></div></div>`;
  $('#qShow').onclick=()=>{$('#qA').hidden=false;$('#qShow').hidden=true;$('#qOk').hidden=false;$('#qNo').hidden=false;$('#qOk').focus()};
  $('#qOk').onclick=()=>{qOk++;qi++;qRender()};
  $('#qNo').onclick=()=>{const c=deck[qi];deck.splice(qi,1);deck.splice(Math.min(qi+3,deck.length),0,c);qRender()};
}

/* lightbox */
let lbKey=null;
function lbOpen(k){ lbKey=k; $('#lbImg').src=`src/${k}.webp`; $('#lbImg').alt=SRC[k]; $('#lbCap').textContent=`${k} · ${SRC[k]}`; $('#lb').hidden=false; $('#lbClose').focus(); }
function lbStep(d){ const i=SRC_ORDER.indexOf(lbKey); lbOpen(SRC_ORDER[(i+d+SRC_ORDER.length)%SRC_ORDER.length]); }
$('#lbClose').onclick=()=>{$('#lb').hidden=true}; $('#lbPrev').onclick=()=>lbStep(-1); $('#lbNext').onclick=()=>lbStep(1);
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('#lb').hidden=true; });
document.addEventListener('keydown',e=>{ if($('#lb').hidden) return; if(e.key==='Escape') $('#lb').hidden=true; if(e.key==='ArrowRight') lbStep(1); if(e.key==='ArrowLeft') lbStep(-1); });

/* global clicks */
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'); if(go){ show(go.dataset.go); return; }
  const th=e.target.closest('[data-src]'); if(th){ lbOpen(th.dataset.src); return; }
  const jp=e.target.closest('[data-jump]'); if(jp){ show('memory'); const el=document.querySelector(`[data-mem="${jp.dataset.jump}"]`); if(el) el.scrollIntoView({block:'start'}); return; }
  if(e.target.id==='doneBtn'){ state.done[cur]=!state.done[cur]; store.set('opc6.done',state.done); show(cur); return; }
  if(e.target.id==='drillBtn'){ state.drill=!state.drill; e.target.setAttribute('aria-pressed',state.drill); e.target.textContent=state.drill?'Tüm yanıtları göster':'Drill modunu başlat'; $('#memWrap').classList.toggle('drill',state.drill); applyDrill(); return; }
  if(e.target.id==='memOnlyAgain'){ document.querySelectorAll('#memWrap [data-mem]').forEach(c=>c.hidden = state.mem[c.dataset.mem]==='ok'); return; }
  if(e.target.id==='memAll'){ document.querySelectorAll('#memWrap [data-mem]').forEach(c=>c.hidden=false); return; }
  const mk=e.target.closest('[data-mk]'); if(mk){ const id=mk.closest('[data-mem]').dataset.mem; state.mem[id] = state.mem[id]===mk.dataset.mk?null:mk.dataset.mk; store.set('opc6.mem',state.mem); mk.parentElement.querySelectorAll('[data-mk]').forEach(b=>b.setAttribute('aria-pressed', state.mem[id]===b.dataset.mk)); memStat(); rail(); return; }
  const hid=e.target.closest('.hid'); if(hid){ hid.classList.remove('hid'); return; }
  const hb=e.target.closest('[data-hide]'); if(hb){ const [k,col]=hb.dataset.hide.split(':'); toggleCol(k,col,hb); return; }
  const thc=e.target.closest('table.duty th[data-col]'); if(thc){ const t=thc.closest('table'); const btn=t.closest('.sec').querySelector(`[data-hide="${t.dataset.t}:${thc.dataset.col}"]`); toggleCol(t.dataset.t, thc.dataset.col, btn); }
});
function toggleCol(k,col,btn){
  const t=document.querySelector(`table.duty[data-t="${k}"]`); if(!t) return;
  const on = btn.getAttribute('aria-pressed')!=='true';
  t.closest('.sec').querySelectorAll('[data-hide]').forEach(b=>{ b.setAttribute('aria-pressed','false'); });
  t.querySelectorAll('td[data-col]').forEach(td=>td.classList.remove('hid'));
  t.querySelectorAll('th .eye').forEach(x=>x.textContent='gizle');
  if(on){ btn.setAttribute('aria-pressed','true'); t.querySelectorAll(`td[data-col="${col}"]`).forEach(td=>td.classList.add('hid')); t.querySelector(`th[data-col="${col}"] .eye`).textContent='gizli · hücrelere dokun'; }
  t.closest('.tw').classList.toggle('drill', on);
}
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('hid')){ e.preventDefault(); e.target.classList.remove('hid'); } });

const h=(location.hash||'').slice(1);
show(MODS.some(m=>m.id===h)?h:store.get('opc6.cur','brief'));
</script>
