M({id:'stall', grp:'Manevralar', t:'Stall & Upset Recovery', lead:`QRH MAN.1.1 ve MAN.1.14–1.15. Notlandırılan kısım PF aksiyonlarıdır. Her adımı, eliyle yaptığın aksiyonla birlikte yüksek sesle söyle.`, secs:[
 {h:'Approach to Stall veya Stall Recovery', tag:'co', ref:'QRH MAN.1.1', src:['IMG_1146'], pre:`<p>Approach to stall durumundan tüm recovery’leri, gerçek bir stall olmuş gibi yap. Stall’un ilk belirtisinde (buffet ya da stick shaker) aşağıdakileri hemen uygula.</p><div class="box note"><p><b>Not:</b> Recovery sırasında flight director komutlarını kullanma.</p></div>`, table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   [`<b>Initiate the recovery:</b><p>• Hold the control column firmly.</p><p>• Disengage autopilot and autothrottle.</p><p>• Smoothly apply nose down elevator to reduce the angle of attack until buffet or stick shaker stops. Nose down stabilizer trim may be needed.*</p>`,`• Monitor altitude and airspeed.<p>• Verify all needed actions have been done and call out any omissions.</p><p>• Call out any trend toward terrain contact.</p>`],
   [`<b>Continue the recovery:</b><p>• Roll in the shortest direction to wings level if needed.**</p><p>• Advance thrust levers as needed.</p><p>• Retract the speedbrakes.</p><p>• Do not change gear or flap configuration, except during liftoff, if flaps are up, call for flaps 1.</p>`,`• Monitor altitude and airspeed.<p>• Verify all needed actions have been done and call out any omissions.</p><p>• Call out any trend toward terrain contact.</p><p>• Set the FLAP lever as directed.</p>`],
   [`<b>Complete the recovery:</b><p>• Check airspeed and adjust thrust as needed.</p><p>• Establish pitch attitude.</p><p>• Return to the desired flight path.</p><p>• Re-engage the autopilot and autothrottle if desired.</p>`,`• Monitor altitude and airspeed.<p>• Verify all needed actions have been done and call out any omissions.</p><p>• Call out any trend toward terrain contact.</p>`]
 ]}, post:`<div class="box warn"><p><b>UYARI:</b> *Control column gereken tepkiyi vermezse stabilizer trim gerekebilir. Aşırı pitch trim kullanımı durumu kötüleştirebilir, kontrol kaybına ya da yüksek yapısal yüklere yol açabilir.</p></div>`},
 {h:'Upset Recovery — tanımlar', tag:'co', ref:'QRH MAN.1.14', src:['IMG_1158'], html:`
  <p>Geçmişte upset, istemeden şu değerlerin aşılması olarak tanımlanırdı:</p>
  <ul><li><b>25° nose up</b>’tan büyük pitch attitude</li><li><b>10° nose down</b>’dan büyük pitch attitude</li><li><b>45°</b>’den büyük bank açısı</li><li>Bunlardan az, ama koşullara uygun olmayan bir hızda.</li></ul>
  <p>Artık uçağın amaçlanan durumundan saptığı her an upset kabul edilir. Aksiyonlar mantıklı bir sıra izler ve yalnızca yol göstericidir. Gerekirse ilk recovery sırasında minimum pitch trim kullan. Rudder’ı roll kontrolüne yardım için dikkatli kullan; yalnızca roll kontrolü etkisizse ve uçak stall’da değilse.</p>
  <p><b>Stall’u tanıma:</b> stick shaker · zaman zaman şiddetli olabilen buffet · pitch otoritesi eksikliği · roll kontrolü eksikliği · alçalmayı durduramama. Stall’daysan önce stall’dan çık: stall recovery tamamlanıp stick shaker durana kadar nose down elevator uygula ve koru.</p>`},
 {h:'Nose High Recovery', tag:'co', ref:'QRH MAN.1.15', src:['IMG_1159'], table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   {span:`Recognize and confirm the developing situation`},
   [`Disengage autopilot<p>Disengage autothrottle</p><p><b>Recover:</b></p><p>• Apply nose-down elevator. Apply as much elevator as needed to obtain a nose down pitch rate</p><p>• Apply appropriate nose down stabilizer trim*</p><p>• Reduce thrust</p><p>• Roll (adjust bank angle) to obtain a nose down pitch rate*</p><p><b>Complete the recovery:</b></p><p>• When approaching the horizon, roll to wings level</p><p>• Check airspeed and adjust thrust</p><p>• Establish pitch attitude.</p>`,`Call out ${co('"UPSET"')}<p>Call out attitude, airspeed and altitude throughout the recovery.</p><p>Verify all needed actions have been done and call out any continued deviation.</p>`]
 ]}},
 {h:'Nose Low Recovery', tag:'co', ref:'QRH MAN.1.15', src:['IMG_1159','IMG_1160'], table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   {span:`Recognize and confirm the developing situation`},
   [`Disengage autopilot<p>Disengage autothrottle</p><p><b>Recover:</b></p><p>• Recover from stall, if needed</p><p>• Roll in the shortest direction to wings level. If bank angle is more than 90 degrees, unload and roll.*</p><p><b>Complete the recovery:</b></p><p>• Apply nose up elevator</p><p>• Apply nose up trim, if needed*</p><p>• Adjust thrust and drag, if needed.</p>`,`Call out ${co('"UPSET"')}<p>Call out attitude, airspeed and altitude throughout the recovery.</p><p>Verify all needed actions have been done and call out any continued deviation.</p>`]
 ]}, post:`<div class="box warn"><p><b>UYARI:</b> * Aşırı pitch trim ya da rudder kullanımı upset’i kötüleştirebilir, kontrol kaybına ya da yüksek yapısal yüklere yol açabilir.</p></div>`}
]});

/* ---------- 9. GPWS & TCAS ---------- */
M({id:'gpws', grp:'Manevralar', t:'GPWS & TCAS', lead:`QRH MAN.1.8–1.13, yanlış look-ahead uyarıları için SunExpress şirket prosedürü dahil. Hangi uyarıların asla göz ardı edilemeyeceğini bil: radio altitude’a dayanan her uyarı.`, secs:[
 {h:'GPWS Caution', tag:'co', ref:'QRH MAN.1.10', src:['IMG_1154'], html:`
  <p>Aşağıdaki sesli uyarılardan herhangi biri için bu manevrayı uygula: SINK RATE · TERRAIN · DON'T SINK · TOO LOW FLAPS · TOO LOW GEAR · TOO LOW TERRAIN · GLIDESLOPE · BANK ANGLE · AIRSPEED LOW (as installed) · CAUTION TERRAIN · CAUTION OBSTACLE (as installed).</p>
  <table class="duty" style="min-width:0"><tr><th colspan="2">Pilot Flying / Pilot Monitoring</th></tr><tr class="span"><td colspan="2">Correct the flight path, airplane configuration, or airspeed.</td></tr></table>
  <p style="margin-top:10px">Glideslope altı sapma uyarısı şu durumlarda iptal edilebilir ya da inhibe edilebilir: localizer ya da backcourse yaklaşma · ILS’ten circling yaklaşma · koşullar glideslope altında bilinçli bir yaklaşma gerektirdiğinde · güvenilmez glideslope sinyali.</p>
  <div class="box note"><p><b>Not:</b> Gündüz VMC’de uçarken bir terrain caution gelirse ve hiçbir engel ya da arazi tehlikesi olmadığı görsel olarak kesin doğrulanırsa, uyarı caution olarak değerlendirilebilir ve yaklaşmaya devam edilebilir.</p><p><b>Not:</b> Bazı sesli uyarılar tekrarlanır.</p></div>`},
 {h:'GPWS Warning (PULL UP)', tag:'co', ref:'QRH MAN.1.10–1.11', src:['IMG_1154','IMG_1155'], pre:`<p>Şunlar için: "PULL UP" veya "TERRAIN TERRAIN PULL UP" · "PULL UP" veya "OBSTACLE OBSTACLE PULL UP" (as installed) · araziye doğru kabul edilemez uçuşla sonuçlanan diğer durumlar.</p>`, table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   [`• Disengage autopilot.<p>• Disengage autothrottle.</p><p>• Aggressively apply maximum* thrust.</p><p>• Simultaneously roll wings level and rotate to an initial pitch attitude of <b>20°</b>.</p><p>• Retract speedbrakes.</p><p>• If terrain remains a threat, continue rotation up to the pitch limit indicator (if available) or stick shaker or initial buffet.</p>`,`• Assure maximum* thrust.<p>• Verify all needed actions have been completed and call out any omissions.</p>`],
   [`• Do not change gear or flap configuration until terrain separation is assured.<p>• Monitor radio altimeter for sustained or increasing terrain separation.</p><p>• When clear of terrain, slowly decrease pitch attitude and accelerate.</p>`,`• Monitor vertical speed and altitude (radio altitude for terrain clearance and barometric altitude for a minimum safe altitude).<p>• Call out any trend toward terrain contact.</p>`]
 ]}, post:`<div class="box note"><p><b>Not:</b> Hız azaldıkça geriye doğru control column kuvveti artar. Her durumda, aralıklı stick shaker ya da initial buffet veren pitch attitude, üst pitch attitude limitidir. Arazi ayrımını kesin sağlamak için aralıklı stick shaker’da uçmak gerekebilir. Pitch attitude overshoot’unu ve stall’u önlemek için yumuşak ve sabit kumanda kullan.</p><p><b>Not:</b> Flight director komutlarını kullanma.</p><p><b>Not:</b> *EEC’ler normal moddaysa maksimum thrust, thrust lever’ları tam ileri iterek elde edilir. Arazi teması yakınsa thrust lever’ları tam ileri it.</p><p><b>Not:</b> Tırmanış, seyir ya da alçalmada gelen ve minimum safe altitude üzerinde olunduğu hemen doğrulanabilen bir look-ahead terrain warning güvenilmez sayılabilir.</p><p><b>Not:</b> Gündüz VMC’de uçarken, terrain ya da obstacle warning’den önce hiçbir engel ya da arazi tehlikesi olmadığı görsel olarak kesin doğrulanmışsa, uyarı caution olarak değerlendirilebilir ve yaklaşmaya devam edilebilir.</p></div>`},
 {h:'GPWS Response — şirket prosedürü', tag:'co', ref:'QRH MAN.1.8–1.9', src:['IMG_1153','IMG_1152'], html:`
  <p>Commander’ın takdirine bağlı olarak, bir <b>Look-ahead Terrain Alert</b>’in yanlış olduğundan <b>hiç şüphe yoksa</b>, uyarı göz ardı edilebilir ve GPWS response manevrası <b>yalnızca</b> aşağıdaki koşullardan birinde alındıysa uygulanmayabilir:</p>
  <ul><li>Yerdeyken veya,</li><li>Gündüz VMC’de veya,</li><li>MSA/MGA’nın yüksek olanının üzerindeyken veya,</li><li>FAP’de ya da sonrasında ILS’te (LOC ve G/S) established iken.</li></ul>
  <p>Uyarı göz ardı edilirse TERR INHIBIT ve RUNWAY INHIBIT (as installed) switch’leri uçuşun geri kalanı için INHIBIT’e alınabilir. Bunları <b>en geç bir sonraki uçuşun Preflight Procedure’ünde</b> korumalı NORM konumuna al. En emniyetli görülürse daha erken NORM’a alınabilir.</p>
  <div class="box warn"><p><b>Bu prosedür radio altitude’a dayalı uyarılar için geçerli değildir.</b> RA tabanlı her GPWS uyarısı (caution/warning) geçerlidir ve uygun GPWS Maneuver’ına göre hemen yanıt verilmelidir. "TOO LOW TERRAIN" RA tabanlı bir uyarı OLABİLİR (ND uyarısı yok).</p></div>
  <h4>Akış şeması (MAN.1.9) — yanlış olduğundan şüphelenilen look-ahead uyarısı</h4>
  <ol style="margin:0 0 6px;padding-left:20px"><li><b>Şüphe var mı?</b> EVET → GPWS manevrasını hemen uygula.</li><li>HAYIR → <b>Gündüz + VMC?</b> EVET → 5’e git.</li><li>HAYIR → <b>MSA/MGA’da ya da üzerinde (ikisinden yüksek olanı)?</b> EVET → 5’e git.</li><li>HAYIR → <b>ILS yaklaşma: LOC + GS üzerinde (FAP’de ya da sonrasında)?</b> EVET → 5’e git. HAYIR → GPWS manevrasını uygula.</li><li><b>Durum açıkça tanımlandı mı?</b> HAYIR → GPWS manevrasını uygula. EVET → uyarı yanlış kabul edilebilir; gerekirse TERRAIN &amp; RUNWAY switch’leri inhibe edilebilir (en geç bir sonraki uçuşun pre-flight procedure’ünde NORM’a geri).</li></ol>`},
 {h:'Trafikten Kaçınma (TCAS)', tag:'co', ref:'QRH MAN.1.12–1.13', src:['IMG_1156','IMG_1157'], pre:`<p>Bir TCAS TA ya da RA geldiğinde aşağıdakileri hafızadan hemen uygula.</p>
  <div class="box warn"><p><b>UYARI:</b> RA ile hava trafik kontrol arasında çelişki varsa RA’ya uy.</p><p><b>UYARI:</b> Bir RA verildikten sonra, RA’ya uymak için gerekenler dışında mevcut dikey hız değiştirilirse emniyetli ayrım tehlikeye girebilir (TCAS II–TCAS II koordinasyonu sürüyor olabilir).</p><p><b>UYARI:</b> 1000 ft AGL altında verilen DESCEND (aşağı uç) RA’sını takip etme.</p></div>
  <div class="box note"><p>Stick shaker ya da initial buffet olursa hemen APPROACH TO STALL RECOVERY’yi uygula. High speed buffet olursa pitch kuvvetini gerektiği kadar gevşet ama manevraya devam et. Çatışma bitene kadar flight director pitch komutlarını kullanma. Yalnızca TA’ya dayalı manevralar ayrımı azaltabilir ve önerilmez.</p></div>`, table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   {hdr:`For TA`},
   {span:`Look for traffic using traffic display as a guide. Call out any conflicting traffic.`},
   [`If traffic is sighted, maneuver if needed.`,``],
   {hdr:`For RA, except a climb in landing configuration`},
   [`If maneuvering is needed, disengage the autopilot and disengage the autothrottle. Smoothly adjust pitch and thrust to satisfy the RA command. Follow the planned lateral flight path unless visual contact with the conflicting traffic requires other action.`,``],
   {span:`Attempt to establish visual contact*. Call out any conflicting traffic.`},
   {hdr:`For a climb RA in landing configuration`},
   [`Disengage the autopilot and disengage the autothrottle. Advance thrust levers forward to ensure maximum thrust is attained and call for ${co('"FLAPS 15."')} Smoothly adjust pitch to satisfy the RA command. Follow the planned lateral flight path unless visual contact requires other action.`,`Verify maximum thrust set. Position flap lever to 15 detent.`],
   [`Verify a positive rate of climb on the altimeter and call ${co('"GEAR UP."')}`,`Verify a positive rate of climb on the altimeter and call ${co('"POSITIVE RATE."')}<p>Set the landing gear lever to UP.</p>`],
   {span:`Attempt to establish visual contact*. Call out any conflicting traffic.`}
 ]}, post:`<div class="box note"><p>*Gözle görülen trafik, RA’ya neden olan trafikle aynı olmayabilir. Bir karşılaşmanın görsel algısı, özellikle gece, yanıltıcı olabilir.</p></div>`},
 {h:'Uyarı öncelikleri: windshear · GPWS · TCAS · stall', tag:'bg', ref:'FCOM 15.20.14 · 15.20.25 · 15.20.36 · QRH MAN.1.10–1.12', html:`
  <div class="fcom"><div class="fh"><span class="fref">FCOM 15.20.14 · 15.20.25 · 15.20.36</span><b>Hangi uyarı hangisini susturur</b></div>
  <ol style="margin:4px 0;padding-left:20px">
   <li><b>Windshear (gerçek windshear warning, uçak windshear içinde)</b> — "Look-ahead terrain alerts and radio altitude based alerts are inhibited by an actual windshear warning" (15.20.14). "Predictive windshear alerts are inhibited by an actual windshear warning" (15.20.25).</li>
   <li><b>GPWS (look-ahead ve RA tabanlı)</b> — "Predictive windshear alerts are inhibited by … look-ahead terrain alerts, or radio altitude based alerts" (15.20.25).</li>
   <li><b>Predictive windshear</b> ("WINDSHEAR AHEAD", "MONITOR RADAR DISPLAY") — sadece gerçek windshear ve GPWS susturur.</li>
   <li><b>TCAS</b> — "All TCAS alerts are inhibited by GPWS and windshear warnings" (15.20.36). Ayrıca: INCREASE DESCENT RA ≈1500 ft RA altında, DESCEND RA ≈1100 ft RA altında, tüm RA’lar ≈1000 ft RA altında inhibit (TA ONLY), tüm TCAS sesleri ≈500 ft RA altında susar.</li>
  </ol></div>
  <div class="box warn"><p><b>Stall bu sıralamanın dışında, hepsinin üstünde bir sınırdır.</b> Stick shaker hiçbir uyarı tarafından susturulmaz. GPWS ve windshear manevralarında aralıklı stick shaker / initial buffet <b>üst pitch limitidir</b> (QRH). TCAS RA sırasında stick shaker veya buffet gelirse <b>hemen approach-to-stall recovery</b> (QRH MAN.1.12).</p></div>
  <table class="data"><tr><th>Uyarı</th><th>Neyi susturur</th><th>Neyle susar</th></tr>
   <tr><td>Windshear warning</td><td>GPWS, predictive windshear, TCAS</td><td>—</td></tr>
   <tr><td>GPWS</td><td>Predictive windshear, TCAS</td><td>Windshear warning</td></tr>
   <tr><td>Predictive windshear</td><td>—</td><td>Windshear warning, GPWS</td></tr>
   <tr><td>TCAS</td><td>—</td><td>GPWS, windshear warning</td></tr>
   <tr><td>Stall (stick shaker)</td><td>—</td><td>Hiçbiri · her manevrada üst sınır</td></tr></table>
  <p class="cond">Sim notu: windshear escape sırasında GPWS sesi duymazsın (susturulmuş). Araziyi PM, radar altimetre ve dikey hızla sesli takip eder.</p>`}
]});

/* ---------- 10. Windshear & ORW ---------- */
M({id:'ws', grp:'Manevralar', t:'Windshear & Overrun Warnings', lead:`QRH MAN.1.16–1.21. A/T inop iken manual flight sütununu uygula: TO/GA yalnızca flight director guidance verir, bu yüzden thrust’ı elle tam ileri itersin.`, secs:[
 {h:'Windshear Caution ve Warning', tag:'co', ref:'QRH MAN.1.16–1.17', src:['IMG_1160','IMG_1161'], html:`
  <p><b>Predictive windshear caution</b> ("MONITOR RADAR DISPLAY"): windshear’dan kaçınmak için gerektiği gibi manevra yap.</p>
  <p><b>Kalkış koşusunda predictive warning</b> ("WINDSHEAR AHEAD, WINDSHEAR AHEAD"): V1’den önce kalkışı reddet · V1’den sonra Windshear Escape Maneuver uygula.</p>
  <p><b>Kalkış koşusunda windshear ile karşılaşma:</b></p>
  <ul><li>V1’den önce, V1’de RTO başlatılırsa durmak için yeterli pist kalmayabilir. VR’de normal hızla <b>15°</b> pitch attitude’a doğru rotate et. Havalanınca Windshear Escape Maneuver uygula.</li>
  <li>Normal rotation hızına yakınken ani hız düşüşü: durmak için yeterli pist kalmadıysa, hız düşük olsa bile <b>pist sonundan en az 2,000 feet önce</b> normal rotation başlat. Normalden yüksek attitude’lar gerekebilir. Maksimum thrust’ın set edildiğinden emin ol.</li></ul>
  <p><b>Yaklaşmada predictive warning</b> ("GO-AROUND, WINDSHEAR AHEAD"): Windshear Escape Maneuver ya da, pilotun takdirine göre, normal go-around uygula.</p>
  <p><b>Uçuşta windshear ile karşılaşma:</b> Windshear Escape Maneuver uygula.</p>
  <p>Windshear belirtileri: windshear warning (iki tonlu siren ve ardından "WINDSHEAR, WINDSHEAR, WINDSHEAR") ya da kabul edilemez uçuş yolu sapmaları, yani <b>1000 ft AGL altında</b> şu değerleri aşan kontrolsüz değişimler:</p>
  <table class="data"><tr><td class="v">15 kt</td><td>gösterge hızı</td></tr><tr><td class="v">500 fpm</td><td>dikey hız</td></tr><tr><td class="v">5°</td><td>pitch attitude</td></tr><tr><td class="v">1 dot</td><td>glideslope’tan sapma</td></tr><tr><td class="v">—</td><td>uzun süre olağandışı thrust lever konumu</td></tr></table>`},
 {h:'Windshear Escape Maneuver', tag:'co', ref:'QRH MAN.1.18–1.19', src:['IMG_1162','IMG_1163'], table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   {hdr:`MANUAL FLIGHT`},
   [`• Callout ${co('"WINDSHEAR"')}<p>• Disengage autopilot.</p><p>• Push either TO/GA switch.</p><p>• Aggressively apply maximum thrust*</p><p>• Disengage autothrottle.</p><p>• Simultaneously roll wings level and rotate toward an initial pitch attitude of <b>15°</b>.</p><p>• Retract speedbrakes.</p><p>• Follow flight director TO/GA guidance (if available)**</p>`,`• Verify maximum* thrust.<p>• Verify all needed actions have been completed and call out any omissions.</p>`],
   {hdr:`AUTOMATIC FLIGHT`},
   [`• Push either TO/GA switch***<p>• Verify TO/GA mode annunciation.</p><p>• Verify GA thrust.</p><p>• Retract speedbrakes.</p><p>• Monitor system performance****</p>`,`• Verify GA* thrust.<p>• Verify all needed actions have been completed and call out any omissions.</p>`],
   {hdr:`MANUAL OR AUTOMATIC FLIGHT`},
   [`• Do not change flap or gear configuration until windshear is no longer a factor.<p>• Maintain wings level to maximize climb gradient, unless a turn is required for obstacle clearance.</p><p>• Monitor vertical speed and altitude.</p><p>• Do not attempt to regain lost airspeed until windshear is no longer a factor.</p>`,`• Monitor vertical speed and altitude.<p>• Call out any trend toward terrain contact, descending flight path, or significant airspeed changes.</p>`]
 ]}, post:`<div class="box note"><p>Hız azaldıkça geriye doğru control column kuvveti artar. Aralıklı stick shaker ya da initial buffet veren pitch attitude, üst pitch attitude limitidir.</p><p>* Maksimum thrust: EEC’ler normal moddaysa thrust lever’lar tam ileri. Arazi teması yakınsa thrust lever’ları tam ileri it.</p><p>** Pitch Limit Indication’ı aşma.</p><p>*** TO/GA kullanılamıyorsa autopilot ve autothrottle’ı ayır ve elle uç.</p></div><div class="box warn"><p><b>UYARI:</b> **** Şiddetli windshear AFDS’in performansını aşabilir. Autopilot ve autothrottle’ı ayırıp elle uçmaya hazır ol.</p></div>`},
 {h:'Overrun Warnings (ORW)', tag:'co', ref:'QRH MAN.1.20–1.21', src:['IMG_1164','IMG_1165'], pre:`<p><b>Havada:</b> "OVERRUN, GO-AROUND" sesli uyarısı ya da PFD’de GO-AROUND annunciation → <b>Go-around uygula.</b></p><p><b>Yerde:</b> "MAX BRAKES, MAX REVERSE" sesli uyarısı ya da PFD’de MAX REVERSE annunciation:</p>`, table:{cols:['Pilot Flying','Pilot Monitoring'], rows:[
   [`Without delay:<p>Simultaneously close the thrust levers and apply maximum manual wheel brakes.</p><p>Verify speed brakes are deployed or raise the SPEED BRAKE lever.</p><p>Apply reverse thrust up to the maximum amount consistent with conditions.</p><p>Continue maximum braking until certain the airplane will stop on the runway.</p>`,`Verify actions as follows:<p>Thrust levers closed.</p><p>Maximum brakes applied.</p><p>Verify SPEED BRAKE lever UP and call ${co('"SPEEDBRAKES UP."')} If not UP, call ${co('"SPEEDBRAKES NOT UP."')}</p><p>Reverse thrust applied. When both REV indications are green, call ${co('"REVERSERS NORMAL."')} If none or amber: ${co('"NO REVERSER ENGINE NUMBER 1 / 2"')} or ${co('"NO REVERSERS"')}.</p><p>Call out omitted action items.</p>`],
   [`When stopping is assured:<p>Start movement of the reverse thrust levers to reach the reverse idle detent before taxi speed.</p><p>After the engines are at reverse idle, move the reverse thrust levers to full down.</p>`,`Call out 60 knots.`]
 ]}}
]});

/* ---------- 11. Approach & landing ---------- */
M({id:'app', grp:'Varış', t:'Yaklaşma, Overweight ve OEI İniş', lead:`Profilin varış kısmı: şirketin 45/45 circling paterni (LTBJ CAVOK bunun için doğal bir yer), OEI landing checklist kuralları, landing configuration warning ve acil iniş ya da ditching çağrıları.`, secs:[
 {h:'Circling Approach (Şirket) — 45/45', tag:'co', ref:'QRH MAN.2.11', src:['IMG_1166'], html:`
  <svg viewBox="0 0 640 300" width="100%" style="max-width:640px;display:block;margin:4px auto 12px" role="img" aria-label="45/45 circling paterni şeması">
   <rect x="0" y="0" width="640" height="300" fill="none"/>
   <rect x="330" y="140" width="220" height="16" rx="2" style="fill:var(--soft);stroke:var(--muted)"/>

 {h:'Stabilize yaklaşma (SAP)', tag:'co', ref:'OM-A 8.3.1.16.6', src:['IMG_1069','IMG_1070','IMG_1071','IMG_1072'], html:`

 {h:'Overweight iniş', tag:'co', ref:'OM-A 8.3.1.19.1 · FCTM 6', src:['IMG_1073','IMG_1074','IMG_1075'], html:`
  <p><b>OM-A:</b> Overweight iniş, commander’ın takdirine göre uçuşa devam etmekle aynı ya da daha yüksek emniyet düzeyi sağladığı tüm anormal ve acil durumlarda yapılabilir. Acil tıbbi müdahale gerektiren ciddi hastalık da bunu haklı kılabilir. Şunları değerlendir: <b>sistem arızası</b> (kontrol edilebilirlik, frenleme), <b>performans gereksinimleri</b>, <b>meteorolojik koşullar</b>. Overweight inişi <b>TLB/ETL</b>’ye kaydet.</p>
  <div class="box note"><p>Teker koymada normal sink rate ortalama 120 ft/min’dir. Sertifikalı değerler: MTOW’da 360 ft/min, MLW’de 600 ft/min. Teker koyma sink rate’i 360 ft/min’i aşmazsa yapısal sorun olmaz.</p></div>
  <p><b>FCTM tekniği:</b></p><ul>
   <li>Normal iniş prosedürleri; olumsuz bir kullanım özelliği yok. Islak/kaygan pist uzunluğunu QRH iniş mesafesinden (PI bölümü) doğrula. Tüm ağırlıklarda flaps 30/40 normal inişlerde brake energy limitleri aşılmaz.</li>
   <li>Flap placard hızına daha fazla pay için <b>flaps 40 yerine flaps 30</b>.</li>
   <li>Durma mesafesi endişe veriyorsa ağırlığı azalt (Kaptan’ın takdiri: yakıt yakmak için gear down ile alçakta bekle).</li>
   <li><b>Flaps 15 ya da daha az</b> (non-normal) ile ağır inişler ve maksimum efor duruşlar brake energy limitlerini aşabilir: kullanılabilir pistin tamamını kullan.</li>
   <li>Placard payı için flap açma, normal maneuver hızlarının 20 kt altına kadar uçulabilir (ama 15° overshoot payı olmaz).</li>
   <li>En uzun pist; rüzgârı ve eğimi göz önüne al; tailwind, aşağı eğim ve zayıf frenlemeden kaçın. Fazla hız taşıma, özellikle OEI. MLW üzerinde wind additive flap placard’larıyla sınırlanabilir.</li>
   <li>Normal profil uç, yüksek sink rate yok; uçağı havada tutma, touchdown zone’a in — uzun iniş olacaksa go-around yap. Maksimum reverse, pistin tamamını kullan, erken çıkış yok. Mesafe izin veriyorsa QRH’deki önerilen autobrake.</li>
   <li><b>Overweight autoland önerilmez</b> (MLW üzerinde sertifikalı değil): otomatik yaklaşma uçulabilir, flare yüksekliğinden önce ayır ve elle in.</li></ul>
  <div class="box caut"><p><b>OPC-6’da EHAM’a dönüş:</b> MLW 66,360 kg’a karşı ~69 t, OEI → şirket OEI iniş flap 15 (OEI’de flaps 30 planlanmaz), RWYCC 4, crosswind ~20 kt: en uzun pist, QRH iniş mesafesi, max reverse, autoland yok, gerekirse yüksek alçalma oranını brifing et.</p></div>`},

 {h:'Acil İniş / Ditching', tag:'co', ref:'OM-B 3.17', src:['IMG_1207'], html:`
  <p>Bir acil durum nedeniyle inişin emniyetli sonuçlanacağından emin olunamıyorsa, Kaptan Cabin Crew’a final yaklaşma sırasında kokpitten PA üzerinden ${co('"BRACE FOR IMPACT, BRACE FOR IMPACT"')} komutunun gelebileceğini bildirmelidir. Zamanlamayı brace pozisyonuna göre ayarla: pozisyonu almak için gereken süre ve yolcuların iniş ya da çarpmaya kadar bu pozisyonda kalabilme becerisi.</p>
  <div class="box caut"><p><b>DİKKAT:</b> Uçuş sırasında bir acil durum nedeniyle inişin emniyetli sonuçlanacağından emin olunamıyorsa, Kaptan Cabin Crew’a – Brace for Impact – komutunun kokpitten gelebileceğini bildirmelidir.</p></div>
  <h4>Ditching sırasında</h4><ul><li><b>500 feet</b>’te Cabin Crew’a ditching’in yakın olduğunu bildir.</li><li><b>50 feet</b>’te ${co('"BRACE FOR IMPACT, BRACE FOR IMPACT."')} anonsunu yap.</li></ul>`}

const $ = s => document.querySelector(s);
const state = { done: store.get('opc6.done',{}), mem: store.get('opc6.mem',{}), drill: false };

function rail(){
  let g='', h='';
  MODS.forEach((m,i)=>{
    if(m.grp!==g){ g=m.grp; h+=`<li class="grp">${g}</li>`; }
    h+=`<li><button data-go="${m.id}" aria-current="${cur===m.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${m.t}</span><span class="ck">${state.done[m.id]?'✓':''}</span></button></li>`;
  });
  $('#rail').innerHTML = h;
  const n = MODS.filter(m=>state.done[m.id]).length;
  $('#ovN').textContent = n; $('#ovT').textContent = MODS.length;
  $('#ovBar').style.width = (100*n/MODS.length)+'%';
  $('#ovMem').textContent = `${MEMS.filter(x=>state.mem[x.id]==='ok').length} / ${MEMS.length} memory NNC biliniyor`;
  const a = document.querySelector('nav.rail button[aria-current="true"]'); if(a && window.innerWidth<=900) a.scrollIntoView({block:'nearest',inline:'center'});
}

function thumbs(list){ return list && list.length ? `<div class="thumbs">${list.map(k=>`<button class="thumb" data-src="${k}" title="${SRC[k]}"><img loading="lazy" src="src/${k}.webp" alt="${SRC[k]}"><span>${k.replace('IMG_','')}</span></button>`).join('')}</div>` : ''; }

function stepHTML(s, drillable){
  if(!Array.isArray(s)) return `<li class="note"><span class="no"></span><div class="line" style="color:var(--muted);font-style:italic">${s.note}</div></li>`;
  const [no,c,r,fl='',by] = s; const sub = fl.includes('sub'), cf = fl.includes('cf');
  const d = drillable ? ' data-d="1"' : '';
  if(r==null) return `<li class="${sub?'sub':''}"><span class="no">${no}</span><div class="line"><span class="c${drillable?' dt':''}"${d}>${c}</span>${by?`<span class="dots"></span><span class="r">${by}</span>`:''}</div></li>`;
  return `<li class="${sub?'sub':''}"><span class="no">${no}</span><div class="line"><span class="c">${c}</span><span class="dots"></span>${cf?'<span class="cf">CONFIRM</span>':''}<span class="r dt"${d}>${r}</span>${by?`<span class="r" style="color:var(--muted);min-width:44px">${by}</span>`:''}</div></li>`;
}

function nncCard(m, withMark){
  const mk = state.mem[m.id];
  return `<article class="sec" data-mem="${m.id}">
   <div class="sec-head"><h3>${m.t}</h3><span class="src-tag co">SXS ${m.ref}</span></div>
   <p class="cond"><b>Koşul:</b> ${m.cond}</p>
   <ol class="qrh">${m.mem.map(s=>stepHTML(s,true)).join('')}</ol>
   <div class="memline">memory items sonu</div>
   ${m.refs?`<div class="refitems"><ol class="qrh">${m.refs.map(s=>stepHTML(s,false)).join('')}</ol></div>`:''}
   ${m.more?`<div class="cont">▼ Reference items QRH’te devam ediyor</div>`:(!m.refs?`<div class="cont">■ ■ ■ ■</div>`:'')}
   ${m.note?`<div class="box note"><p>${m.note}</p></div>`:''}
   ${thumbs(m.src)}
   ${withMark?`<div class="mark"><button class="btn good" data-mk="ok" aria-pressed="${mk==='ok'}">Biliyorum</button><button class="btn bad" data-mk="again" aria-pressed="${mk==='again'}">Çalışmam lazım</button></div>`:''}
  </article>`;
}

function tableHTML(t, key){
  const cols = t.cols;
  let h = `<div class="tw"><table class="duty" data-t="${key}"><thead><tr>${cols.map((c,i)=>`<th data-col="${i}" title="Drill için bu sütunu gizlemek/göstermek üzere dokun">${c}<span class="eye">gizle</span></th>`).join('')}</tr></thead><tbody>`;
  t.rows.forEach(r=>{
    if(r.hdr) h+=`<tr class="hdr"><td colspan="2">${r.hdr}</td></tr>`;
    else if(r.span) h+=`<tr class="span"><td colspan="2">${r.span}</td></tr>`;
    else h+=`<tr>${r.map((c,i)=>c?`<td data-col="${i}">${c}</td>`:`<td class="empty"></td>`).join('')}</tr>`;
  });
  return h+`</tbody></table></div>`;
}

function clHTML(cl){ return `<p class="cond"><b>Koşul:</b> ${cl.cond}</p><ol class="qrh">${cl.steps.map(s=>stepHTML(s,false)).join('')}</ol><div class="cont">■ ■ ■ ■ &nbsp;·&nbsp; sağ sütun = kim yapar (C = Captain)</div>`; }

>Bazı uçakların daha düşük <b>alternate<\/b> maksimum ağırlıkları da vardır (örneğin 72,000–77,000 kg alternate kalkış ağırlıkları). \"Alternate weights are applicable only when operating under Alternate Weights appendices specified in the AFM ... and are placarded on the flight deck.\"<\/p><p>\"In the event of a conflict between the FCOM and the AFM, the AFM shall govern.\" Planlama için kendi uçağının OM-B ve loadsheet değerini kullan.<\/p>", "si": 3}, {"module": "limits", "ref": "FCOM L.10.2 (PDF p175)", "title": "FCOM genel uçak AFM maddeleri", "html": "<ul><li>\"Installation of handle covers on the overwing exits must be verified prior to departure whenever passengers are carried.\"<\/li><li>\"Verify that an operational check of the flight deck door access system has been accomplished according to approved procedures once each flight day.\"<\/li><li>Maksimum uçuş operasyon enlemi ADIRU MagVar tablolarına bağlıdır: 82° N/S; bazı boylam bantlarında 70° N (veya 73° N) ve 60° S limitleri vardır (effectivity: bazı uçaklar).<\/li><li>ADIRU alignment \"must not be attempted at latitudes greater than 78 degrees 15 minutes\" (L.10.11).<\/li><\/ul>", "si": 4}, {"module": "limits", "ref": "FCOM L.10.7 (PDF p180)", "title": "Basınçlandırma limiti", "html": "<p><b>AFM limiti:<\/b> \"The maximum cabin differential pressure (relief valves) is 9.1 psi.\"<\/p><p>FCOM, bu sayfada zaten bulunan AFM dışı kuralı da listeler: engine bleed’ler ON iken kalkış, yaklaşma veya inişte packs HIGH’da kullanılmaz; ancak bir yangından korunma NNC’si (CARGO FIRE, SMOKE/FUMES REMOVAL) HIGH gerektiriyorsa kullanılır.<\/p><p>FCOM L.10.9–L.10.10’daki motor ve APU maddeleri özünde yukarıdaki OM-B listesiyle aynıdır: ignition, anti-skid inoperative iken assumed temperature yok, uçuşta reverse yok, APU irtifa limitleri, bleed valve kuralları ve başarısız üç APU start denemesinden sonra 15 dakikalık soğuma süresi.<\/p>", "si": 5}, {"module": "limits", "ref": "FCOM L.10.7–L.10.8 (PDF p180–181)", "title": "AFM autoland rüzgâr limitleri ve OM-B", "html": "<p>\"# Airplanes operating with EASA Certification – Maximum allowable wind speeds, when conducting a dual channel Cat II or Cat III landing predicated on autoland operations\":<\/p><ul><li>Headwind <b>25 kt<\/b><\/li><li>Crosswind <b>20 kt<\/b> veya <b>25 kt<\/b> (effectivity: bazı uçaklar)<\/li><li>Tailwind 10 kt (TC-SPM, TC-SPO) veya çoğu uçakta <b>15 kt flaps 40 / 12 kt flaps 30<\/b> (effectivity: bazı uçaklar)<\/li><\/ul><p>OM-B şirket limiti (25 / 10 / 10 kt) çok daha sıkıdır ve bu uygulanır.<\/p><p>EASA sertifikalı bazı uçaklarda: \"Autoland capability may only be used with flaps 30 with one engine operative and only for DH at or above 50 feet\" (effectivity: bazı uçaklar).<\/p>", "si": 6}, {"module": "limits", "ref": "FCOM L.10.12 (PDF p185)", "title": "Yakıt sistemi limitleri", "html": "<ul><li>\"Maximum tank fuel temperature is 49°C.\"<\/li><li>\"Minimum tank fuel temperature prior to takeoff and inflight is –43°C, or 3°C above the fuel freezing point temperature, whichever is higher.\" Fuel System Icing Inhibitor bunu değiştirmez.<\/li><li>\"Intentional dry running of a center tank fuel pump (low pressure light illuminated) is prohibited\" (effectivity: bazı uçaklar).<\/li><li>Yakıt dengesi: \"Random fuel imbalance must not exceed 453 kgs for taxi, takeoff, flight or landing.\"<\/li><li>Yakıt yükleme: \"Main tanks 1 and 2 must be full if center tank contains more than 453 kgs.\"<\/li><\/ul><p>FL370’te uzun bir seyirde yakıt sıcaklığını takip et.<\/p>", "si": 8}, {"module": "limits", "ref": "FCOM L.10.11–L.10.13 (PDF p184–186)", "title": "Navigasyon, GPWS ve landing gear maddeleri", "html": "<ul><li>\"All flight operations based on magnetic heading or magnetic track angle are prohibited in geographic areas where the installed IRS MagVar table errors are greater than 5 degrees.\"<\/li><li>GPWS: \"Do not use the terrain display for navigation.\" GPWS terrain veritabanında olmayan bir havalimanının veya pistin 15 nm yakınında look-ahead terrain alerting ve terrain display kullanma.<\/li><li>Landing gear (AFM dışı): \"Do not apply brakes until after touchdown.\"<\/li><\/ul>", "si": 8}, {"module": "brief", "ref": "FCOM SP.16.2 · SP.16.9 (PDF p391, p398)", "title": "Buzlanma koşulları ve statik run-up", "html": "<p>\"Icing conditions exist when OAT (on the ground) or TAT (in flight) is 10°C or below and\" görünür nem varsa (kar veya görüşü 1,600 m ya da daha az olan sis dahil), \"or ice, snow, slush or standing water is present on the ramps, taxiways, or runways.\" EHAM’da −4 °C ve SN/BLSN ile iki koşul da sağlanır.<\/p><p>Kalkış: \"When engine anti-ice is required and the OAT is 3°C or below, the takeoff must be preceded by a static engine run-up ... Run-up to a minimum of 70% N1 and confirm stable engine operation before the start of the takeoff roll. A 30-second run-up is highly recommended whenever possible.\"<\/p><p>A/T INOP iken run-up’tan sonra set edilen thrust tamamen manueldir.<\/p>", "si": 3}, {"module": "brief", "ref": "FCOM SP.16.1 (PDF p390)", "title": "Boeing: kontamine 18L’den kalkış", "html": "<p>18L için (RWYCC 4, kar):<\/p><ul><li>\"Reduced thrust using assumed temperature method, whether alone or in combination with a fixed derate, is not allowed.\" Fixed derate’e yalnızca performans hesabı pist yüzeyini dikkate alıyorsa izin verilir.<\/li><li>\"V1 may be reduced to minimum V1 to provide increased stopping margin\", yeter ki continued-takeoff mesafesi ve mânia aşımı (obstacle clearance) hâlâ mevzuatı karşılasın.<\/li><li>\"Takeoffs are not recommended when slush, wet snow, or standing water depth is more than 1/2 inch (13 mm) or dry snow depth is more than 4 inches (102 mm).\"<\/li><\/ul>", "si": 4}, {"module": "brief", "ref": "FCOM SP.16.28 (PDF p417)", "title": "A/T kapalıyken yaklaşma hızı ilavesi", "html": "<p>Windshear yaklaşma ve iniş önlemlerinden:<\/p><p>\"If the autothrottle is disengaged, or is planned to be disengaged prior to landing, add an appropriate airspeed correction (correction applied in the same manner as gust), up to a maximum of 15 knots.\"<\/p><ul><li>\"Avoid large thrust reductions or trim changes in response to sudden airspeed increases as these may be followed by airspeed decreases.\"<\/li><li>\"Use of the autopilot and autothrottle for the approach may provide more monitoring and recognition time.\" Autothrottle’ın olmayacak, bu yüzden PM callout’larını brief et.<\/li><\/ul>", "si": 5}, {"module": "brief", "ref": "FCOM 4.20.11–4.20.12 (PDF p1330–1331)", "title": "A/T normalde senin için ne yapar", "html": "<p>\"The A/T system provides automatic thrust control from the start of takeoff through climb, cruise, descent, approach and go–around or landing.\" MEL 22-04 ile aşağıdaki A/T engagement’larının hiçbiri gerçekleşmez:<\/p><ul><li>\"engaging LVL CHG or VNAV climb modes automatically engages the A/T N1 mode\"<\/li><li>\"engaging LVL CHG or VNAV descent modes automatically engages the A/T in RETARD and then ARM when thrust is at idle\"<\/li><li>ALT ACQ / ALT HOLD (VNAV’da değilken) ve G/S capture, A/T MCP SPD’yi engage eder<\/li><li>\"alpha floor automatically engages the A/T when armed\"<\/li><\/ul><p>Her level-off, descent ve glideslope capture PF’in bir thrust aksiyonunu gerektirir.<\/p>", "si": 6}, {"module": "brief", "ref": "FCOM 4.20.6 · 4.20.40–4.20.42 (PDF p1325, p1359–1361)", "title": "Kaybettiğin hız korumaları", "html": "<ul><li>A/T ARM modu: \"the pilot can set thrust levers manually. Minimum speed protection is provided.\" A/T olmadan bu koruma yoktur.<\/li><li>\"Minimum speed reversion is not available when the A/T is OFF and the AFDS is in ALT HOLD or after G/S capture.\"<\/li><li>\"if the A/T is not available, no reversion response to gear or flap placard speeds is available. The AFDS reverts to speed control for Vmo/Mmo speed limiting.\" (effectivity: bazı uçaklar)<\/li><li>Minimum hızda: \"The AFDS commands nose down pitch to increase airspeed if the thrust levers are not advanced.\"<\/li><\/ul><p>ALT HOLD’da veya glideslope üzerindeyken tek hız koruması sensin.<\/p>", "si": 6}, {"module": "brief", "ref": "FCOM 4.20.13 · NP.21.43–44 · 4.10.27 (PDF p1332, p242–243, p1316)", "title": "Kalkış thrust’ını elle set etmek", "html": "<ul><li>\"Takeoff is a flight director only function of the TO/GA mode.\" Normalde \"pushing a TO/GA switch engages the autothrottle in the N1 mode\". A/T INOP iken TO/GA yalnızca F/D rehberliği verir.<\/li><li>Normal prosedür: yaklaşık 40% N1’e ilerlet, motorların stabilize olmasını bekle, sonra \"Verify that the correct takeoff thrust is set.\" \"Adjust takeoff thrust before 60 knots as needed.\"<\/li><li>\"After takeoff thrust is set, the captain's hand must be on the thrust levers until V1.\"<\/li><li>\"N1 limit reference is the active N1 limit for autothrottle and manual thrust control.\" N1 SET AUTO’dayken referans N1 bug’ları FMC limitini gösterir; ibreleri bug’lara getir.<\/li><\/ul>", "si": 6}, {"module": "brief", "ref": "FCOM 4.20.31 · 4.20.33 (PDF p1350, p1352)", "title": "A/T olmadan go-around", "html": "<p>\"An A/P go–around requires dual A/P operation ... If both A/Ps are not operating, a manual F/D go–around is available.\"<\/p><p>2000 ft RA altında ilk TO/GA basışı: \"A/T (if armed) engages in GA ... thrust advances toward the reduced go–around N1 to produce 1000 to 2000 fpm rate of climb\". İkinci basış \"the full go–around N1 limit\" verir. F/D pitch \"commands 15 degrees nose up until reaching programmed rate of climb\".<\/p><p>A/T INOP iken yalnızca F/D kısmı çalışır. PF thrust’ı elle set eder ve aynı 1,000–2,000 fpm tırmanışı hedefler.<\/p>", "si": 6}, {"module": "winter", "ref": "FCOM L.10.9 / L.10.10 (PDF p182–183)", "title": "Anti-ice’a bağlı limitler", "html": "<p>SP.16 anti-ice prosedürlerinin arkasında iki AFM limiti vardır:<\/p><ul><li><b>Engine Ignition:<\/b> \"Engine ignition must be on for: takeoff, landing, operation in heavy rain, anti-ice operation.\" ENGINE ANTI-ICE ON’dan önce ENGINE START’ın CONT’a alınmasının nedeni budur.<\/li><li><b>Flight Controls:<\/b> \"Holding in icing conditions with flaps extended is prohibited.\"<\/li><\/ul><p>SP.3.1 ayrıca engine ve wing anti-ice kullanım gerekliliklerinin \"are contained in Supplementary Procedures, Adverse Weather Section SP.16\" olduğunu belirtir. SP.16.2’deki icing conditions tanımı ve 10 °C caution’ı yukarıdaki OM-B metniyle aynıdır.<\/p>", "si": 0}, {"module": "winter", "ref": "FCOM 3.20.12–3.20.13, 3.10.4–3.10.5 (PDF p1281–1282, p1265–1266)", "title": "Engine anti-ice sistemi ve ışıkları", "html": "<p>\"Engine bleed air thermal anti–icing prevents the formation of ice on the engine cowl lip.\" Yerde ve uçuşta kullanılabilir. ENG ANTI-ICE ON, cowl anti-ice valfini açar ve \"sets stall warning logic for icing conditions\". <i>FMC’de gösterilen VREF otomatik olarak ayarlanmaz.<\/i><\/p><ul><li><b>COWL VALVE OPEN<\/b> (mavi): parlak (bright) ise valf hareket hâlindedir veya switch ile uyuşmuyordur; sönük (dim) ise açıktır (switch ON); sönmüşse kapalıdır.<\/li><li><b>COWL ANTI-ICE<\/b> (amber): cowl valfinin akış aşağısındaki kanalda aşırı basınç.<\/li><li>Engine display’deki <b>TAI<\/b>: yeşil, switch ON iken valfin açık olduğunu; amber, valfin switch’in gösterdiği konumda olmadığını belirtir. Amber TAI \"after a short delay\" gelir.<\/li><\/ul>", "si": 0}, {"module": "winter", "ref": "FCOM SP.3.1–SP.3.2 (PDF p314–315)", "title": "Cold-soaked fuel frost (CSFF)", "html": "<p>SP.3, kanat altındaki frost konusunda OM-B satırından daha fazla detay verir. Kanadın <b>alt<\/b> yüzeyinde kalınlık limiti olmadan CSFF ile kalkış için şunların <b>hepsi<\/b> gerekir: dış hava sıcaklığı \"at or above +4°C\", yağış veya görünür nem yok ve tank yakıtı −16 °C veya üzerinde. Hücum kenarları ve kumanda yüzeyleri de temiz olmalıdır.<\/p><p>\"If all of the above conditions are not met, takeoff with light coatings of frost, up to 1/8 inch (3 mm) in thickness, on lower wing surfaces due to cold fuel is allowable\". Daha kalın frost de-icing/anti-icing ile temizlenmelidir. Üst kanatta CSFF’ye yalnızca boyalı CSFF alanı içinde izin verilir ve FCOM bunun \"do[es] not constitute operational approval\" olduğunu not eder.<\/p><p><i>OPC-6 (−4 °C, SN): yalnızca alt yüzeydeki 3 mm izni uygulanabilir.<\/i><\/p>", "si": 1}, {"module": "winter", "ref": "FCOM SP.16.4–SP.16.5 (PDF p393–394)", "title": "COWL VALVE OPEN parlak kalırsa", "html": "<p>ENGINE ANTI-ICE ON’dan sonra FCOM, COWL VALVE OPEN ışıklarının önce parlak sonra sönük yandığını ve COWL ANTI-ICE ışıklarının söndüğünü doğrulamanı söyler. Işıklar \"remain illuminated bright with engines at IDLE\" ise:<\/p><ul><li>APU BLEED air switch’in OFF olduğunu doğrula,<\/li><li>ISOLATION VALVE switch’in AUTO’da olduğunu doğrula,<\/li><li>uçağın çevresinin boş olduğunu kontrol et ve<\/li><li>\"increase thrust slightly (up to a maximum of 30% N1)\".<\/li><\/ul><p>Yukarıdaki OM-B metninde bu not yoktur. <b>Effectivity:<\/b> ENGINE START switches CONT (F/O) adımı yalnızca TC-SEI – TC-SPP ve TC-SPS – TC-SUU için basılıdır. Ignition limiti (L.10.9) tüm uçaklar için geçerlidir.<\/p>", "si": 2}, {"module": "winter", "ref": "FCOM 3.20.14–3.20.15 (PDF p1283–1284)", "title": "Wing anti-ice: yerde nasıl çalışır", "html": "<p>Wing anti-ice bleed havasıyla \"the three inboard leading edge slats\" ısıtır. LE flap’leri ve outboard slat’ları ısıtmaz.<\/p><p>Yerde switch iki valfi yalnızca her iki motorun thrust’ı takeoff warning ayarının altındaysa ve her iki kanal sıcaklığı thermal switch ayarının altındaysa açar. \"Both valves close if either engine thrust is above the takeoff warning setting or either temperature sensor senses a duct overtemperature.\" Valfler otomatik olarak yeniden açılır. Bright/dim döngüsü notunun açıklaması budur.<\/p><p>\"The WING ANTI–ICE switch automatically trips OFF at lift–off\". SP.16.5 WARNING: \"Do not use wing anti-ice as an alternative for ground de-icing/anti-icing.\"<\/p>", "si": 2}, {"module": "winter", "ref": "FCOM SP.16.7–SP.16.9 (PDF p396–398)", "title": "Her de-icing adımının nedeni", "html": "<p>FCOM her adım için bir neden verir:<\/p><ul><li>APU: \"should be shut down unless APU operation is necessary\". İçeri alınan sıvı \"objectionable fumes and odors\" oluşturur; kar, buz veya sıvı \"can also cause damage to the APU\".<\/li><li>Flaps UP: \"Prevents ice and slush from accumulating in flap cavities during de-icing.\"<\/li><li>Thrust idle: \"Reduces the possibility of injury to personnel at inlet or exhaust areas.\"<\/li><li>Engine ve APU BLEED’leri OFF: \"Reduces the possibility of fumes entering the air conditioning system.\"<\/li><li>Engine BLEED’leri yaklaşık bir dakika sonra tekrar ON: \"to ensure all de-icing fluid has been cleared from the engines\".<\/li><\/ul><p>Rotasyon ve ilk tırmanış sırasında kanatta bir miktar seyreltilmemiş sıvı kalır. Etkisi geçicidir, bu yüzden \"Use the normal takeoff rotation rate.\"<\/p>", "si": 3}, {"module": "winter", "ref": "FCOM SP.16.1 (PDF p390)", "title": "Kontamine pistte kalkış", "html": "<ul><li>Islak pist: performans hesabı daha uzun durma mesafesini dikkate alıyorsa fixed derate, assumed temperature veya ikisi birlikte.<\/li><li>Slush, kar, durgun su veya buz: \"reduced thrust (fixed derate) is allowed provided takeoff performance accounts for the runway surface condition. Reduced thrust using assumed temperature method, whether alone or in combination with a fixed derate, is not allowed\".<\/li><li>Continued-takeoff pist uzunluğu ve mânia aşımı hâlâ gereklilikleri karşılıyorsa, daha fazla durma payı için V1 minimum V1’e düşürülebilir.<\/li><li>\"Takeoffs are not recommended when slush, wet snow, or standing water depth is more than 1/2 inch (13 mm) or dry snow depth is more than 4 inches (102 mm).\"<\/li><\/ul><p><i>Bu, OPC-6 OPT sonucuyla örtüşür: assumed temperature olmadan TO-2 fixed derate.<\/i><\/p>", "si": 4}, {"module": "winter", "ref": "FCOM 3.20.15 · SP.16.10–SP.16.12 (PDF p1284, p399–401)", "title": "Stall warning mantığı ve uçuştaki detaylar", "html": "<ul><li>Uçuşta wing anti-ice ON \"sets stall warning logic for icing conditions\". Bu mantık \"remains set for icing conditions for the remainder of the flight, regardless of subsequent WING ANTI–ICE switch position.\" FMC VREF otomatik olarak ayarlanmaz.<\/li><li>Yalnızca engine anti-ice kullanıldıysa, switch’ler OFF’a alındığında mantık ve hızlar normale döner, \"if wing anti–ice has not been used in flight\".<\/li><li>Uçuşta kanal sıcaklığı ve thrust mantığı devre dışıdır.<\/li><li>Fan buzunu temizleme: titreşim daha erken düşse bile thrust artışını en az 80% N1’e kadar sürdür. Titreşim \"can indicate full scale before shedding ice, however, this has no adverse effect on the engine.\" Thrust azaltıldıktan sonra 4.0 birim veya üzerindeyse Engine High Vibration NNC’yi uygula.<\/li><li>Ice detector ve ICING/NO ICE ışıkları yalnızca TC-SPN ve TC-SPP’de vardır; bu uçaklarda WARNING metnine \"or illumination of the ICING light\" eklenir.<\/li><\/ul>", "si": 5}, {"module": "winter", "ref": "FCOM SP.16.12–SP.16.14 (PDF p401–403)", "title": "Kuralların FCOM versiyonu", "html": "<p>\"Altimeter errors become significantly larger when the surface temperature approaches -30°C or colder\". Hata, referans kaynağın üzerindeki yükseklikle de büyür.<\/p><ul><li>Düzeltmeler \"apply to QNH and QFE operations.\"<\/li><li>\"The corrected altitude must always be greater than the published minimum altitude\". 6000 ft için 3000 ft düzeltmesinin iki katını kullan.<\/li><li>Radar vektörleri altında, ATC’nin verdiği bir FL’de veya \"When the reported airport temperature is above 0°C <b>or if the airport temperature is at or above the minimum published temperature for the procedure being flown<\/b>.\" gerekmez.<\/li><li>\"Regulatory authorities may have other requirements\".<\/li><\/ul><p><b>OM-B’den farklar:<\/b> FCOM’da \"corrected MSA\" limiti, RNP/LNAV-VNAV kuralları ve mPilot CTC aracı yoktur. Bunlar şirket metninden gelir. FCOM feet tablosunda 3000 ft’e kadar tam sütunlar vardır (ör. −10 °C’de: 1000 ft → 100, 2000 ft → 200).<\/p>", "si": 6}, {"module": "walk", "ref": "FCOM SP.16.8–SP.16.9 (PDF p397–398)", "title": "De-icing konfigürasyonu: FCOM sırası", "html": "<p>\"If de-icing/anti-icing is needed\":<\/p><ul><li>APU: gerektiği gibi (F/O). \"should be shut down unless APU operation is necessary.\"<\/li><li>\"FLAPS UP\" (C), Flaps UP (F/O).<\/li><li>Thrust levers: idle (C).<\/li><li>Stabilizer trim: ___ units (C), green band. Önce trim wheel kollarını katla (stow).<\/li><li>Engine BLEED air switches OFF, APU BLEED air switch OFF (F/O).<\/li><\/ul><p>De-icing sonrası: APU ve APU BLEED gerektiği gibi. Caution: \"After de-icing, the use of APU bleed air during takeoff can cause smoke in the airplane.\" Yaklaşık bir dakika bekle, sonra engine BLEED’leri ON. Gerekirse flight controls kontrolü (C). FCOM de-icing adımlarında engine anti-ice geçmez.<\/p>", "si": -1}, {"module": "walk", "ref": "FCOM SP.16.4–SP.16.5 · L.10.9 · 3.10.5 (PDF p393–394, p182, p1266)", "title": "Start sonrası engine anti-ice ON", "html": "<p>\"Engine anti-ice must be selected ON immediately after both engines are started and remain on during all ground operations when icing conditions exist or are anticipated.\"<\/p><p>WARNING: \"Do not rely on airframe visual icing cues before activating engine anti-ice.\" Bunun yerine sıcaklık ve görünür nem kriterlerini kullan.<\/p><ul><li>ENGINE START switches CONT (F/O). Bu adım TC-SEI – TC-SPP ve TC-SPS – TC-SUU için basılıdır. Tüm uçaklarda \"Engine ignition must be on for … anti-ice operation\" (L.10.9).<\/li><li>ENGINE ANTI-ICE switches ON (F/O). COWL VALVE OPEN önce parlak sonra sönük yanar, COWL ANTI-ICE sönük kalır ve engine display’de yeşil TAI görünür.<\/li><li>Idle’da bir ışık parlak kalırsa: APU BLEED OFF, ISOLATION AUTO, çevre boş, thrust’ı biraz artır (maks. 30% N1).<\/li><\/ul>", "si": -1}, {"module": "walk", "ref": "FCOM SP.16.7 · SP.16.9 (PDF p396, p398)", "title": "Taxi sırasında run-up’lar ve statik run-up", "html": "<p>\"When engine anti-ice is required and the OAT is 3°C or below, an engine run up is recommended to minimize ice build-up.\" PF arkadaki alanın boş olduğunu kontrol eder, sonra yaklaşık 30 saniye boyunca en az 70% N1’e run-up yapar, \"at intervals no greater than 30 minutes\". Fan buz birikimi kümülatiftir; fan de-ice edilmediyse taxi-in süresi de sayılır.<\/p><p>Freezing rain, freezing drizzle, freezing fog veya yoğun kar durumunda, en fazla 10 dakikalık aralıklarla yaklaşık 1 saniyelik 70% N1 run-up’ları \"enhance ice shedding\".<\/p><p>Kalkış: \"the takeoff must be preceded by a static engine run-up\" en az 70% N1’e; kalkış koşusundan önce stabil çalışma teyit edilir. \"A 30-second run-up is highly recommended whenever possible.\"<\/p><p>Birikmiş de-icing sıvısının üzerindeyken compressor stall riski nedeniyle thrust’ı gereken minimumla sınırla.<\/p>", "si": -1}, {"module": "walk", "ref": "FCOM SP.16.5 · 3.20.14–3.20.15 (PDF p394, p1283–1284)", "title": "Yerde wing anti-ice: Type II/IV ile kullanılmaz", "html": "<p>\"Use wing anti-ice during all ground operations between engine start and takeoff when icing conditions exist or are anticipated, unless the airplane is, or will be protected by the application of Type II or Type IV fluid in compliance with an approved ground de-icing program.\"<\/p><p>WARNING: \"an alternative for ground de-icing/anti-icing\" değildir. OAT 10 °C’nin üzerindeyken kullanma.<\/p><p>Kullanırsan (örneğin yalnızca Type I ile): valfler takeoff-warning thrust’ının üzerinde veya kanal aşırı ısınmasında kapanır ve \"The WING ANTI–ICE switch automatically trips OFF at lift–off\".<\/p><p><i>Type II sıvılı OPC-6: wing anti-ice OFF kalır.<\/i><\/p>", "si": -1}, {"module": "walk", "ref": "FCOM SP.16.1 · SP.16.6–SP.16.9 (PDF p390, p395–398)", "title": "Flaps, kalkış thrust’ı ve kanattaki sıvı", "html": "<ul><li>Buz, kar, slush veya durgun su üzerinden ya da donma altı sıcaklıkta yağış varken flaps yukarıda taxi yap: \"Taxiing with the flaps extended subjects the flaps and flap drives to contamination.\"<\/li><li>Kalkıştan önce, flaps’i beklettiysen kalkış flaps’ini set et ve yeşil LE FLAPS EXT ışığını doğrula. Flaps durursa lever’ı gösterilen konuma getir.<\/li><li>Kontamine pist: fixed derate’e izin var, assumed temperature \"is not allowed\". 13 mm üzeri slush, ıslak kar veya su ya da 102 mm üzeri kuru kar varsa kalkış önerilmez.<\/li><li>Kalıntı sıvı \"a temporary decrease in lift and increase in drag\" yaratır, bu yüzden \"Use the normal takeoff rotation rate.\"<\/li><\/ul>", "si": -1}, {"module": "lvo", "ref": "FCOM 4.20.21–4.20.23 (PDF p1340–1342)", "title": "Dual A/P ILS: 1500 ft RA altında ne olur", "html": "<p>APP’ye basmak \"permits selecting the second A/P to engage in CMD. This arms the second A/P for automatic engagement after LOC and G/S capture and when descent below 1500 RA occurs.\"<\/p><ul><li><b>1500 ft RA altında:<\/b> ikinci A/P couple olur, ILS deviation monitor testi yapılır (G/S ve LOC skalaları amber yanıp söner), FLARE armed olur, SINGLE CH söner, A/P go-around arm olur (annunciate edilmez).<\/li><li><b>800 ft RA:<\/b> \"The second A/P must be engaged in CMD by 800 feet RA to execute a dual channel A/P approach.\"<\/li><li><b>400 ft RA:<\/b> stabilizer ilave olarak burun yukarı trimlenir; A/P’ler bundan sonra disengage olursa ileri yönde kumanda (column) kuvveti gerekebilir.<\/li><li>\"If FLARE is not armed by approximately 350 feet RA, both A/Ps automatically disengage.\"<\/li><li><b>~50 ft:<\/b> FLARE engage olur · <b>~27 ft:<\/b> A/T RETARD · A/T touchdown’dan ~2 s sonra disengage olur.<\/li><\/ul><p><i>Not:<\/i> FLARE armed olduktan sonra \"any attempted manual override of the autopilots may result in an autopilot disengage.\"<\/p>", "si": 0}, {"module": "lvo", "ref": "FCOM 4.20.20 · 4.20.5–4.20.6 (PDF p1339, p1324–1325)", "title": "Fail-passive ve fail-operational autoland", "html": "<p><b>Çoğu uçak (fail-passive):<\/b> dual A/P \"fail–passive operation through landing flare and touchdown or an automatic go–around.\" sağlar. ROLLOUT modu yoktur: \"the A/P must be manually disengaged after touchdown. Landing roll-out is executed manually after disengaging the A/P.\"<\/p><p><b>Fail-operational uçaklar (TC-SEI–SEZ, TC-SOA–SOH, TC-SPF–SPI, TC-SPP):<\/b><\/p><ul><li><b>LAND 3<\/b>: \"two autopilots, three inertial sources, and the associated sensors are operating normally for an automatic landing and rollout.\"<\/li><li><b>LAND 2<\/b>: \"a failure has occurred above Alert Height and redundancy is reduced\"; autoland ve rollout hâlâ mümkündür.<\/li><li><b>NO AUTOLAND<\/b>: \"FLARE and ROLLOUT will not arm\".<\/li><\/ul><p>Bu uçaklarda 500 ft RA’da \"the pilot is required to check for the presence of LAND 3 or LAND 2 in order to continue the autoland.\" ROLLOUT yaklaşık 2 ft RA’da devreye girer ve localizer merkez hattını takip eder.<\/p>", "si": 0}, {"module": "lvo", "ref": "FCOM NP.21.65 · 4.20.5 · NP.21.76–77 (PDF p264, p1324, p275–276)", "title": "PM kontrolleri: 500 ft, SINGLE CH, touchdown sonrası", "html": "<ul><li>Landing Procedure – ILS: \"If an autoland is planned, verify the AFDS status at 500 feet AGL\" (fail-operational uçaklar: \"verify the autoland status\").<\/li><li>Dual yaklaşmada <b>SINGLE CH<\/b> \"annunciates after localizer capture and extinguishes after pitch monitor confidence test is successfully completed.\" Single A/P yaklaşmada ise yaklaşma boyunca yanık kalır.<\/li><li>\"For a single channel approach, disengage the autopilot and autothrottle no later than the minimum use height for single autopilot operation. For a dual channel approach, disengage the autopilot after touchdown.\"<\/li><li>İniş koşusu, PM: SPEED BRAKE lever’ın UP olduğunu doğrula ve \"SPEED BRAKES UP\" de, ardından \"REVERSERS NORMAL\" ve \"60 KNOTS\".<\/li><li>Fail-operational uçaklar: \"If an autoland was accomplished, disengage the autopilot before turning off the runway.\"<\/li><\/ul>", "si": 1}, {"module": "lvo", "ref": "FCOM 4.20.31–4.20.33 (PDF p1350–1352)", "title": "Dual A/P yaklaşmadan go-around", "html": "<p>\"An A/P go–around requires dual A/P operation and is armed when FLARE armed is annunciated. If both A/Ps are not operating, a manual F/D go–around is available.\"<\/p><ul><li>2000 ft RA altında ilk TO/GA basışı: A/T <b>GA<\/b>’da engage olur; thrust azaltılmış go-around N1’e doğru ilerler \"to produce 1000 to 2000 fpm rate of climb\". Pitch TO/GA’da engage olur ve F/D 15° burun yukarı komut eder.<\/li><li>İkinci basış: \"the A/T advances to the full go–around N1 limit.\"<\/li><li>\"below 400 feet RA, the AFDS remains in the go–around mode unless both A/Ps and F/Ds are disengaged\". 400 ft RA üzerinde yeni bir pitch veya roll modu seç.<\/li><li>Önce pitch modu değiştirilirse \"the second A/P disengages\" ve roll CWS R’ye geçer.<\/li><li>Fail-passive uçaklar: touchdown’dan sonra TO/GA’ya basılırsa A/P disengage olur ve A/T GA thrust komut edebilir.<\/li><\/ul>", "si": 1}, {"module": "lvo", "ref": "FCOM L.10.7–L.10.8 (PDF p180–181)", "title": "Boeing AFM autopilot / autoland limitleri", "html": "<ul><li>\"Use of aileron trim with the autopilot engaged is prohibited.\"<\/li><li>EASA: \"The Minimum Use Height (MUH) for single channel autopilot operation is defined as 158 feet AGL.\"<\/li><li>Dual channel Cat II/III autoland için EASA maksimum rüzgârları: <b>headwind 25 kt<\/b>. Crosswind <b>20 veya 25 kt<\/b>, tailwind <b>10, 12 veya 15 kt<\/b>; uçağa ve flaps’e bağlıdır (uçak bazında effectivity L.10.7–8’de).<\/li><li>\"Maximum and minimum glideslope angles for autoland are 3.25 degrees and 2.5 degrees respectively.\"<\/li><li>\"Autoland capability may only be used with flaps 30 or 40 and both engines operative.\"<\/li><li>\"Do not use LVL CHG on final approach below 1000 feet AFE.\"<\/li><\/ul><p><i>Yukarıdaki şirket OM-B rüzgâr limitleri Boeing değerlerinden düşüktür. Daha kısıtlayıcı limiti uygula.<\/i><\/p>", "si": 3}, {"module": "lvo", "ref": "FCOM 4.20.24–4.20.25 · 4.10.26 (PDF p1343–1344, p1315)", "title": "Single A/P ILS limitleri, beam anomaly, AUTOLAND ışığı", "html": "<p><b>Single A/P ILS<\/b> (CMD’de tek A/P): \"full automatic flare and touchdown capability is not available. FLARE is not annunciated and stabilizer trim bias is not applied\". SINGLE CH yaklaşma boyunca görünür ve \"an A/P go–around is not available\".<\/p><p><b>Beam anomaly:<\/b> single channel veya yalnızca F/D ile yaklaşmada \"the autopilot will disengage and/or the F/D bars will be removed if a persistent localizer/glideslope beam anomaly or ground station failure is detected.\" LAND 3/LAND 2 sonrası fail-operational uçaklarda: skala amber yanıp söner, FMA modunun üzerinden amber bir çizgi geçer (\"mode fail\") ve A/P elle disengage edilene kadar engage kalır.<\/p><p><b>AUTOLAND light<\/b> (yalnızca TC-SPM, TC-SPO): dual A/P ILS’te 500 ft altında arm olur. A/P disengage olursa, stab trim uyarısı gelirse veya \"ILS deviation occurs below 200 feet.\" durumunda kırmızı yanıp söner.<\/p>", "si": 3}, {"module": "app", "ref": "FCOM SP.4.6–SP.4.7 (PDF p325–326)", "title": "Boeing circling yaklaşma prosedürü", "html": "<p>\"If a missed approach is needed at any time while circling, make an initial climbing turn toward the landing runway and intercept the missed approach course.\"<\/p><ul><li>MDA(H)’de konfigürasyon: <b>gear down, flaps 15, speedbrake armed<\/b>.<\/li><li>\"Set the MCP altitude to the nearest 100 foot increment at or above the MDA(H).\" Görsel referansı kur ve MCP irtifasında level-off yap. ALT HLD’yi doğrula.<\/li><li>MCP’ye missed approach irtifasını set et, HDG SEL’e bas.<\/li><li>Base’e dönüşe başlamadan önce: landing flaps (seçilmediyse) ve LANDING checklist’i yap.<\/li><li>İniş profiline girerken: autopilot ve autothrottle disengage switch’lerine bas.<\/li><\/ul>", "si": 0}, {"module": "app", "ref": "FCOM L.10.8 · L.10.10 · L.10.13 · SP.16.28 (PDF p181, p183, p186, p417)", "title": "Final yaklaşma için FCOM maddeleri", "html": "<ul><li>\"Do not use LVL CHG on final approach below 1000 feet AFE.\"<\/li><li>\"Do not deploy the speedbrakes in flight at radio altitudes less than 1,000 feet.\"<\/li><li>Windshear’dan şüpheleniliyorsa: \"Establish a stabilized approach no lower than 1000 feet above the airport to improve windshear recognition capability\" ve flaps 30 kullan.<\/li><li>A/T disengage ise veya inişten önce disengage edilecekse, \"up to a maximum of 15 knots\" hız düzeltmesi ekle (gust gibi uygulanır).<\/li><li>Landing gear limiti: \"Do not apply brakes until after touchdown.\" (L.10.13)<\/li><\/ul>", "si": 1}, {"module": "app", "ref": "FCOM NP.21.74–NP.21.75 (PDF p273–274)", "title": "Go-around ve missed approach, PF/PM", "html": "<ul><li><b>PF:<\/b> TO/GA’ya bas, \"FLAPS 15\" de (veya gerektiği gibi), go-around attitude’una rotasyonu ve thrust’ın yeterli olduğunu doğrula.<\/li><li><b>PM:<\/b> thrust’ın arttığını doğrula, flaps’i set et, altimetrede pozitif tırmanışı doğrula ve \"POSITIVE RATE\" de. PF \"GEAR UP\" der, PM gear lever’ı UP’a alır.<\/li><li>\"If the airspeed is within the amber band, limit bank angle to 15°.\"<\/li><li>400 ft RA üzerinde LNAV’ı doğrula veya HDG SEL seç. Missed approach rotasının takip edildiğini doğrula.<\/li><li>Acceleration height’ta flaps’i programa göre topla. Flap manevra hızında veya üzerinde LVL CHG veya VNAV seç ve climb thrust’ı doğrula.<\/li><li>Gear toplandıktan sonra gear lever OFF, ardından AFTER TAKEOFF checklist.<\/li><\/ul>", "si": 1}, {"module": "app", "ref": "FCOM PD.14.6 · PI.17.9–17.10 (PDF p475, p744–745)", "title": "İniş ağırlığı ve sıcak frenler", "html": "<p>\"Maximum landing weight is the lowest of the field length limit weight, climb limit weight, or maximum certified landing weight.\" Sertifikalı değer Limitations L.10.5’tedir ve uçağa göre değişir.<\/p><p>\"If the landing weight exceeds the maximum quick turnaround weight, wait the specified time and then check that the wheel thermal plugs have not melted before executing a subsequent takeoff.\"<\/p><p>Recommended Brake Cooling Schedule: \"Use of the recommended cooling schedule will help avoid brake overheat and fuse plug problems\". BTMS varsa \"use the hottest brake indication 10 to 15 minutes after the airplane has come to a complete stop\". Süreler yerde soğuma ve uçuşta gear-down soğuma için verilir.<\/p><p><i>FCOM’da ayrı bir overweight landing prosedürü yoktur. QRH’yi kullan.<\/i><\/p>", "si": 3}, {"module": "app", "ref": "FCOM L.10.10 · L.10.8 · 4.20.25 · PI.17.12 (PDF p183, p181, p1344, p747)", "title": "OEI iniş: FCOM limitleri ve otomasyon", "html": "<ul><li>EASA: \"Flaps 15 normal landings are prohibited. A Flaps 15 landing may be performed when required by a non-normal procedure.\"<\/li><li>Autoland limiti: \"flaps 30 or 40 and both engines operative\". Fail-operational uçaklarda (TC-SEI–SEZ, TC-SOA–SOH, TC-SPF–SPI, TC-SPP) EASA, OEI autoland’e \"with flaps 30 ... and only for DH at or above 50 feet.\" izin verir.<\/li><li>\"Automatic engine out rudder compensation is provided during A/P approach and landing.\" A/P go-around sonrasında bu, \"until another roll mode is selected.\" devam eder.<\/li><li>PI: \"Gear Down Landing Rate of Climb Available\" tabloları (flaps 15 ve 30) \"in the event an engine inoperative landing (manual or autoland) is planned.\" için verilir.<\/li><li>Bazı uçaklarda \"sufficient tail clearance margin during a one engine inoperative flaps 15° landing\" sağlayan beyaz bir VREF bug’ı görünür (10.31.2).<\/li><\/ul>", "si": 4}, {"module": "app", "ref": "FCOM 15.20.6–15.20.7 (PDF p2499–2500)", "title": "Landing gear konfigürasyon uyarıları", "html": "<p><b>Kırmızı gear ışığı:<\/b> gear lever ile uyuşmuyorsa veya \"landing gear is not down and locked (with either or both forward thrust levers retarded to idle, and below 800 feet AGL)\".<\/p><p><b>Sürekli korna<\/b> (herhangi bir gear down and locked değilse):<\/p><ul><li><b>Flaps up–10:<\/b> 800 ft RA altında, bir thrust lever idle ile yaklaşık 20° arasındayken (veya bir motor çalışmıyorken diğer lever 34° altındayken). Korna HORN CUTOUT ile susturulabilir, ancak \"if the airplane descends below 200 feet RA, the warning horn cannot be silenced\".<\/li><li><b>Flaps 15–25:<\/b> thrust lever yaklaşık 20° altındayken (veya OEI’de 34° altındayken). Susturulamaz.<\/li><li><b>Flaps 25’ten büyükken:<\/b> \"regardless of forward thrust lever position\". Susturulamaz.<\/li><\/ul><p>\"The warning indication is cancelled when the configuration error is corrected.\"<\/p>", "si": 5}, {"module": "ws", "ref": "FCOM 15.20.24–15.20.26 (PDF p2517–2519)", "title": "Reactive ve predictive windshear uyarıları", "html": "<ul><li><b>GPWS (uçak windshear içinde):<\/b> iki tonlu siren ve 3 kez \"WINDSHEAR\", iki PFD’de kırmızı WINDSHEAR. \"Enabled below 1,500 feet RA. GPWS Windshear detection begins at rotation.\"<\/li><li><b>WINDSHEAR AHEAD<\/b> (kalkış), kırmızı: windshear \"close to and directly ahead\", 1,200 ft RA altında.<\/li><li><b>GO AROUND, WINDSHEAR AHEAD<\/b> (yaklaşma), kırmızı: \"Windshear within 1.5 miles and directly ahead\", 1,200 ft RA altında.<\/li><li><b>MONITOR RADAR DISPLAY<\/b>, amber: \"Windshear within 3 miles and ahead\", kalkış ve yaklaşmada, 1,200 ft RA altında.<\/li><\/ul><p>\"Predictive windshear alerts are inhibited by an actual windshear warning (airplane in windshear), look-ahead terrain alerts, or radio altitude based alerts.\" Radar \"does not provide alerting for all types of windshear.\"<\/p>", "si": 0}, {"module": "ws", "ref": "FCOM 15.20.27–15.20.30 · 15.10.18 (PDF p2520–2523, p2489)", "title": "PWS aktivasyonu, inhibit’ler ve ND gösterimi", "html": "<ul><li>Radar, thrust lever’lar kalkış için set edildiğinde veya uçuşta, radar tipine bağlı olarak 2,300 ft ya da 1,800 ft RA altında windshear taramasına başlar. Uyarılar yalnızca 1,200 ft RA altında verilir.<\/li><li>\"Alerts are available approximately 12 seconds after the weather radar begins scanning for windshear.\"<\/li><li>Inhibit’ler (TC-SEI–SEZ, TC-SOA–SOH, TC-SPH–SPJ, TC-SPM–SPO, TC-SPS–SPU): yeni caution’lar şu aralıkta inhibit edilir: \"between 80 knots and 400 feet RA, and new warning alerts between 100 knots and 50 feet RA. These inhibits do not remove existing predictive windshear alerts.\"<\/li><li>ND’de kırmızı/siyah windshear sembolü ve amber radyaller expanded MAP, center MAP, expanded VOR veya expanded APP’te otomatik görünür. WINDSHEAR yazısı (amber caution / kırmızı warning) \"Shows in all navigation display modes.\"<\/li><\/ul>", "si": 0}, {"module": "ws", "ref": "FCOM SP.16.26–SP.16.28 (PDF p415–417)", "title": "Windshear’dan kaçınma ve önlemler", "html": "<p>\"If the presence of windshear is confirmed, delay takeoff or do not continue an approach.\" İpuçları arasında thunderstorm’lar, virga, PIREP’ler ve LLWAS uyarıları vardır.<\/p><p><b>Kalkış:<\/b> full rated thrust önerilir. Uygun en uzun pisti kullan. Vr’yi artırmayı düşün: \"not to exceed actual gross weight Vr + 20 knots\". \"If stick shaker is encountered, reduce pitch attitude. Do not exceed the Pitch Limit Indication.\"<\/p><p><b>Yaklaşma:<\/b> flaps 30, 1000 ft’e kadar stabilized. A/T kapalıysa 15 kt’a kadar hız düzeltmesi ekle. Ani hız artışlarında büyük thrust azaltmalarından kaçın. \"The pilot monitoring should call out any deviations from normal.\"<\/p>", "si": 0}, {"module": "ws", "ref": "FCOM 4.20.39 (PDF p1358)", "title": "AFDS windshear’da nasıl davranır", "html": "<p><b>TO/GA (F/D veya A/P):<\/b> F/D, dikey hız yaklaşık +600 fpm’e düşene kadar hedef hızı tutar, sonra \"commands a 15 degree nose–up pitch attitude\". Gerekirse \"pitch attitudes which result in intermittent activation of the stick shaker.\" komut eder.<\/p><p><b>ILS yaklaşma:<\/b> F/D ve A/P irtifayı veya glideslope’u \"without regard to angle of attack or stick shaker limitations. Airspeed could decrease below stick shaker and into a stall if the pilot does not intervene by pushing the TO/GA switch or disengaging the A/P\" tutar.<\/p><p><b>WARNING:<\/b> mürettebat \"must, if necessary to avoid ground contact, be prepared to disengage the autothrottle, advance thrust levers to the forward stop, disengage the autopilot and manually fly the airplane.\"<\/p>", "si": 1}, {"module": "ws", "ref": "FCOM Bulletin SNS-98 R3, B-98 p5 · NP.21.76 (PDF p135, p275)", "title": "FCOM’da ORW", "html": "<p>FCOM Warning Systems bölümünde <b>ORW sistem tanımı yoktur<\/b>. FCOM’daki tek bahis 5G bulletin’indedir: \"In-Air Overrun, On-Ground Overrun and SPEEDBRAKE warnings may not be available or may be erroneous (as installed)\". Aynı bulletin, windshear algılamanın (predictive ve reactive) çalışmayabileceğini de söyler.<\/p><p>Normal Landing Roll Procedure’da da aynı durdurma eylemleri ve call’lar vardır: PM, SPEED BRAKE lever’ın UP olduğunu doğrular ve \"SPEED BRAKES UP\" / \"SPEED BRAKES NOT UP\" der, ardından \"REVERSERS NORMAL\" ve \"60 KNOTS\" der.<\/p><p><b>WARNING:<\/b> \"After the reverse thrust levers are moved, only a full stop landing can be made.\"<\/p>", "si": 2}, {"module": "stall", "ref": "FCOM 15.20.8–15.20.9 · 15.10.5 (PDF p2501–2502, p2476)", "title": "Stall uyarı sistemi (stick shaker)", "html": "<p>\"Natural stall warning (buffet) usually occurs at a speed prior to stall. In some configurations the margin between stall and natural stall warning is less than desired.\" Bu yüzden stick shaker kullanılır.<\/p><ul><li>Her kolonda (column) bir tane olmak üzere iki eksantrik ağırlıklı motor vardır. \"The system is armed in flight at all times. The system is deactivated on the ground.\"<\/li><li>İki SMYD bilgisayarı AOA vane, ADIRU, anti-ice, kanat konfigürasyonu, air/ground ve thrust girdilerini kullanır. Bunlar stick shaker’ı, pitch limit indicator’ı, airspeed display band’lerini ve GPWS windshear alert’ini sürer.<\/li><li>Test (yalnızca yerde): No.1 Kaptan’ın kolonunu, No.2 F/O’nun kolonunu titretir. \"Either stick shaker vibrates both columns through column interconnects.\"<\/li><\/ul>", "si": 0}, {"module": "stall", "ref": "FCOM 10.31.2 · 10.11.18 (PDF p1743, p1593)", "title": "Pitch Limit Indication (PLI)", "html": "<p>PLI (amber) \"Indicates pitch limit (stick shaker activation for existing flight conditions).\"<\/p><p>\"A pitch limit indication is displayed at all times when the flaps are not up, or when flaps are up and airspeed approaches stick shaker activation for existing flight conditions.\" (TC-SNV’de yalnızca flaps up değilken görünür.)<\/p><p>Escape maneuver ve windshear önlemleri: \"Do not exceed the Pitch Limit Indication.\"<\/p>", "si": 0}, {"module": "stall", "ref": "FCOM 9.20.11 (PDF p1554)", "title": "Stall tanıma: EFS ve speed trim", "html": "<ul><li>\"The EFS module increases hydraulic system A pressure to the elevator feel and centering unit during a stall. This approximately doubles control column forces.\"<\/li><li>EFS yerde, 100 ft RA altında veya autopilot bağlıyken inhibit edilir. \"There are no flight deck indications that the system is properly armed or activated.\"<\/li><li>\"As airspeed decreases towards stall speed, the speed trim system trims the stabilizer nose down ... With this trim schedule the pilot must pull more aft column to stall the airplane.\"<\/li><li>Yüksek AOA’da SMYD, yaw damper’ın komut ettiği rudder hareketini azaltır.<\/li><\/ul>", "si": 0}, {"module": "stall", "ref": "FCOM 4.20.40–4.20.42 · 15.20.31 (PDF p1359–1361, p2524)", "title": "Minimum speed reversion ve AIRSPEED LOW", "html": "<p>Minimum speed \"is approximately 1.3 Vs for the current flap configuration.\" Bu hızda veya biraz altında underspeed sembolü görünür ve V/S (veya CWS P) LVL CHG’ye döner; VNAV PTH de level segment dışında döner. Çoğu tail’de flaps 12.5’ten büyükken vertical speed modlarından reversion olmaz.<\/p><p>\"Minimum speed reversion is not available when the A/T is OFF and the AFDS is in ALT HOLD or after G/S capture.\"<\/p><p>\"The A/P disengages and the F/D command bars retract when in a LVL CHG climb with a command speed equal to minimum speed and a minimum rate of climb cannot be maintained\".<\/p><p>\"AIRSPEED LOW, AIRSPEED LOW\" uyarısı \"when the current airspeed decreases into the minimum maneuver speed amber bar.\" durumunda duyulur.<\/p>", "si": 0}, {"module": "stall", "ref": "FCOM 15.20.30–15.20.31 (PDF p2523–2524)", "title": "BANK ANGLE uyarısı", "html": "<p>GPWS aural \"BANK ANGLE, BANK ANGLE\":<\/p><ul><li>Bazı tail’lerde: 35°, 40° ve 45° bank’te.<\/li><li>Diğer tail’lerde radio altitude’a göre: 5–30 ft AGL’de 10° bank üzerinde; 30–130 ft arasında 10°’den 35°’ye doğrusal olarak değişir; 130 ft üzerinde 35°, 40° veya 45°’de.<\/li><li>\"Once sounded, the alert is silent for that bank angle until the system is reset by decreasing the bank angle to 30 degrees or less.\"<\/li><\/ul>", "si": 1}, {"module": "gpws", "ref": "FCOM 15.20.13–15.20.14 (PDF p2506–2507)", "title": "İki GPWS uyarı ailesi", "html": "<p><b>Radio altitude based alerts<\/b> şunları kapsar: \"excessive descent rate · excessive terrain closure rate · altitude loss after takeoff or go-around · unsafe terrain clearance when not in the landing configuration · excessive deviation below the ILS or GLS glideslope\".<\/p><p><b>Look-ahead terrain alerts<\/b> EGPWS’in dünya çapındaki arazi veritabanından gelir, \"based on estimated time to impact.\" Barometrik irtifanın 2,000 ft yakınındaki arazi ND’de görünür. \"The terrain data is not designed to be an independent navigation aid.\"<\/p><p><b>Not:<\/b> \"Terrain ahead of the airplane may exceed available climb performance. A ground proximity alert does not guarantee terrain clearance.\" İki aile de \"are inhibited by an actual windshear warning.\"<\/p>", "si": 0}, {"module": "gpws", "ref": "FCOM 15.20.15 · 15.20.17 (PDF p2508, p2510)", "title": "Look-ahead terrain ve obstacle uyarıları", "html": "<ul><li><b>CAUTION TERRAIN<\/b>: amber TERRAIN, ND’de düz (solid) amber arazi, \"40 to 60 seconds from projected impact\".<\/li><li><b>TERRAIN TERRAIN, PULL UP<\/b>: her iki attitude indicator’da PULL UP, kırmızı TERRAIN, düz kırmızı arazi, \"20 to 30 seconds from projected impact\".<\/li><li><b>TOO LOW, TERRAIN<\/b> (look-ahead): \"Descent below unsafe altitude while too far from any airport in the terrain database.\"<\/li><li>Obstacle’lar (çoğu tail): 40–60 s’de \"CAUTION OBSTACLE\" ve 20–30 s’de \"OBSTACLE OBSTACLE, PULL UP\"; 100 ft ve daha yüksek insan yapımı engeller için.<\/li><li>Bunların tümü TERR INHIBIT switch’i ile inhibit edilir.<\/li><\/ul>", "si": 0}, {"module": "gpws", "ref": "FCOM 15.20.16–15.20.17 (PDF p2509–2510)", "title": "Radio altitude tabanlı uyarılar", "html": "<ul><li><b>SINK RATE<\/b>: aşırı alçalma hızı. <b>PULL UP<\/b> \"Follows SINK RATE alert if excessive descent rate continues or increases\".<\/li><li><b>TERRAIN<\/b>: aşırı arazi yaklaşma hızı. Devam ederse ve gear ve/veya flaps iniş konfigürasyonunda değilse ardından PULL UP gelir.<\/li><li><b>DON'T SINK<\/b>: \"Excessive altitude loss after takeoff or go–around.\"<\/li><li><b>TOO LOW, GEAR<\/b> / <b>TOO LOW, FLAPS<\/b>: düşük hızda, gear aşağıda değilken veya flaps iniş pozisyonunda değilken güvensiz arazi açıklığı.<\/li><li><b>TOO LOW, TERRAIN<\/b> (radio altitude): yüksek hız ve iniş konfigürasyonunda değil.<\/li><li><b>GLIDESLOPE<\/b> (BELOW G/S light): BELOW G/S P-INHIBIT light’ı \"cancels or inhibits the alert below 1,000 feet RA.\"<\/li><\/ul>", "si": 1}, {"module": "gpws", "ref": "FCOM 15.10.9–15.10.12 (PDF p2480–2483)", "title": "GPWS paneli: INOP, test ve inhibit switch’leri", "html": "<ul><li><b>GPWS INOP<\/b> (amber): bilgisayar arızası veya güç kaybı ya da geçersiz girdiler (RA, ADIRU, ILS, IRS, FMC, stall management computers, EFIS panel).<\/li><li><b>SYS TEST<\/b>: yerde tam test. \"system test inhibited in-flight\".<\/li><li><b>FLAP INHIBIT<\/b>: TOO LOW FLAPS’i inhibit eder. <b>GEAR INHIBIT<\/b>: TOO LOW GEAR’ı inhibit eder.<\/li><li><b>TERR INHIBIT<\/b>: \"inhibits look–ahead terrain alerts and terrain display.\" Radio altitude tabanlı uyarılar etkilenmez.<\/li><li><b>RUNWAY INHIBIT<\/b> / RUNWAY INOP: yalnızca RAAS’lı tail’ler (TC-SPH–SPJ, TC-SPN, TC-SPP, TC-SPS).<\/li><\/ul>", "si": 2}, {"module": "gpws", "ref": "FCOM 15.10.15–15.10.17 (PDF p2486–2488)", "title": "Terrain display renkleri", "html": "<ul><li>Düz kırmızı / düz amber: look-ahead warning / caution aktif.<\/li><li>Noktalı kırmızı: arazi \"more than 2,000 feet above airplane's current altitude\".<\/li><li>Noktalı amber: \"Terrain 500 feet (250 feet with gear down) below to 2,000 feet above\".<\/li><li>Noktalı yeşil: 2,000 ft aşağıdan 500 ft (gear down iken 250 ft) aşağıya kadar. Noktalı magenta: arazi verisi yok.<\/li><li>Pilotlardan hiçbiri terrain seçmemişse look-ahead alert’te otomatik olarak görünür (expanded MAP, center MAP, expanded VOR, expanded APP).<\/li><\/ul><p>\"In areas without terrain data, look-ahead terrain alerting and display functions are not available. Radio altitude based terrain alerts function normally.\"<\/p>", "si": 2}, {"module": "gpws", "ref": "FCOM 15.20.35–15.20.36 · 15.10.20 (PDF p2528–2529, p2491)", "title": "TCAS TA ve RA", "html": "<ul><li>\"A traffic advisory (TA) is generated when the other airplane is approximately 40 seconds from the point of closest approach.\" \"TRAFFIC, TRAFFIC\" aural’ı bir kez duyulur.<\/li><li>\"a resolution advisory (RA) is generated when the other airplane is approximately 25 seconds from the point of closest approach.\"<\/li><li>\"If altitude data from the traffic aircraft's transponder is not available, no RA can be provided.\" Çalışan transponder’ı olmayan uçaklar için hiç gösterim yoktur.<\/li><li>Proximate traffic: \"within six miles and 1200 feet vertically\".<\/li><li>Transponder selector: TA (veya TA ONLY) yalnızca TA hedeflerini gösterir. TA/RA ikisini de etkinleştirir.<\/li><li>RA’lar PFD attitude alanında, bazı tail’lerde ayrıca V/S alanında görünür (10.31.6).<\/li><\/ul>", "si": 3}, {"module": "gpws", "ref": "FCOM 15.20.36–15.20.38 (PDF p2529–2531)", "title": "TCAS inhibit’leri ve RA aural’ları", "html": "<ul><li>\"INCREASE DESCENT RAs are inhibited below approximately 1,500 feet radio altitude.\"<\/li><li>\"DESCEND RAs are inhibited below approximately 1,100 feet radio altitude.\"<\/li><li>\"RAs are inhibited below approximately 1,000 feet radio altitude.\" TA/RA seçiliyken otomatik olarak yalnızca TA etkinleşir ve ND’de TA ONLY görünür.<\/li><li>\"All TCAS voice annunciations are inhibited below approximately 500 feet radio altitude.\"<\/li><li>\"All TCAS alerts are inhibited by GPWS and windshear warnings.\"<\/li><\/ul><p>RA aural’ları arasında CLIMB, DESCEND, crossing ve INCREASE versiyonları, \"CLIMB – CLIMB NOW\" / \"DESCEND – DESCEND NOW\" reversal’ları ve LEVEL OFF (TC-SPC/SPD’de ADJUST VERTICAL SPEED) vardır. Hepsi \"CLEAR OF CONFLICT\" ile biter.<\/p>", "si": 3}, {"module": "rto", "ref": "FCOM NP.21.43–44 (PDF p242–243)", "title": "Takeoff Procedure: thrust set, 80 kt, V1", "html": "<p>Normal Procedures, Takeoff Procedure:<\/p><ul><li>\"Advance the thrust levers to approximately 40% N1. Allow the engines to stabilize. Push the TO/GA switch.\" \"Verify that the correct takeoff thrust is set.\"<\/li><li>\"Adjust takeoff thrust before 60 knots as needed.\" Ardından \"THRUST SET\" call’ı yapılır.<\/li><li><b>\"After takeoff thrust is set, the captain's hand must be on the thrust levers until V1.\"<\/b><\/li><li>PM: \"Call '80 KNOTS'.\" PF: \"Verify 80 knots and call 'CHECK'.\"<\/li><li>\"Monitor the engine instruments during the takeoff. Call out any abnormal indications.\" \"Monitor airspeed and call out any abnormal indications.\"<\/li><\/ul><p><i>V1 callout: tail’e göre otomatik V1 callout veya \"V1\" call’ı.<\/i><\/p>", "si": 0}, {"module": "rto", "ref": "FCOM 14.20.4–14.20.5, 14.10.4 (PDF p2463–2464, p2453)", "title": "Autobrake RTO modu", "html": "<p>F/O Preflight Procedure’da AUTO BRAKE select switch’i <b>RTO<\/b>’ya alınır ve \"that the AUTO BRAKE DISARM light is extinguished\" doğrulanır (NP.21.22).<\/p><ul><li>Seçildiğinde AUTO BRAKE D
